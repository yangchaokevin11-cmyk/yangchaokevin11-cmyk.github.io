nions?","能不要洋葱吗？"],["A medium Coke, please.","一杯中杯可乐。"],["Can I make it a large?","能升级成大份吗？"],["Is it for here or to go?","在这吃还是带走？"],["Could I get some extra ketchup?","能多给点番茄酱吗？"],["I think you forgot my fries.","你好像忘了我的薯条。"]],"d":{"intro":"你在快餐店柜台点餐。","turns":[{"o":"Hi, what can I get for you?","h":"点一个芝士汉堡套餐，不要洋葱","a":"Can I get a cheeseburger meal without onions?"},{"o":"Sure. What would you like to drink?","h":"要中杯可乐","a":"A medium Coke, please."},{"o":"For here or to go?","h":"说在这吃","a":"For here."},{"o":"(Later) Here's your order.","h":"说好像忘了你的薯条","a":"Sorry, I think you forgot my fries."},{"o":"Oh, my mistake! Here you go.","h":"道谢，并要多点番茄酱","a":"Thanks. Could I get some extra ketchup too?"}]},"c":"美国快餐店的 meal 是套餐：主食加薯条加饮料。饮料常常是自己去机器接，可以免费续杯（free refills）。","n":[[1,"without + 东西，就是不要某样东西，说 no onions 也行。",[["No onions, please.","不要洋葱。"],["Can I get extra cheese?","能多加点芝士吗？"]]],[3,"make it a large 是换成大份，加一点钱升级套餐。",[["Can I upgrade to a large?","能升级成大份吗？"],["Can I get a large instead?","能换成大份吗？"]]]]},{"t":"At the farmers market","zh":"农贸市场","k":"life","s":[["How much are the tomatoes?","番茄多少钱？"],["Are these grown locally?","这些是本地种的吗？"],["Can I try one?","我能尝一个吗？"],["I'll take a pound of these.","这个我要一磅。"],["Do you have any smaller bags?","有小一点的袋子吗？"],["What's in season right now?","现在什么是应季的？"],["Do you take mobile payment?","能用手机付款吗？"]],"d":{"intro":"周末你去逛农贸市场。","turns":[{"o":"Morning! Everything here was picked yesterday.","h":"问这些是不是本地种的","a":"Morning! Are these grown locally?"},{"o":"Yes, our farm is twenty miles from here.","h":"问能不能尝一个","a":"Nice. Can I try one?"},{"o":"Of course. Go ahead.","h":"说很甜，问番茄多少钱","a":"Mmm, it's really sweet. How much are the tomatoes?"},{"o":"Three dollars a pound.","h":"说要两磅","a":"I'll take two pounds, please."}]},"c":"美国农贸市场多在周末，卖本地种的蔬果，常可以试吃。美国按磅（pound）卖东西，1 磅约 0.45 公斤，比一斤稍少。","n":[[3,"a pound of ... 是一磅……。",[["Could I get half a pound?","能给我半磅吗？"],["I'll take three of these.","我要三个这个。"]]],[5,"in season 是当季，当季的东西又好又便宜。",[["What's good right now?","现在什么好吃？"],["What would you recommend today?","今天推荐什么？"]]]]},{"t":"At the hardware store","zh":"五金店","k":"life","s":[["I'm looking for light bulbs.","我在找灯泡。"],["Which aisle are the screws in?","螺丝在哪一排？"],["I need something to fix a leaky faucet.","我需要修漏水的水龙头的东西。"],["Will this fit my sink?","这个适合我的水槽吗？"],["Do you have a smaller size?","有小一号的吗？"],["Can you show me how to use this?","你能教我怎么用这个吗？"],["Do I need any special tools?","我需要特别的工具吗？"]],"d":{"intro":"你家水龙头漏水，你去五金店。","turns":[{"o":"Hi, can I help you find something?","h":"说需要修漏水的水龙头","a":"Yes, I need something to fix a leaky faucet."},{"o":"Is it in the kitchen or the bathroom?","h":"说在厨房","a":"It's in the kitchen."},{"o":"You probably need a new washer. They're in aisle seven.","h":"问需不需要特别的工具","a":"Thanks. Do I need any special tools?"},{"o":"Just a wrench. We have those too.","h":"请他教你怎么用","a":"Great. Could you show me how to use it?"}]},"c":"美国很多东西靠自己动手修，五金店（Home Depot、Lowe's）的店员很懂。可以带上坏零件或照片去问。","n":[[2,"I need something to + 动作。不知道东西叫什么时特别好用。",[["What do I need to fix this?","修这个我需要什么？"],["I don't know what it's called, but here's a picture.","我不知道它叫什么，不过这有张照片。"]]],[3,"Will this fit ...? 问尺寸合不合，买零件时必问。",[["Is this the right size?","这个尺寸对吗？"],["Will this work with my sink?","这个能用在我的水槽上吗？"]]]]},{"t":"Buying furniture","zh":"买家具","k":"life","s":[["I'm looking for a desk for my room.","我想给房间买张书桌。"],["Do you have something smaller?","有小一点的吗？"],["Does it come assembled?","是组装好的吗？"],["How much is delivery?","送货多少钱？"],["Can you deliver it on Saturday?","周六能送吗？"],["Is this on sale?","这个在打折吗？"],["I need to measure my room first.","我得先量一下房间。"]],"d":{"intro":"你刚搬家，去家具店买书桌。","turns":[{"o":"Hi! Looking for anything in particular?","h":"说想买张书桌","a":"Yes, I'm looking for a desk for my room."},{"o":"How about this one? It's very popular.","h":"说有点大，问有没有小一点的","a":"It's a bit big. Do you have something smaller?"},{"o":"This one is smaller and on sale.","h":"问是不是组装好的","a":"Nice. Does it come assembled?"},{"o":"No, but assembly is easy.","h":"问送货多少钱，周六能不能送","a":"How much is delivery, and can you deliver on Saturday?"},{"o":"Twenty dollars, and yes, Saturday is fine.","h":"说就要这个","a":"Great, I'll take it."}]},"c":"美国很多家具要自己组装，assembled 是已经装好的。大件家具送货和组装常常要另外付费。","n":[[2,"come + 形容词，表示“到手时是什么样”。",[["Do I have to put it together myself?","要我自己组装吗？"],["Do you offer assembly?","你们提供组装吗？"]]],[6,"measure 是量尺寸。这也是不急着买的好理由。",[["Let me measure the space first.","我先量一下空间。"],["Do you know the dimensions?","你知道尺寸吗？"]]]]},{"t":"Setting up the internet","zh":"开通宽带","k":"life","s":[["I'd like to set up internet service.","我想开通网络服务。"],["What plans do you have?","你们有哪些套餐？"],["Is there a contract?","需要签合同吗？"],["When can someone come to install it?","什么时候能来安装？"],["My internet has been down since this morning.","我的网从今早开始就断了。"],["I've already restarted the router.","我已经重启过路由器了。"],["Can you send a technician?","能派个技术员来吗？"]],"d":{"intro":"你打电话给网络公司。","turns":[{"o":"Thanks for calling FastNet. How can I help?","h":"说想开通网络","a":"Hi, I'd like to set up internet service."},{"o":"Sure. We have plans starting at forty dollars a month.","h":"问要不要签合同","a":"Is there a contract?"},{"o":"No contract. You can cancel anytime.","h":"问什么时候能来安装","a":"Good. When can someone come to install it?"},{"o":"We have an opening on Thursday morning.","h":"说周四上午可以","a":"Thursday morning works for me."}]},"c":"美国宽带要预约上门安装，网速和价格差别很大。打客服前先重启路由器，客服第一句通常就问这个。","n":[[4,"be down 是断了、不能用，是网断了的标准说法。",[["My Wi-Fi isn't working.","我的 Wi-Fi 不能用了。"],["I have no internet connection.","我连不上网。"]]],[5,"I've already + 过去分词。告诉客服你试过什么，省得对方让你再做一遍。",[["I've already tried turning it off and on.","我已经试过关机再开了。"],["I've already checked the cables.","我已经检查过线了。"]]]]},{"t":"A problem with a bill","zh":"账单出错，打客服","k":"life","s":[["I'm calling about my bill.","我打电话是想问账单的事。"],["I think I was charged twice.","我好像被扣了两次费。"],["My account number is 4-5-7-2.","我的账号是 4572。"],["I never ordered this service.","我从来没订过这个服务。"],["Could you refund the extra charge?","能把多扣的钱退给我吗？"],["How long will the refund take?","退款要多久？"],["Can I get a confirmation email?","能给我发一封确认邮件吗？"]],"d":{"intro":"你的手机账单多扣了钱，你打电话给客服。","turns":[{"o":"Thank you for calling. How can I help you today?","h":"说想问账单","a":"Hi, I'm calling about my bill."},{"o":"Sure. What seems to be the problem?","h":"说好像被扣了两次","a":"I think I was charged twice this month."},{"o":"Let me check… You're right. I'm sorry about that.","h":"请她把多扣的钱退回","a":"Could you refund the extra charge?"},{"o":"Of course. It'll take three to five business days.","h":"请她发一封确认邮件","a":"Thank you. Can I get a confirmation email?"}]},"c":"美国打客服电话，先是语音菜单（press 1 for ...），说 representative 或 agent 常能转人工。打之前准备好账号和账单。","n":[[1,"be charged twice 是被扣了两次钱。",[["There's a charge I don't recognize.","有一笔我不认识的扣款。"],["I was overcharged.","我被多收钱了。"]]],[2,"报数字要一个一个读，停顿清楚。电话里 5 和 9 容易听混，可以再重复一遍。",[["Let me repeat that: four, five, seven, two.","我再重复一遍：四、五、七、二。"],["Should I spell my name?","要我拼一下我的名字吗？"]]]]},{"t":"A missed delivery","zh":"快递没收到","k":"life","s":[["My package says delivered, but I didn't get it.","快递显示已签收，但我没收到。"],["Here's my tracking number.","这是我的快递单号。"],["Could it have gone to the wrong address?","会不会送错地址了？"],["I'll check with my neighbors.","我问问邻居。"],["Can you send a replacement?","能补发一个吗？"],["Could you leave it at the front desk next time?","下次能放在前台吗？"],["I'll be home after six.","我六点以后在家。"]],"d":{"intro":"你网购的东西显示已签收，但你没收到。","turns":[{"o":"Customer service, how can I help?","h":"说快递显示已签收但没收到","a":"Hi, my package says delivered, but I didn't get it."},{"o":"I'm sorry. Do you have the tracking number?","h":"说给你单号","a":"Yes, here's my tracking number."},{"o":"It shows it was left at the front door at two p.m.","h":"说你问过邻居了，请他们补发","a":"I already asked my neighbors. Can you send a replacement?"},{"o":"Sure, we'll send a new one today.","h":"请他们下次放前台","a":"Thank you. Could you leave it at the front desk this time?"}]},"c":"美国快递常放在门口。显示已送达却没收到，先问邻居和前台，再联系快递公司或卖家。","n":[[0,"says 表示“上面写着”。",[["It says it was delivered yesterday.","上面显示昨天就送到了。"],["I never got my package.","我一直没收到包裹。"]]],[2,"could have + 过去分词，用来猜测过去可能发生的事。",[["Maybe it went to the wrong building.","可能送到别的楼了。"],["Could you check the delivery photo?","能看看送货照片吗？"]]]]},{"t":"At the dentist","zh":"看牙医","k":"life","s":[["I have a toothache.","我牙疼。"],["It hurts when I drink something cold.","喝冷的东西就疼。"],["I'd like to get my teeth cleaned.","我想洗牙。"],["Will it hurt?","会疼吗？"],["Does my insurance cover this?","我的保险包括这个吗？"],["How often should I come for a checkup?","我应该多久来检查一次？"],["Can I eat right after this?","做完马上能吃东西吗？"]],"d":{"intro":"你牙疼，去看牙医。","turns":[{"o":"So what brings you in today?","h":"说你牙疼","a":"I have a toothache."},{"o":"Where does it hurt?","h":"说左下边，喝冷的就疼","a":"On the lower left. It hurts when I drink something cold."},{"o":"You may have a small cavity. We can fill it today.","h":"问会不会疼","a":"Will it hurt?"},{"o":"We'll numb the area first, so you won't feel much.","h":"问做完能不能马上吃东西","a":"OK. Can I eat right after this?"},{"o":"Wait about two hours.","h":"说好的，谢谢","a":"Got it. Thank you."}]},"c":"美国看牙很贵，学生保险常不含牙科。洗牙（cleaning）一般半年一次。","n":[[1,"描述什么时候疼。牙医常问 Is it sensitive to cold?",[["My teeth are sensitive to cold.","我的牙对冷的敏感。"],["It hurts when I chew.","嚼东西的时候疼。"]]],[4,"cover 是保险报销、覆盖。看病前一定要问。",[["How much will this cost?","这个要多少钱？"],["Is this covered?","这个能报销吗？"]]]]},{"t":"Getting new glasses","zh":"配眼镜","k":"life","s":[["I'd like to get my eyes checked.","我想检查一下视力。"],["Things look blurry when I read.","看书的时候东西模糊。"],["I'm nearsighted.","我是近视眼。"],["Can I try these frames on?","我能试戴这副镜框吗？"],["How long will it take to make the glasses?","眼镜要多久能做好？"],["Do you have contact lenses?","你们有隐形眼镜吗？"],["These feel a little tight.","这副有点紧。"]],"d":{"intro":"你去眼镜店配新眼镜。","turns":[{"o":"Hi, how can I help you?","h":"说想检查视力、配新眼镜","a":"Hi, I'd like to get my eyes checked and get new glasses."},{"o":"Sure. Any problems with your vision?","h":"说你近视，最近看东西模糊","a":"I'm nearsighted, and things look blurry lately."},{"o":"(Later) Your prescription changed a little. Let's pick some frames.","h":"问能不能试戴这副","a":"Can I try these on?"},{"o":"Of course. How do they feel?","h":"说有点紧","a":"They feel a little tight."},{"o":"We can adjust them for you.","h":"问要多久能做好","a":"Great. How long will the glasses take?"}]},"c":"美国配眼镜要先做验光（eye exam），由验光师开处方，再选镜框，通常要等一周左右。","n":[[2,"nearsighted 近视，farsighted 远视，比 myopia 口语得多。",[["I can't see far very well.","我看远处不太清楚。"],["I've worn glasses since I was a kid.","我从小就戴眼镜。"]]],[6,"试戴时说感受：tight 紧，loose 松。",[["They keep sliding down.","老是往下滑。"],["These feel just right.","这副刚刚好。"]]]]},{"t":"At urgent care","zh":"急诊门诊","k":"life","s":[["I need to see a doctor today.","我今天需要看医生。"],["I cut my hand while cooking.","我做饭时割伤了手。"],["It won't stop bleeding.","血一直止不住。"],["I twisted my ankle.","我扭伤了脚踝。"],["I can't put any weight on it.","我脚一用力就疼。"],["How long is the wait?","要等多久？"],["Do I need an X-ray?","我需要拍 X 光吗？"]],"d":{"intro":"你扭伤了脚踝，去急诊门诊。","turns":[{"o":"Hi, what happened?","h":"说你扭伤了脚踝","a":"I twisted my ankle playing basketball."},{"o":"Can you walk on it?","h":"说一用力就疼","a":"Not really. I can't put any weight on it."},{"o":"OK. Please fill out this form and have a seat.","h":"问要等多久","a":"How long is the wait?"},{"o":"About thirty minutes.","h":"问需不需要拍 X 光","a":"OK. Will I need an X-ray?"},{"o":"The doctor will decide after looking at it.","h":"道谢","a":"Thank you."}]},"c":"urgent care 是不太严重但需要当天看的门诊，比 ER 急诊室等得短、费用低。危及生命打 911 或去 ER。","n":[[1,"受伤用过去式说发生了什么。",[["I burned my hand.","我烫伤了手。"],["I fell and hurt my knee.","我摔倒伤了膝盖。"]]],[4,"can't put any weight on it 是脚不能着地、不能吃力，描述扭伤程度的标准说法。",[["It's really swollen.","肿得很厉害。"],["I can barely walk.","我几乎走不了路。"]]]]},{"t":"Asking about health insurance","zh":"咨询医疗保险","k":"life","s":[["I have a question about my health insurance.","我有个关于医疗保险的问题。"],["Is this covered by my plan?","我的保险包括这个吗？"],["How much is the copay?","自付额是多少？"],["Do I need a referral?","需要转诊单吗？"],["Is this doctor in network?","这个医生在保险网络内吗？"],["Can you send me the details by email?","能把细节发邮件给我吗？"],["Where can I find my member ID?","在哪里能找到我的会员号？"]],"d":{"intro":"你打电话问学生医疗保险。","turns":[{"o":"Student Health Insurance, how may I help you?","h":"说有个关于医疗保险的问题","a":"Hi, I have a question about my health insurance."},{"o":"Sure. Can I have your member ID?","h":"说你不知道在哪找","a":"Sorry, where can I find my member ID?"},{"o":"It's on the front of your insurance card.","h":"读出号码，问看皮肤科是否包括","a":"Got it. It's 8-8-1-2. Is a skin doctor covered by my plan?"},{"o":"Yes, but you need a referral first.","h":"问自付额是多少","a":"OK. And how much is the copay?"},{"o":"Twenty dollars per visit.","h":"道谢","a":"Thank you for your help."}]},"c":"美国医保常见词：copay 每次看病自付的固定金额，deductible 免赔额，in network 网络内（便宜），referral 转诊单。","n":[[2,"copay 是每次看病自己付的固定费用。",[["How much will I pay out of pocket?","我自己要付多少？"],["What's my deductible?","我的免赔额是多少？"]]],[4,"网络外（out of network）的医生贵很多，看病前一定问。",[["Do you accept my insurance?","你们收我这个保险吗？"],["Is this clinic covered by my plan?","这家诊所在我的保险范围内吗？"]]]]},{"t":"Buying a train ticket","zh":"买火车票","k":"life","s":[["One ticket to Boston, please.","一张去波士顿的票。"],["One way or round trip?","单程还是往返？"],["Round trip, please.","往返的。"],["What time is the next train?","下一班车几点？"],["Which platform does it leave from?","从哪个站台出发？"],["Do I need to change trains?","需要换乘吗？"],["Is there a student discount?","有学生优惠吗？"]],"d":{"intro":"你在火车站售票窗口。","turns":[{"o":"Next, please. Where are you going?","h":"说要一张去波士顿的票","a":"One ticket to Boston, please."},{"o":"One way or round trip?","h":"说往返","a":"Round trip, please."},{"o":"That's sixty-eight dollars.","h":"问有没有学生优惠","a":"Is there a student discount?"},{"o":"Yes, with a student ID it's fifty-four.","h":"给学生证，问下一班几点","a":"Here's my ID. What time is the next train?"},{"o":"Ten fifteen, from platform four.","h":"道谢","a":"Thank you."}]},"c":"美国火车（Amtrak）提前买票便宜，学生有折扣。one way 单程，round trip 往返。","n":[[1,"售票员最常问的问题。英国说 single 和 return。",[["Just one way, please.","单程就好。"],["A round-trip ticket, please.","一张往返票。"]]],[5,"change trains 是换乘，trains 用复数。",[["Is it a direct train?","是直达车吗？"],["Where do I transfer?","我在哪儿换乘？"]]]]},{"t":"Renting a car","zh":"租车","k":"life","s":[["I have a reservation under Yang.","我用 Yang 这个名字预订了。"],["I'd like a small car.","我想要一辆小车。"],["Is insurance included?","包含保险吗？"],["Do I need to return it with a full tank?","还车时要加满油吗？"],["Where do I return the car?","在哪里还车？"],["There's a scratch on the door.","车门上有一道划痕。"],["Is my Chinese license OK with this translation?","我的中国驾照加这份翻译件可以用吗？"]],"d":{"intro":"你在租车公司柜台取车。","turns":[{"o":"Hi, do you have a reservation?","h":"说用 Yang 的名字订了","a":"Yes, I have a reservation under Yang."},{"o":"Got it. A compact car for three days. Would you like insurance?","h":"问保险是不是已经包含","a":"Isn't insurance included?"},{"o":"Basic insurance is included. Full coverage is fifteen dollars a day.","h":"说基础的就够了，问还车要不要加满油","a":"Basic is fine. Do I need to return it with a full tank?"},{"o":"Yes, please. Here are your keys.","h":"说车门上有划痕，请他记下来","a":"Thanks. There's a scratch on the door. Could you write that down?"}]},"c":"在美国租车一般要信用卡、驾照和翻译件。取车时绕车拍照，记下原有的划痕。","n":[[3,"很多租车要求还车时加满油，否则收高价油费。",[["Should I fill it up before I return it?","还车前要加满油吗？"],["What happens if it's not full?","没加满会怎样？"]]],[5,"取车时说出来，避免还车时算到你头上。",[["There's a dent on the back.","后面有个凹痕。"],["Can you note that down?","能把这个记下来吗？"]]]]},{"t":"At the gas station","zh":"加油站","k":"life","s":[["Which pump should I use?","我该用哪个油枪？"],["Fill it up, please.","加满。"],["Thirty dollars on pump five, please.","五号油枪加三十美元。"],["The pump isn't working.","油枪不出油。"],["Do I pay first or after?","先付钱还是后付？"],["Where's the air pump for the tires?","给轮胎打气的地方在哪？"],["Can I get a receipt?","能给我收据吗？"]],"d":{"intro":"你第一次在美国加油，进店里问店员。","turns":[{"o":"Hi, can I help you?","h":"问先付钱还是后付","a":"Hi, do I pay first or after?"},{"o":"Pay here first, or use a card at the pump.","h":"说五号油枪加三十美元","a":"Thirty dollars on pump five, please."},{"o":"OK, you're all set.","h":"问给轮胎打气的地方在哪","a":"Thanks. Where's the air pump for the tires?"},{"o":"It's around the side of the building.","h":"道谢","a":"Great, thank you."}]},"c":"美国加油站大多是自助的。可以在油泵上刷卡；或者进店告诉店员泵号和金额，先付钱再加。","n":[[1,"Fill it up 是加满。",[["Can I get it filled up?","能帮我加满吗？"],["Twenty dollars, please.","加二十美元的。"]]],[2,"金额 + on pump + 号码，告诉店员给哪台油泵加多少钱。",[["Forty on number three, please.","三号泵加四十。"],["Can I pay inside?","我能在里面付钱吗？"]]]]},{"t":"Asking for recommendations","zh":"问当地推荐","k":"life","s":[["What's worth seeing around here?","这附近有什么值得看的？"],["Is there a good place to eat nearby?","附近有好吃的地方吗？"],["Is it touristy?","游客多吗？"],["How long does it take to get there?","去那里要多久？"],["Is it open on Sundays?","周日开门吗？"],["Do I need to book in advance?","需要提前预订吗？"],["Do you have a map?","有地图吗？"]],"d":{"intro":"你在旅游咨询处问当地推荐。","turns":[{"o":"Welcome! How can I help you?","h":"问附近有什么值得看的","a":"Hi, what's worth seeing around here?"},{"o":"The old harbor is beautiful, and the art museum is great.","h":"问去港口要多久","a":"How long does it take to get to the harbor?"},{"o":"About fifteen minutes by bus.","h":"问附近有没有地道又不太游客化的餐厅","a":"Is there a good local place to eat that's not too touristy?"},{"o":"Try Rosa's Kitchen. Locals love it.","h":"问要不要提前预订","a":"Do I need to book in advance?"},{"o":"On weekends, yes.","h":"要一张地图","a":"Thanks! Could I have a map too?"}]},"c":"问当地人推荐很容易拉近距离，酒店前台、咖啡店店员都乐意推荐。touristy 是游客多、太商业化，有点贬义。","n":[[0,"worth + 动词ing 表示值得做。",[["What would you recommend around here?","这附近你推荐什么？"],["Is there anything fun to do around here?","这附近有什么好玩的吗？"]]],[2,"问这个能找到当地人真正去的地方。",[["Where do locals go?","当地人去哪儿？"],["Is it worth it?","值得去吗？"]]]]},{"t":"At the museum","zh":"博物馆","k":"life","s":[["One adult ticket, please.","一张成人票。"],["Is there a student price?","有学生价吗？"],["Can I take photos inside?","里面能拍照吗？"],["Where's the special exhibition?","特展在哪里？"],["Is there an audio guide in Chinese?","有中文语音导览吗？"],["What time do you close?","你们几点关门？"],["Where can I leave my bag?","包可以存在哪里？"]],"d":{"intro":"你在博物馆售票处。","turns":[{"o":"Hello! How many tickets?","h":"要一张，问有没有学生价","a":"One, please. Is there a student price?"},{"o":"Yes, twelve dollars with a student ID.","h":"问有没有中文语音导览","a":"Great. Is there an audio guide in Chinese?"},{"o":"Yes, it's five dollars extra.","h":"说要一个，问里面能不能拍照","a":"I'll take one. Can I take photos inside?"},{"o":"Yes, but no flash, please.","h":"问几点关门","a":"Got it. What time do you close?"},{"o":"At six.","h":"道谢","a":"Thank you."}]},"c":"美国很多博物馆免费，或者是 suggested donation（建议捐款，可以少给）。大包常要寄存。","n":[[2,"很多博物馆可以拍照，但不能开闪光灯（no flash）。",[["Is photography allowed?","可以拍照吗？"],["Can I use flash?","能开闪光灯吗？"]]],[4,"audio guide 是语音导览。",[["Do you have a guided tour?","有讲解员带的参观吗？"],["Is there an app for the tour?","有导览 App 吗？"]]]]},{"t":"A problem at the hotel","zh":"酒店房间有问题","k":"life","s":[["My room is too noisy.","我的房间太吵了。"],["Could I change rooms?","我能换个房间吗？"],["The shower doesn't have hot water.","淋浴没有热水。"],["Could I get some extra towels?","能多给我几条毛巾吗？"],["The Wi-Fi isn't working in my room.","我房间的 Wi-Fi 用不了。"],["Could I have a wake-up call at seven?","七点能叫我起床吗？"],["Can I leave my luggage here after checkout?","退房后能把行李寄存在这里吗？"]],"d":{"intro":"你给酒店前台打电话。","turns":[{"o":"Front desk, how may I help you?","h":"说你在 512 房间，房间太吵","a":"Hi, I'm in room 512. My room is really noisy."},{"o":"I'm sorry. It's next to the elevator.","h":"问能不能换房间","a":"Could I change rooms?"},{"o":"Yes, we have a quieter room on the eighth floor.","h":"说太好了，再要几条毛巾","a":"Great, thank you. Could I also get some extra towels?"},{"o":"Of course. Anything else?","h":"请他们明早七点叫醒你","a":"Could I have a wake-up call at seven tomorrow?"}]},"c":"酒店房间有问题，马上打给前台（front desk），越早说越好解决，常能免费换房。","n":[[1,"change rooms 的 rooms 用复数，和 change trains、change seats 一样。",[["Is there a quieter room available?","有更安静的房间吗？"],["Could I switch to another room?","我能换到别的房间吗？"]]],[6,"退房后寄存行李，美国酒店基本都可以。",[["Can you hold my bags until three?","行李能帮我放到三点吗？"],["Do you have luggage storage?","你们有行李寄存吗？"]]]]},{"t":"Talking about movies","zh":"聊电影","k":"life","s":[["Have you seen any good movies lately?","你最近看过什么好电影吗？"],["I just watched a great one.","我刚看了一部很棒的。"],["It's a comedy about two friends.","是一部讲两个朋友的喜剧。"],["The ending was amazing.","结局太精彩了。"],["No spoilers, please!","别剧透！"],["I prefer action movies.","我更喜欢动作片。"],["We should watch it together.","我们一起去看吧。"]],"d":{"intro":"你和朋友 Lily 聊电影。","turns":[{"o":"Have you seen any good movies lately?","h":"说你刚看了一部很棒的","a":"Yes, I just watched a great one."},{"o":"Oh, what was it about?","h":"说是讲两个朋友的喜剧","a":"It's a comedy about two friends on a road trip."},{"o":"How did it end?","h":"说不剧透，但结局很精彩","a":"No spoilers! But the ending was amazing."},{"o":"Now I really want to see it.","h":"提议一起去看","a":"We should watch it together this weekend."}]},"c":"聊电影是很好的话题。剧透叫 spoiler，美国人很在意，讲剧情前先问 Have you seen it?","n":[[0,"lately 是最近，常放在句末。可以把 movies 换成书、剧。",[["Seen anything good recently?","最近看了什么好看的吗？"],["Are you watching any good shows?","你在追什么好看的剧吗？"]]],[4,"No spoilers! 就是别剧透。",[["Don't tell me the ending!","别告诉我结局！"],["I haven't seen it yet.","我还没看呢。"]]]]},{"t":"Talking about sports","zh":"聊运动","k":"life","s":[["Do you play any sports?","你做什么运动吗？"],["I play basketball on weekends.","我周末打篮球。"],["Which team do you support?","你支持哪个队？"],["Did you watch the game last night?","你看昨晚的比赛了吗？"],["It was a close game.","比分咬得很紧。"],["I'm not very athletic.","我不太擅长运动。"],["Do you want to play sometime?","哪天一起打吗？"]],"d":{"intro":"同学 Ben 是个篮球迷。","turns":[{"o":"Did you watch the game last night?","h":"说看了，比分咬得很紧","a":"Yeah! It was a close game."},{"o":"I know! Do you play any sports?","h":"说周末打篮球","a":"I play basketball on weekends."},{"o":"Me too! Where do you usually play?","h":"说在学校体育馆","a":"Usually at the school gym."},{"o":"We should play together sometime.","h":"同意，约这周六","a":"Sure! How about this Saturday?"}]},"c":"美国最流行的是橄榄球、篮球和棒球。注意美国说 soccer 才是足球，football 指美式橄榄球。","n":[[2,"美国人更常说 Who do you root for?，root for 是支持、为某队加油。",[["Who's your favorite team?","你最喜欢哪个队？"],["Who do you root for?","你支持谁？"]]],[4,"a close game 是比分咬得很紧的比赛，close 读 /kloʊs/。",[["It was really exciting.","比赛很精彩。"],["They won in the last minute.","他们最后一分钟赢了。"]]]]},{"t":"Talking about travel","zh":"聊旅行","k":"life","s":[["Have you traveled much?","你经常旅行吗？"],["I've been to Japan once.","我去过一次日本。"],["What was your favorite place?","你最喜欢哪个地方？"],["The food was incredible.","吃的太好了。"],["I'd love to go back someday.","我很想有一天再去。"],["Where do you want to go next?","你下次想去哪里？"],["I'm saving up for a trip.","我在攒钱准备去旅行。"]],"d":{"intro":"你和新朋友聊旅行经历。","turns":[{"o":"Have you traveled much?","h":"说去过一次日本","a":"Not much. I've been to Japan once."},{"o":"Nice! What was your favorite part?","h":"说吃的太好了","a":"The food was incredible."},{"o":"Where do you want to go next?","h":"说想去美国看看","a":"I'd love to visit the US someday."},{"o":"You should! Which city?","h":"说想去纽约","a":"Probably New York. I'm saving up for it."}]},"c":"美国人很爱聊旅行。说去过哪儿用 I've been to ...，不是 I've gone to ...。","n":[[1,"I've been to + 地方，是去过某地（现在回来了）。have gone to 是去了还没回来。",[["I went to Japan last year.","我去年去了日本。"],["I've never been to Europe.","我从没去过欧洲。"]]],[4,"I'd love to ... someday 表达愿望，很常用。",[["I really want to go back.","我真想再去一次。"],["It's on my bucket list.","这是我人生清单上的一项。"]]]]},{"t":"Giving compliments","zh":"夸别人","k":"life","s":[["I love your jacket.","我好喜欢你的外套。"],["Where did you get it?","你在哪买的？"],["You look great today.","你今天看起来很棒。"],["Your English is really good.","你的英语真好。"],["Thank you, that's very kind of you.","谢谢，你真好。"],["You did a great job.","你做得很好。"],["This place looks amazing.","这里看起来太棒了。"]],"d":{"intro":"你在聚会上遇到同学 Anna。","turns":[{"o":"Hey Yang!","h":"打招呼，夸她的外套","a":"Hi Anna! I love your jacket."},{"o":"Oh, thank you! I just bought it.","h":"问在哪买的","a":"Where did you get it?"},{"o":"At the mall downtown. By the way, your English is really good!","h":"谢谢她，说你还在学习","a":"Thank you, that's very kind of you. I'm still learning."},{"o":"Well, you sound great.","h":"再次道谢","a":"Thanks, that means a lot."}]},"c":"美国人经常夸别人，衣服、发型、工作都可以夸。被夸时说 Thank you 接受就好，不要说“哪里哪里”，否则对方会尴尬。","n":[[0,"I love your ...! 是夸东西最自然的说法，比 Your jacket is beautiful 更口语。",[["That's a great jacket.","这件夹克真好看。"],["Nice shoes!","鞋不错！"]]],[4,"被夸时先说谢谢，可以再加一句。千万不要否认，比如 No, my English is bad。",[["Thanks! I've been practicing a lot.","谢谢！我一直在练。"],["Thanks, that means a lot.","谢谢，这对我很重要。"]]]]},{"t":"Saying no politely","zh":"礼貌拒绝","k":"life","s":[["Thanks for asking, but I can't.","谢谢邀请，但我去不了。"],["I'm afraid I'm busy that day.","恐怕那天我有事。"],["Maybe next time.","下次吧。"],["I'd rather not, if that's OK.","如果可以的话，我还是不去了。"],["I'm not really into that.","我对那个不太感兴趣。"],["Let me think about it.","让我考虑一下。"],["I really appreciate the offer.","我很感谢你的好意。"]],"d":{"intro":"朋友邀请你去一个你不太想去的活动。","turns":[{"o":"We're going to a club tonight. Want to come?","h":"谢谢邀请，但去不了","a":"Thanks for asking, but I can't tonight."},{"o":"Come on, it'll be fun!","h":"说你对夜店不太感兴趣","a":"I'm not really into clubs, to be honest."},{"o":"OK, no problem. What about dinner on Sunday?","h":"说这个可以","a":"Dinner sounds great. Count me in."}]},"c":"美国人拒绝时说得委婉，但态度明确。Maybe next time 有时就是委婉的“不去”。同样，对方说 I'll think about it，往往也是不想要。","n":[[1,"I'm afraid ... 让坏消息听起来更柔和，不是真的“害怕”。",[["Unfortunately, I can't make it.","很遗憾，我去不了。"],["I'm afraid that won't work for me.","恐怕那个时间我不行。"]]],[3,"I'd rather not 比 I don't want to 委婉，加上 if that's OK 更礼貌。",[["I'll pass this time.","这次我就不参加了。"],["That's not really my thing.","我不太喜欢那种。"]]]]},{"t":"Asking a neighbor for a favor","zh":"请邻居帮忙","k":"life","s":[["Could I ask you a favor?","能请你帮个忙吗？"],["I'm going away for a week.","我要出门一周。"],["Could you pick up my mail?","能帮我收一下信吗？"],["Could you water my plants?","能帮我浇浇花吗？"],["Here's my spare key.","这是我的备用钥匙。"],["I'll bring you something back.","我给你带点东西回来。"],["Thanks so much. I owe you one.","太感谢了，欠你个人情。"]],"d":{"intro":"你要出门一周，想请邻居 Linda 帮忙。","turns":[{"o":"Hi Yang! What's up?","h":"问能不能请她帮个忙","a":"Hi Linda. Could I ask you a favor?"},{"o":"Sure, what is it?","h":"说你要出门一周，请她帮你收信","a":"I'm going away for a week. Could you pick up my mail?"},{"o":"Of course! No problem.","h":"递上备用钥匙，再请她浇花","a":"Thanks! Here's my spare key. Could you water my plants too?"},{"o":"Happy to help.","h":"说欠她人情，会带礼物回来","a":"Thank you so much. I owe you one. I'll bring you something back."}]},"c":"请别人帮忙，先问 Could I ask you a favor?，对方说 Sure 再说具体的事。帮完要感谢，出门回来带个小礼物。","n":[[0,"请人帮忙的开场白，先问，再说具体内容。",[["Could you do me a favor?","能帮我个忙吗？"],["Can I ask you something?","我能问你件事吗？"]]],[6,"I owe you one 是“我欠你一个人情”，朋友之间常说。",[["Thanks a lot. I really appreciate it.","非常感谢。"],["You're a lifesaver.","你真是救了我。"]]]]},{"t":"A birthday party","zh":"生日聚会","k":"life","s":[["Happy birthday!","生日快乐！"],["I got you a little something.","我给你带了个小礼物。"],["I hope you like it.","希望你喜欢。"],["How old are you turning?","你几岁生日？"],["Make a wish!","许个愿吧！"],["This cake is delicious.","这个蛋糕太好吃了。"],["Thanks for inviting me.","谢谢你邀请我。"]],"d":{"intro":"你参加同学 Mike 的生日聚会。","turns":[{"o":"Yang! You made it!","h":"祝他生日快乐，递上礼物","a":"Happy birthday, Mike! I got you a little something."},{"o":"Aw, thanks! You didn't have to.","h":"说希望他喜欢","a":"I hope you like it."},{"o":"(Opening it) I love it! Thanks, man.","h":"问他几岁生日","a":"So how old are you turning?"},{"o":"Twenty-five. Getting old!","h":"开玩笑说还很年轻，让他许愿","a":"You're still young! Now make a wish!"}]},"c":"美国生日派对上礼物常当面拆，送的人会看对方的反应。礼物不用贵，心意重要，也可以只送一张卡片。","n":[[1,"I got you a little something 是“给你带了个小礼物”，谦虚又自然。",[["This is for you.","这是给你的。"],["Just a small gift.","一个小礼物。"]]],[3,"对朋友可以这样问，但问长辈或不熟的人年龄不太礼貌。",[["Is it a big birthday?","这是个重要的生日吗？"],["What did you wish for?","你许了什么愿？"]]]]},{"t":"Thanksgiving dinner","zh":"感恩节晚餐","k":"life","s":[["Thank you for inviting me to Thanksgiving.","谢谢你邀请我过感恩节。"],["Is there anything I can bring?","我需要带点什么吗？"],["This is my first Thanksgiving.","这是我第一次过感恩节。"],["What do people usually eat?","大家通常吃什么？"],["The turkey looks amazing.","火鸡看起来太棒了。"],["Could you pass the potatoes, please?","能把土豆递给我吗？"],["I'm thankful for my friends here.","我感谢在这里的朋友们。"]],"d":{"intro":"朋友邀请你去她家过感恩节。","turns":[{"o":"Would you like to come to our Thanksgiving dinner?","h":"说很乐意，问需要带什么","a":"I'd love to! Is there anything I can bring?"},{"o":"Maybe some drinks?","h":"说没问题，说这是你第一次过感恩节","a":"No problem. This is my first Thanksgiving."},{"o":"Really? Then you have to try everything.","h":"问大家通常吃什么","a":"What do people usually eat?"},{"o":"Turkey, potatoes, and pumpkin pie!","h":"说等不及了","a":"Sounds great. I can't wait."},{"o":"(At dinner) What are you thankful for, Yang?","h":"说感谢在这里的朋友","a":"I'm thankful for my friends here."}]},"c":"感恩节是十一月的第四个星期四，是美国最重要的家庭节日之一，要吃火鸡。受邀去朋友家，一般会问要不要带东西，常带甜点或酒。","n":[[1,"受邀吃饭时的标准问题。主人常回答 Just bring yourself，意思是人来就好。",[["Can I bring anything?","我能带点什么吗？"],["Should I bring a dessert?","我带个甜点吧？"]]],[5,"餐桌上请人递东西，不要伸长手臂越过别人去拿。",[["Could I have the salt, please?","能把盐递给我吗？"],["Pass the gravy, please.","请递一下肉汁。"]]]]},{"t":"A part-time job interview","zh":"兼职面试","k":"life","s":[["Thanks for having me.","谢谢您给我面试机会。"],["I'm a graduate student in physics.","我是物理专业的研究生。"],["I'm hardworking and I learn quickly.","我很努力，学东西也快。"],["I can work on weekends.","我周末可以工作。"],["I have experience working with customers.","我有和客户打交道的经验。"],["What would my responsibilities be?","我的工作职责是什么？"],["When can I expect to hear from you?","我什么时候能收到消息？"]],"d":{"intro":"你去面试一份校内图书馆的兼职。","turns":[{"o":"Thanks for coming in. Tell me a little about yourself.","h":"说你是物理研究生","a":"Thanks for having me. I'm a graduate student in physics."},{"o":"Why do you want this job?","h":"说想练英语，也喜欢图书馆","a":"I want to improve my English, and I like the library."},{"o":"When are you available?","h":"说周末和周三下午","a":"I can work on weekends and Wednesday afternoons."},{"o":"Great. Do you have any questions for me?","h":"问工作职责是什么","a":"What would my responsibilities be?"},{"o":"Mostly helping students and shelving books.","h":"问什么时候能收到消息","a":"Sounds good. When can I expect to hear from you?"}]},"c":"美国面试重视具体例子：说你做过什么，而不是只说形容词。结束时问一个问题、感谢对方，回去再发一封感谢邮件。","n":[[2,"说完自己的优点，最好跟一个具体的例子。",[["I'm reliable. I've never missed a deadline.","我很靠谱，从没误过截止日期。"],["I'm good at working with people.","我很擅长和人合作。"]]],[6,"面试结尾的礼貌问题。",[["What are the next steps?","接下来的流程是什么？"],["Thank you for your time.","谢谢您的时间。"]]]]},{"t":"Leaving a voicemail","zh":"电话留言","k":"life","s":[["Hi, this is Yang calling.","你好，我是 Yang。"],["I'm calling about the apartment.","我打电话是为了公寓的事。"],["Please call me back when you get a chance.","有空请给我回电话。"],["My number is 555-0182.","我的号码是 555-0182。"],["I'll try again later.","我晚点再打。"],["Sorry, I think I have the wrong number.","抱歉，我好像打错了。"],["Have a nice day. Bye.","祝你愉快，再见。"]],"d":{"intro":"你打给房东，但他没接，你需要留言。","turns":[{"o":"Hi, you've reached Mark. Leave a message after the beep.","h":"说你是 Yang，为公寓的事打电话","a":"Hi Mark, this is Yang. I'm calling about the apartment."},{"o":"(Keep talking.)","h":"说厨房水槽漏水","a":"The kitchen sink is leaking."},{"o":"(Keep talking.)","h":"请他有空回电话，留下号码","a":"Please call me back when you get a chance. My number is 555-0182."},{"o":"(Finish the message.)","h":"道谢道别","a":"Thanks. Bye."}]},"c":"美国人打电话常转语音信箱。留言要说三件事：你是谁、什么事、回电号码。号码说两遍，语速放慢。","n":[[0,"电话里说 This is + 名字，不说 I am Yang。",[["Hi, it's Yang.","嗨，我是 Yang。"],["Hi, this is Yang from Fuzhou University.","你好，我是福州大学的 Yang。"]]],[2,"when you get a chance 是“你方便的时候”，让请求不那么急。",[["Give me a call back when you can.","方便时给我回个电话。"],["You can also text me.","也可以给我发短信。"]]]]},{"t":"Cooking with friends","zh":"和朋友一起做饭","k":"life","s":[["Can you pass me the salt?","能把盐递给我吗？"],["How long should I boil this?","这个要煮多久？"],["Could you chop the onions?","你能切一下洋葱吗？"],["Don't forget to wash your hands.","别忘了洗手。"],["Let's taste it first.","先尝一下。"],["It needs a little more salt.","还要再放点盐。"],["Dinner's ready!","开饭了！"]],"d":{"intro":"你教朋友做中国饺子。","turns":[{"o":"OK, chef, what should I do?","h":"请他切洋葱","a":"Could you chop the onions?"},{"o":"Done. What's next?","h":"让他把盐递给你","a":"Great. Can you pass me the salt?"},{"o":"Here you go. How long do we boil the dumplings?","h":"说煮到浮起来，大约五分钟","a":"Until they float, about five minutes."},{"o":"(Later) Mmm, these are amazing!","h":"说开饭了，问要不要醋","a":"Dinner's ready! Do you want some vinegar?"}]},"c":"和美国朋友一起做饭，大家会分工。厨房里常用很短的祈使句，加上 please 或 Could you 就很礼貌。","n":[[0,"饭桌上、厨房里请人递东西都用。",[["Could you hand me the salt?","能把盐递给我吗？"],["Where do you keep the salt?","盐放在哪儿？"]]],[5,"It needs a little more + 东西，尝味道时最常用。",[["It's a little bland.","有点淡。"],["It's perfect!","刚刚好！"]]]]},{"t":"Meeting a friend at a café","zh":"咖啡店见朋友","k":"life","s":[["Sorry, have you been waiting long?","抱歉，你等很久了吗？"],["What are you having?","你喝什么？"],["Let me get this one.","这次我来买。"],["How have you been?","你最近怎么样？"],["It's been so long!","好久不见！"],["Let's do this more often.","我们以后常见面吧。"],["I have to head out soon.","我一会儿得走了。"]],"d":{"intro":"你和老朋友 Emma 在咖啡店见面。","turns":[{"o":"Yang! Over here!","h":"道歉，问她等很久了没","a":"Hi Emma! Sorry, have you been waiting long?"},{"o":"No, I just got here. It's been so long!","h":"说是啊，问她最近怎么样","a":"I know! How have you been?"},{"o":"Busy, but good. What are you having?","h":"说你来买，问她喝什么","a":"Let me get this one. What do you want?"},{"o":"Aw, thanks! A latte, please.","h":"说一会儿去点，提议以后常见面","a":"Sure. We should do this more often."}]},"c":"和朋友见面，美国人常各付各的，也会轮流请客：这次你请，下次他请。","n":[[2,"get 在这里是“付钱、请客”。",[["It's on me.","我请客。"],["You can get the next one.","下次你请。"]]],[6,"head out 是离开、出发。这是委婉地说自己快要走了。",[["I need to get going soon.","我快得走了。"],["I have to leave in ten minutes.","我十分钟后得走。"]]]]},{"t":"At the movie theater","zh":"电影院","k":"life","s":[["Two tickets for the seven o'clock show, please.","两张七点场的票。"],["Are there any seats in the middle?","中间还有座位吗？"],["How long is the movie?","电影多长时间？"],["Does it have subtitles?","有字幕吗？"],["A large popcorn and two Cokes, please.","一个大桶爆米花和两杯可乐。"],["Excuse me, I think you're in my seat.","不好意思，你好像坐了我的位置。"],["That was a great movie.","这部电影真不错。"]],"d":{"intro":"你和朋友去看电影。","turns":[{"o":"Hi, which movie?","h":"说两张七点场的","a":"Two tickets for the seven o'clock show, please."},{"o":"Where would you like to sit?","h":"问中间有没有座位","a":"Are there any seats in the middle?"},{"o":"Row F, seats eight and nine.","h":"说好，再要大桶爆米花和两杯可乐","a":"Perfect. And a large popcorn and two Cokes, please."},{"o":"(Inside) Hmm, someone's in our seats.","h":"礼貌地跟对方说他坐了你的位置","a":"Excuse me, I think you're in our seats."}]},"c":"美国电影院很多要选座，爆米花和饮料很大份。英语电影在美国影院一般没有字幕。","n":[[0,"show 或 showing 指场次。",[["Two for the seven o'clock show, please.","两张七点场的。"],["Are there any seats left for tonight?","今晚还有座位吗？"]]],[5,"用 I think 让指出问题不那么冲。",[["Sorry, I think this is my seat.","抱歉，这好像是我的座位。"],["What seat number do you have?","你的座位号是多少？"]]]]},{"t":"Getting a transit card","zh":"办公交卡","k":"life","s":[["How do I get a transit card?","公交卡怎么办？"],["Can I add money to my card here?","我能在这里充值吗？"],["Is there a monthly pass?","有月票吗？"],["Is there a discount for students?","学生有优惠吗？"],["My card isn't working.","我的卡刷不了。"],["Does this card work on the subway too?","这张卡地铁也能用吗？"],["How much is a single ride?","单程多少钱？"]],"d":{"intro":"你在地铁站的服务窗口办卡。","turns":[{"o":"Hi, how can I help?","h":"问怎么办公交卡","a":"Hi, how do I get a transit card?"},{"o":"I can sell you one here. It's five dollars.","h":"问有没有月票","a":"OK. Is there a monthly pass?"},{"o":"Yes, ninety dollars a month.","h":"问学生有没有优惠","a":"Is there a discount for students?"},{"o":"Yes, students pay half.","h":"说要办学生月票，问公交车能不能用","a":"Great, I'll get a student pass. Does it work on buses too?"},{"o":"Yes, buses and the subway.","h":"道谢","a":"Perfect. Thank you."}]},"c":"美国大城市有交通卡，现在很多地方也可以直接刷手机或银行卡。学生常有优惠月票。","n":[[1,"给卡充值也可以说 top up 或 reload。",[["Can I top up my card here?","能在这儿充值吗？"],["How do I reload it?","怎么充值？"]]],[4,"刷卡失败时，请工作人员帮忙。",[["It says insufficient funds.","上面显示余额不足。"],["The gate won't open.","闸机打不开。"]]]]},{"t":"Comforting a friend","zh":"安慰朋友","k":"life","s":[["Are you OK? You look upset.","你还好吗？你看起来不开心。"],["Do you want to talk about it?","你想聊聊吗？"],["I'm sorry you're going through this.","很遗憾你要经历这些。"],["That must be really hard.","那一定很难受。"],["I'm here if you need anything.","需要什么我都在。"],["Let's grab some food and take your mind off it.","我们去吃点东西，换换心情。"],["Things will get better.","会好起来的。"]],"d":{"intro":"你的朋友考试没考好，很难过。","turns":[{"o":"(Your friend looks sad.)","h":"问她还好吗","a":"Are you OK? You look upset."},{"o":"Not really. I failed my exam.","h":"表示同情，问她想不想聊聊","a":"I'm sorry. Do you want to talk about it?"},{"o":"I studied so hard, but it didn't help.","h":"说那一定很难受，但会好起来的","a":"That must be really hard. But things will get better."},{"o":"Thanks. I just need a break.","h":"提议一起去吃点东西","a":"Let's grab some food and take your mind off it."}]},"c":"安慰美国朋友，重点是倾听和表示理解，而不是马上给建议。先问对方想不想聊。","n":[[3,"表示理解对方的感受，比给建议更重要。",[["That sounds really tough.","听起来真的很难。"],["I can't imagine how you feel.","我无法想象你有多难受。"]]],[4,"表示支持的万能句。",[["Just let me know if I can help.","需要帮忙就告诉我。"],["You can call me anytime.","随时给我打电话。"]]]]},{"t":"Sharing good news","zh":"分享好消息","k":"life","s":[["Guess what?","你猜怎么着？"],["I have some good news.","我有个好消息。"],["I got accepted!","我被录取了！"],["I can't believe it.","我简直不敢相信。"],["Congratulations! You deserve it.","恭喜！这是你应得的。"],["Let's celebrate!","我们庆祝一下吧！"],["Thanks for always supporting me.","谢谢你一直支持我。"]],"d":{"intro":"你收到了国外大学的录取通知，告诉朋友。","turns":[{"o":"Hey, what's up? You look happy.","h":"说猜猜看，你有好消息","a":"Guess what? I have some good news."},{"o":"Tell me!","h":"说你被国外的学校录取了","a":"I got accepted to a university abroad!"},{"o":"No way! Congratulations! You deserve it.","h":"说不敢相信，谢谢她一直支持你","a":"I can't believe it. Thanks for always supporting me."},{"o":"We have to celebrate!","h":"提议今晚请她吃饭","a":"Let's go out for dinner tonight. It's on me!"}]},"c":"美国人分享好消息很直接，对方也会很热情地回应。听到好消息要马上表示高兴，语气要足。","n":[[0,"Guess what? 是“你猜怎么着？”，用来引出好消息。对方常回 What?",[["You won't believe this.","你不会相信的。"],["I have news!","我有消息要说！"]]],[4,"Congratulations 常缩成 Congrats。You deserve it 是“这是你应得的”。",[["Congrats! That's amazing!","恭喜！太棒了！"],["I'm so happy for you!","真为你高兴！"]]]]},{"t":"Talking about the weather","zh":"聊天气","k":"life","s":[["Beautiful day, isn't it?","今天天气真好，是吧？"],["It's supposed to rain later.","据说晚点会下雨。"],["I hope it warms up soon.","希望快点暖和起来。"],["It's so humid today.","今天好闷热。"],["Don't forget your umbrella.","别忘了带伞。"],["What's the weather like in your hometown?","你家乡的天气怎么样？"],["Fuzhou is hot and humid in summer.","福州夏天又热又潮湿。"]],"d":{"intro":"等公交时，旁边的人跟你聊天。","turns":[{"o":"Beautiful day, isn't it?","h":"同意，说据说晚点会下雨","a":"It is! But it's supposed to rain later."},{"o":"Oh really? I didn't bring an umbrella.","h":"说你也没带","a":"Me neither. Let's hope it doesn't."},{"o":"Where are you from, if you don't mind me asking?","h":"说你来自中国福州","a":"I'm from Fuzhou, in China."},{"o":"What's the weather like there?","h":"说夏天又热又潮湿，冬天比较暖和","a":"Hot and humid in summer, and pretty mild in winter."}]},"c":"天气是最安全的闲聊话题。美国用华氏度：70°F 约 21°C，90°F 约 32°C，32°F 是 0°C。","n":[[1,"It's supposed to + 动词，是“按说会……”，常用来说天气预报。",[["They say it's going to rain.","据说要下雨。"],["The forecast says snow tomorrow.","预报说明天下雪。"]]],[3,"humid 是潮湿，muggy 是又湿又闷。",[["It's so muggy today.","今天好闷。"],["It's freezing!","冷死了！"]]]]},{"t":"Small talk before class","zh":"课前和同学闲聊","k":"academic","s":[["Is anyone sitting here?","这儿有人坐吗？"],["Did you do the reading?","你看了阅读材料吗？"],["I didn't understand the last part.","最后一部分我没看懂。"],["Do you know when the assignment is due?","你知道作业什么时候交吗？"],["Do you want to study together?","要不要一起学习？"],["What's your major?","你学什么专业？"],["See you next class.","下节课见。"]],"d":{"intro":"上课前，你坐到一位同学旁边。","turns":[{"o":"(You see an empty seat.)","h":"问这儿有没有人坐","a":"Hi, is anyone sitting here?"},{"o":"No, go ahead. I'm Sarah.","h":"自我介绍，问她学什么专业","a":"Thanks. I'm Yang. What's your major?"},{"o":"Chemistry. You?","h":"说物理，问她作业什么时候交","a":"Physics. Do you know when the assignment is due?"},{"o":"Next Friday, I think.","h":"提议一起学习","a":"Do you want to study together sometime?"}]},"c":"美国课堂座位不固定。提前坐下和旁边的同学聊几句，是交朋友的好机会。","n":[[0,"和 Is this seat taken? 意思一样。",[["Is this seat taken?","这个座位有人吗？"],["Mind if I sit here?","介意我坐这儿吗？"]]],[3,"be due 是截止、到期。",[["When's the deadline?","截止时间是什么时候？"],["Is it due on Friday?","是周五交吗？"]]]]},{"t":"Office hours","zh":"去教授的答疑时间","k":"academic","s":[["Do you have a few minutes?","您有几分钟时间吗？"],["I have a question about the homework.","我有个关于作业的问题。"],["I'm not sure I understand this step.","这一步我不太确定我理解了。"],["Could you explain it another way?","您能换个方式解释吗？"],["That makes sense now.","现在明白了。"],["Could you recommend some extra reading?","您能推荐一些课外阅读吗？"],["Thank you for your time.","谢谢您的时间。"]],"d":{"intro":"你去教授的答疑时间问问题。","turns":[{"o":"Come in! How can I help?","h":"问她有没有几分钟","a":"Hi Professor. Do you have a few minutes?"},{"o":"Of course. What's on your mind?","h":"说有个作业问题，这一步不太懂","a":"I have a question about the homework. I don't understand this step."},{"o":"Ah, here we use the energy balance.","h":"请她换个方式解释","a":"Sorry, could you explain it another way?"},{"o":"Think of it like money in and money out.","h":"说现在明白了","a":"Oh, that makes sense now."},{"o":"Great. Anything else?","h":"道谢","a":"No, that's all. Thank you for your time."}]},"c":"office hours 是教授固定的答疑时间，美国学生经常去，不去反而吃亏。去之前准备好具体问题。","n":[[2,"用 not sure 让提问显得谦虚，不像在说老师讲得不清楚。",[["I got lost at this step.","我在这一步跟不上了。"],["Could you go over this part again?","能把这部分再讲一遍吗？"]]],[3,"请对方换个方式讲，比只说 I don't understand 更有建设性。",[["Could you give me an example?","能举个例子吗？"],["Could you draw it for me?","能画给我看吗？"]]]]},{"t":"A group project","zh":"小组作业","k":"academic","s":[["How should we split the work?","我们怎么分工？"],["I can do the data analysis.","我可以做数据分析。"],["When should we meet next?","我们下次什么时候见？"],["Let's make a group chat.","我们建个群聊吧。"],["Can you send me your part by Friday?","你周五前能把你的部分发给我吗？"],["I'm a bit behind, sorry.","我有点落后了，抱歉。"],["Good job, everyone.","大家做得很好。"]],"d":{"intro":"你和两个同学开小组会。","turns":[{"o":"OK, how should we split the work?","h":"说你可以做数据分析","a":"I can do the data analysis."},{"o":"Great. I'll write the introduction.","h":"提议建一个群聊","a":"Sounds good. Let's make a group chat."},{"o":"Good idea. When should we meet next?","h":"提议下周二","a":"How about next Tuesday?"},{"o":"Works for me. Can everyone finish their part by Monday?","h":"说没问题","a":"No problem. I'll send mine by Monday."}]},"c":"美国的小组作业要明确分工和截止时间，大家常用群聊和共享文档。进度落后要主动说，不要拖到最后。","n":[[0,"How should we ...? 用来征求大家意见。",[["Who wants to do what?","谁想做哪部分？"],["Let's divide it into three parts.","我们分成三部分吧。"]]],[5,"主动说明进度落后，比拖延更受尊重。",[["I need a couple more days.","我还需要几天。"],["I'll have it done by Monday.","我周一前做完。"]]]]},{"t":"At the international student office","zh":"国际学生办公室","k":"academic","s":[["I'm a new international student.","我是新来的国际学生。"],["I need help with my visa documents.","我的签证材料需要帮助。"],["Where do I register for classes?","在哪里选课？"],["Can I work part-time on campus?","我可以在校内打工吗？"],["How do I get a student ID card?","学生证怎么办？"],["Is there an orientation for new students?","有新生入学介绍会吗？"],["Who should I contact if I have a problem?","有问题我应该联系谁？"]],"d":{"intro":"你刚到国外学校，去国际学生办公室。","turns":[{"o":"Hi, how can I help you?","h":"说你是新来的国际学生","a":"Hi, I'm a new international student."},{"o":"Welcome! What do you need?","h":"问学生证怎么办","a":"How do I get a student ID card?"},{"o":"Go to the card office in the library with your passport.","h":"问有没有新生介绍会","a":"Thanks. Is there an orientation for new students?"},{"o":"Yes, next Monday at ten.","h":"问能不能在校内打工","a":"Great. Can I work part-time on campus?"},{"o":"Yes, up to twenty hours a week.","h":"道谢","a":"Thank you so much."}]},"c":"国际学生办公室管签证、身份、打工许可。签证相关的问题一定要问他们，不要自己猜。","n":[[1,"I need help with ... 在各种办事窗口都能用。",[["I have a question about my visa.","我有个关于签证的问题。"],["I need to update my address.","我需要更新地址。"]]],[6,"办事时留一个联系人很重要。",[["Is there someone I can email?","有我可以发邮件联系的人吗？"],["Can I get your email?","能给我你的邮箱吗？"]]]]},{"t":"First day: meeting colleagues","zh":"第一天见同事","k":"academic","s":[["Hi, I'm Yang. I'm new here.","你好，我是 Yang，我是新来的。"],["Nice to finally meet you.","终于见到你了。"],["What are you working on?","你在做什么项目？"],["Where can I get coffee around here?","这附近哪里能买咖啡？"],["Let me know if you need any help.","需要帮忙就告诉我。"],["I'm still learning how things work.","我还在熟悉这里的流程。"],["Do you guys have lunch together?","你们一起吃午饭吗？"]],"d":{"intro":"你第一天到国外的实验室，遇到同事 David。","turns":[{"o":"Hey, you must be the new student!","h":"自我介绍，说你是新来的","a":"Hi, I'm Yang. I'm new here."},{"o":"Welcome! I'm David. I sit right over there.","h":"问他在做什么项目","a":"Nice to meet you, David. What are you working on?"},{"o":"Mostly computer simulations of fluids.","h":"说你也做模拟","a":"Cool! I do simulations too."},{"o":"Great, we should talk more. We usually have lunch at noon.","h":"说很乐意一起","a":"I'd love to join you."}]},"c":"美国的实验室和办公室里大家直接叫名字，包括老板。新来的人主动打招呼、问问题是正常的。","n":[[1,"之前邮件或电话联系过、第一次见面时说。",[["I've heard a lot about you.","久仰大名。"],["Good to meet you in person.","很高兴见到你本人。"]]],[5,"新人常用，显得谦虚又积极。",[["I'm still figuring things out.","我还在摸索。"],["I'm still getting used to things here.","我还在适应这里。"]]]]},{"t":"Your research, simply","zh":"简单介绍你的研究","k":"academic","s":[["I study physics, mainly heat transfer.","我学物理，主要研究传热。"],["My research is about how heat moves in gases.","我的研究是关于热在气体中如何传递。"],["We use computer simulations.","我们用计算机模拟。"],["It's a bit like a one-way valve for heat.","它有点像热的单向阀。"],["The idea is simple, but the details are tricky.","想法很简单，但细节很复杂。"],["It could be useful for managing heat in devices.","它可能对设备里的热管理有用。"],["I'm still working on it.","我还在做。"]],"d":{"intro":"一位不是物理专业的朋友问你在研究什么。","turns":[{"o":"So what do you actually research?","h":"说你研究热在气体中如何传递","a":"I study how heat moves in gases."},{"o":"Interesting. How do you study that?","h":"说主要用计算机模拟","a":"Mostly with computer simulations."},{"o":"What's the main idea?","h":"用'热的单向阀'来比喻","a":"It's a bit like a one-way valve for heat. Heat flows more easily in one direction."},{"o":"Wow. Is it useful for anything?","h":"说可能用于设备散热","a":"It could be useful for managing heat in devices."},{"o":"Cool. Are you finished?","h":"说还在做","a":"Not yet. I'm still working on it."}]},"c":"向非同行介绍研究，要用最简单的词加一个生活中的比喻，30 秒说完。对方感兴趣自然会接着问。","n":[[3,"It's a bit like ... 用比喻解释复杂概念，非常有效。",[["Think of it like a one-way street for heat.","可以把它想成热量的单行道。"],["It's similar to a diode, but for heat.","类似二极管，只不过是针对热的。"]]],[4,"tricky 是棘手、不好弄，比 difficult 口语。",[["The hard part is the details.","难的是细节。"],["It's harder than it sounds.","比听起来难。"]]]]},{"t":"Meeting your supervisor","zh":"和导师见面","k":"academic","s":[["Thank you for taking the time to meet me.","谢谢您抽时间见我。"],["Could I ask you about my project?","我能问一下我的课题吗？"],["I've been working on the simulations.","我一直在做模拟。"],["I'm stuck on one problem.","我卡在一个问题上。"],["What do you suggest I try next?","您建议我接下来试什么？"],["Could you recommend some papers?","您能推荐一些论文吗？"],["I'll send you an update next week.","我下周给您发进展。"]],"d":{"intro":"你第一次和国外的导师 Dr. Brown 单独见面。","turns":[{"o":"Come in, Yang. Have a seat.","h":"谢谢他抽时间","a":"Thank you for taking the time to meet me."},{"o":"Of course. How's everything going?","h":"说一直在做模拟，但卡在一个问题上","a":"I've been working on the simulations, but I'm stuck on one problem."},{"o":"What kind of problem?","h":"说结果在高温时不稳定","a":"The results aren't stable at high temperatures."},{"o":"Maybe try a smaller time step first.","h":"说好的，并请他推荐论文","a":"OK, I'll try that. Could you also recommend some papers?"},{"o":"Sure, I'll email you a few.","h":"说下周给他发进展","a":"Thank you. I'll send you an update next week."}]},"c":"和导师见面前准备好要讨论的问题。见面时先说进展，再说卡在哪，最后问建议。会后发一封邮件总结。","n":[[3,"I'm stuck on ... 是“我卡在……上了”，比 I have a problem 具体。",[["I've hit a wall with this.","我在这上面碰壁了。"],["I can't figure out why this happens.","我想不通为什么会这样。"]]],[4,"征求建议的礼貌问法。",[["What would you do in my position?","如果是你，你会怎么做？"],["Do you have any ideas?","你有什么想法吗？"]]]]},{"t":"In the lab","zh":"实验室日常","k":"academic","s":[["Is anyone using this computer?","有人在用这台电脑吗？"],["How long will your job take on the server?","你在服务器上的任务要跑多久？"],["Could you show me how this works?","你能教我这个怎么用吗？"],["I think there's a bug in my code.","我觉得我的代码有 bug。"],["Do you have a minute?","你有空吗？"],["Let me double-check the results.","让我再检查一下结果。"],["That makes sense.","明白了，有道理。"]],"d":{"intro":"你想用实验室的服务器，问同组的 Alex。","turns":[{"o":"Hey Yang, what's up?","h":"问他有没有空","a":"Hi Alex, do you have a minute?"},{"o":"Sure, what do you need?","h":"问他服务器上的任务要跑多久","a":"How long will your job take on the server?"},{"o":"Probably until tonight. Why?","h":"说你也想跑一个模拟","a":"I'd like to run a simulation too."},{"o":"You can use nodes one to four. I'm only on five to eight.","h":"说明白了，并请他教你提交任务","a":"That makes sense. Could you show me how to submit a job?"},{"o":"Sure, it's easy. Come here.","h":"道谢","a":"Thanks a lot."}]},"c":"实验室里用共享的电脑、服务器前要先问。找人问问题先问 Do you have a minute?，对方忙会告诉你什么时候有空。","n":[[4,"打扰别人前先问，最常用。",[["Got a second?","有空吗？"],["Is now a good time?","现在方便吗？"]]],[5,"double-check 是再检查一遍。",[["Let me run it again.","我再跑一遍。"],["I'll look into it.","我查一下。"]]]]},{"t":"Networking at a conference","zh":"会议茶歇社交","k":"academic","s":[["Hi, I really enjoyed your talk.","你好，我很喜欢你的报告。"],["I'm a graduate student at Fuzhou University.","我是福州大学的研究生。"],["I work on thermal rectification.","我做热整流方向。"],["How did you get the idea for that?","你是怎么想到这个的？"],["Could I email you some questions later?","我之后可以给你发邮件问问题吗？"],["Here's my card.","这是我的名片。"],["It was great talking to you.","和你聊天很愉快。"]],"d":{"intro":"茶歇时，你走向刚做完报告的 Dr. Lee。","turns":[{"o":"Hi there.","h":"说很喜欢她的报告","a":"Hi, I really enjoyed your talk."},{"o":"Thank you! Which part were you interested in?","h":"说对模拟方法感兴趣","a":"The simulation method. I work on something similar."},{"o":"Oh, what do you work on?","h":"说你是福州大学的学生，做热整流","a":"I'm a student at Fuzhou University. I work on thermal rectification in gases."},{"o":"That's interesting! We should keep in touch.","h":"问能不能之后给她发邮件","a":"I'd love that. Could I email you some questions later?"},{"o":"Of course. Here's my card.","h":"道谢，说聊天很愉快","a":"Thank you. It was great talking to you."}]},"c":"会议茶歇是认识人的好机会。夸对方的报告、问一个具体问题，是最自然的开场。会后发邮件时提一句在会上聊过。","n":[[0,"最自然的开场白。",[["Great talk!","报告很精彩！"],["Your talk was really interesting.","你的报告很有意思。"]]],[4,"问能不能之后联系，对方一般都乐意。",[["Could we stay in touch?","我们能保持联系吗？"],["Do you have a card?","你有名片吗？"]]]]},{"t":"Giving a talk: opening","zh":"学术报告：开场与过渡","k":"academic","s":[["Good morning, everyone. Thank you for coming.","大家早上好，谢谢各位到场。"],["Today I'm going to talk about heat transport in gases.","今天我要讲气体中的热输运。"],["First, I'll give some background.","首先我介绍一些背景。"],["Next, I'll show our simulation results.","接下来我展示我们的模拟结果。"],["As you can see in this figure, ...","如图所示，……"],["Let me move on to the next part.","我们进入下一部分。"],["To sum up, ...","总结一下，……"]],"d":{"intro":"你在组会上做报告，按提示说出每一段的开头。","turns":[{"o":"(Chair) Our next speaker is Yang Chao.","h":"问好并感谢大家","a":"Good morning, everyone. Thank you for coming."},{"o":"(The audience waits for you to begin.)","h":"说今天讲什么","a":"Today I'm going to talk about heat transport in gases."},{"o":"(You show your outline slide.)","h":"说先讲背景，再讲结果","a":"First, I'll give some background. Then I'll show our results."},{"o":"(You show a figure.)","h":"用'如图所示'引出结果","a":"As you can see in this figure, the heat flow depends on the direction."},{"o":"(Last slide.)","h":"总结并感谢","a":"To sum up, gravity can create thermal rectification. Thank you for listening."}]},"c":"美国学术报告开场简短，先说清楚要讲什么、分几部分。讲的时候看着听众，不要一直念稿。","n":[[1,"报告开场最标准的句型。",[["In this talk, I'll focus on heat transport in gases.","这个报告我会重点讲气体中的热输运。"],["I'd like to share some of our recent results.","我想分享一下我们最近的一些结果。"]]],[5,"过渡句，告诉听众下一部分开始了。",[["Now let's look at the results.","现在我们来看结果。"],["That brings me to my next point.","这就引出了我的下一点。"]]]]},{"t":"Asking questions after a talk","zh":"报告后提问","k":"academic","s":[["Thank you for the great talk.","感谢精彩的报告。"],["I have a question about your method.","我对你的方法有个问题。"],["Could you go back to slide five?","能回到第五页吗？"],["Have you tried a different boundary condition?","你试过别的边界条件吗？"],["How does this compare with experiments?","这和实验比怎么样？"],["Just to make sure I understand, ...","确认一下我的理解，……"],["That's very helpful, thank you.","这很有帮助，谢谢。"]],"d":{"intro":"报告结束，主持人请大家提问，你举手。","turns":[{"o":"(Chair) Any questions? Yes, please.","h":"感谢报告，说对方法有问题","a":"Thank you for the great talk. I have a question about your method."},{"o":"Sure, go ahead.","h":"请他回到第五页","a":"Could you go back to slide five, please?"},{"o":"Here it is.","h":"问是否试过别的边界条件","a":"Have you tried a different boundary condition?"},{"o":"Not yet, but that's a good idea.","h":"再问和实验比怎么样","a":"And how does this compare with experiments?"},{"o":"It agrees within about five percent.","h":"道谢","a":"That's very helpful, thank you."}]},"c":"美国报告后提问很踊跃。先感谢，再用一句话说明你的问题，越具体越好。","n":[[3,"Have you tried ...? 是委婉地提建议或质疑，不显得冒犯。",[["Did you consider a different boundary condition?","你考虑过用不同的边界条件吗？"],["What happens if you change the temperature?","改变温度会怎样？"]]],[5,"先复述对方的意思再提问，避免误解。",[["If I understand correctly, the effect gets stronger with gravity?","如果我理解得对，这个效应随重力增强？"],["So the main idea is that heat moves one way more easily?","所以核心想法是热朝一个方向更容易走？"]]]]},{"t":"Answering questions","zh":"回答提问","k":"academic","s":[["That's a great question.","这个问题很好。"],["If I understand correctly, you're asking about ...","如果我理解对了，你是在问……"],["We haven't tested that yet.","这个我们还没测试过。"],["That's something we plan to do next.","这是我们下一步打算做的。"],["I'm not sure, but my guess is ...","我不太确定，但我推测……"],["Could you repeat the question?","能再说一下问题吗？"],["Maybe we can talk more after the session.","我们会后可以再聊。"]],"d":{"intro":"你做完报告，有人提问。","turns":[{"o":"How sensitive are your results to the gas density?","h":"先说问题很好，确认理解","a":"That's a great question. If I understand correctly, you're asking about the effect of density?"},{"o":"Yes, exactly.","h":"说还没测试，是下一步计划","a":"We haven't tested that yet. That's something we plan to do next."},{"o":"Do you expect the effect to get stronger?","h":"说不确定，但推测会变强","a":"I'm not sure, but my guess is that it will get stronger."},{"o":"(Another person asks very quickly, you miss it.)","h":"请对方重复问题","a":"Sorry, could you repeat the question?"},{"o":"(Chair) We're out of time.","h":"说会后可以再聊","a":"Maybe we can talk more after the session. Thank you."}]},"c":"被问到不会的问题，诚实地说不知道很正常，然后说你的猜测，或者约会后再聊。千万不要硬编答案。","n":[[2,"诚实回答答不上的问题。",[["That's a good point. We haven't looked at that.","好问题，这个我们还没研究过。"],["I don't know, but I'll look into it.","我不知道，但我会去查一下。"]]],[6,"问题太复杂或时间不够时，礼貌地推到会后。",[["Let's talk about it offline.","我们会后再聊。"],["I'd be happy to discuss it after the talk.","我很乐意会后再讨论。"]]]]},{"t":"An online project meeting","zh":"线上项目会议","k":"academic","s":[["Can everyone hear me?","大家能听到我吗？"],["Let me share my screen.","我来共享一下屏幕。"],["Sorry, you're breaking up.","不好意思，你那边声音断断续续的。"],["I'd like to give a quick update.","我简单汇报一下进展。"],["We're a bit behind schedule.","我们进度有点落后。"],["Could we set a deadline for that?","我们能给这个定个截止时间吗？"],["I'll follow up with an email.","我会再发邮件跟进。"]],"d":{"intro":"你参加一个线上会议，和合作者讨论项目。","turns":[{"o":"Hi everyone. Yang, are you there?","h":"问大家能不能听到你","a":"Yes, I'm here. Can everyone hear me?"},{"o":"Loud and clear. Could you give us an update?","h":"说你来共享屏幕，简单汇报","a":"Sure. Let me share my screen and give a quick update."},{"o":"How's the timeline looking?","h":"说进度有点落后","a":"We're a bit behind schedule, about one week."},{"o":"OK. When can you finish the next round?","h":"提议定个截止时间：下周五","a":"Could we set the deadline for next Friday?"},{"o":"That works. Thanks, Yang.","h":"说会发邮件跟进","a":"Thank you. I'll follow up with an email."}]},"c":"线上会议开头常会互相确认声音。不说话时把麦克风静音（mute），发言前记得取消静音。","n":[[2,"线上开会最常用的一句。",[["You're cutting out.","你的声音断了。"],["I think you're on mute.","你好像静音了。"]]],[6,"follow up 是跟进，会后发邮件确认的标准说法。",[["I'll send everyone a summary.","我会给大家发个总结。"],["Let's follow up next week.","我们下周再跟进。"]]]]}],"listen":[{"s":"lle1","n":1,"t":"Welcome!"},{"s":"lle1","n":2,"t":"Hello, I'm Anna!"},{"s":"lle1","n":3,"t":"I'm Here!"},{"s":"lle1","n":4,"t":"What Is It?"},{"s":"lle1","n":5,"t":"Where Are You?"},{"s":"rev","of":"lle1","from":1,"to":5},{"s":"lle1","n":6,"t":"Where Is the Gym?"},{"s":"lle1","n":7,"t":"Wha l you.","I'm gonna call you.","I'm gonna call you.","I'm gonna call you.","going to + 动词 → gonna"],["It's going to rain.","it's gonna rain","It's gonna rain.","It's gonna rain.","going to + 动词 → gonna"],["What are you going to do?","whatcha gonna do","What are you gonna do?","What are you gonna do?","what are you → whatcha，going to → gonna"],["I don't want to be late.","I don't wanna be late.","I don't wanna be late.","I don't wanna be late.","want to → wanna"]],"nl":"听起来像","why":"want to 和 going to 在口语里出现得太频繁，读快了就缩成了 wanna 和 gonna。这不是“不标准”，母语者日常几乎都这么说。","when":"want to 后面接动词时 → wanna；going to 表示“将要做某事”、后面接动词时 → gonna。","tip":"自己说的时候，用 wanna、gonna 会更自然；写正式文章时还是写 want to、going to。","dlg":[["What are you going to do tonight?","I don't know. I just want to stay home."]]},{"t":"gotta 和 hafta","k":"gotta","r":"have got to / got to 说成 gotta；have to 说成 hafta，has to 说成 hasta。意思都是“必须”。","ex":[["I've got to go.","I gotta go.","I gotta go.","I('ve) gotta go.","have got to → gotta，I've 的 've 也常常听不见"],["You have to try this.","you hafta try this","You have to try this.","You hafta try this.","have to → hafta"],["She has to work today.","she hasta work today","She has to work today.","She hasta work today.","has to → hasta"],["We've got to hurry.","we gotta hurry","We gotta hurry.","We('ve) gotta hurry.","have got to → gotta"],["Do I have to pay now?","do I hafta pay now","Do I have to pay now?","Do I hafta pay now?","have to → hafta"]],"nl":"听起来像","why":"have got to（必须）在口语里缩成 gotta；have to 里的 v 受后面 t 的影响变成 f，听起来像 hafta。","when":"表示“必须”的时候：I've got to → I gotta；have to → hafta；has to → hasta。","tip":"I gotta go 是道别时最常用的一句。听到 hafta、hasta，要马上反应过来是“必须”。","dlg":[["Do you want to stay for dinner?","I'd love to, but I gotta go. I have to work early."]]},{"t":"of 弱读成 a","k":"a lot of","r":"of 在口语里经常只剩一个轻轻的 uh：a lot of 像 a lotta，kind of 像 kinda，out of 像 outta。","ex":[["I have a lot of work.","a lotta work","I have a lotta work.","I have a lotta work.","a lot of → a lotta（t 还会闪成 d：a lodda
