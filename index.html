    cb.append(el('div','small muted','让其他设备也同步：在手机、电脑的浏览器里打开同一个网址，进入“我的 → 设置”，粘贴同一个令牌即可。令牌只存在本机，不会被同步出去。'));
    cb.append(el('div','small','本机：'+devName()+(state.cloudMeta&&state.cloudMeta.at?'　·　云端最新一份来自：'+state.cloudMeta.name+'，'+new Date(state.cloudMeta.at).toLocaleString('zh-CN'):'')));
    if(state.syncLog && state.syncLog.length){ var lg=el('div','pron'); state.syncLog.forEach(function(x){ lg.append(el('div',null,new Date(x[0]).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+'　'+x[1])); }); cb.append(lg); }
    var cr=el('div','row');
    var nb=btn(SYNC_BUSY?'同步中…':'立即同步','sm pri',function(){ nb.disabled=true; nb.textContent='同步中…'; cloudSync(true).then(function(ok){ toast(ok?'已同步':'同步失败：'+(state.syncErr||''), 4000); render(); }); });
    if(SYNC_BUSY) nb.disabled=true;
    var rb2=btn('用云端覆盖本机','sm',function(){ if(!rb2.dataset.armed){ rb2.dataset.armed='1'; rb2.textContent='再点一次：本机进度会被云端替换'; return; } rb2.disabled=true; cloudRestore().then(function(s2){ s2.settings=state.settings; state=s2; save(); toast('已用云端覆盖本机'); render(); }).catch(function(e){ toast('失败：'+(e.message||e), 4000); render(); }); });
    var off=btn('关闭同步','sm',function(){ try{ localStorage.removeItem(CLOUD_KEY); }catch(e){} toast('已关闭，本机进度保留'); render(); });
    cr.append(nb, rb2, off); cb.append(cr);
  } else {
    cb.append(el('div','small muted','打开后，程序会把进度存到你的 GitHub 账号（一个不公开的 Gist）。在 iPad、手机、电脑上都填同一个令牌，进度就会自动合并、保持一致；删掉图标或换设备也能找回。'));
    var ol=el('ol','steps'); ['已经有令牌（ghp_ 开头）的话，直接粘贴到下面；以前在 iPad 上开过云端备份的，用同一个令牌。','还没有令牌：在电脑上（可以开翻墙）登录 github.com，打开 Settings → Developer settings → Personal access tokens → Tokens (classic) → Generate new token (classic)','Note 填 english app，Expiration 选 No expiration，权限只勾选 gist，点 Generate token，复制以 ghp_ 开头的那串字符'].forEach(function(t){ ol.append(el('li',null,t)); }); cb.append(ol);
    var ti=el('input'); ti.type='password'; ti.id='cloudToken'; ti.placeholder='粘贴 ghp_ 开头的令牌'; ti.autocomplete='off'; ti.setAttribute('autocapitalize','off'); cb.append(ti);
    var cr2=el('div','row');
    var cn2=btn('开启同步','sm pri',function(){ var v=$('cloudToken').value.trim(); if(!/^gh[pousr]_|^github_pat_/.test(v)){ toast('令牌格式不对，应该以 ghp_ 开头'); return; } try{ localStorage.setItem(CLOUD_KEY, v); }catch(e){} cn2.disabled=true; cn2.textContent='连接中…';
      cloudSync(true).then(function(ok){ toast(ok?'已开启，已和云端合并':'令牌已保存，但现在连不上 GitHub，稍后会自动重试：'+(state.syncErr||''), 5000); render(); }); });
    cr2.append(cn2); cb.append(cr2);
  }
  m.append(cb);
  // local snapshots
  var sn=el('section','card stack'); sn.append(el('h3',null,'本机自动快照'), el('div','small muted','程序每天自动在 iPad 上存一份快照，保留最近 14 天。误操作（比如点了清空）可以从这里恢复；但删除主屏幕图标会连快照一起删掉，所以云端备份或手动导出仍然需要。'));
  var sl=el('div','snaps'); sl.append(el('span','small muted','读取中…')); sn.append(sl);
  snapList().then(function(ks){ sl.replaceChildren(); if(!ks.length){ sl.append(el('span','small muted','还没有快照')); return; } ks.forEach(function(k){ var d=String(k).slice(5); var b=btn(d.slice(5).replace('-','/'),'sm',function(){ if(!b.dataset.armed){ b.dataset.armed='1'; b.textContent='恢复到 '+d.slice(5)+'？'; return; } idbGet(k).then(function(txt){ var s2=JSON.parse(txt); if(!s2||s2.v!==3) throw 0; state=s2; state.settings=Object.assign({},DEF,s2.settings||{}); save(); toast('已恢复到 '+d); render(); }).catch(function(){ toast('恢复失败'); }); }); sl.append(b); }); });
  m.append(sn);
  // reminders help
  var rm=el('section','card stack'); rm.append(el('h3',null,'每日提醒'), el('div','small muted','网页程序不能自己推送通知。可以用 iPad 自带的功能：'));
  var ol2=el('ol','steps'); ['“提醒事项”App：新建三个提醒，比如 8:30“背单词和表达”、12:30“精听 + 复述”、20:30“场景口语和听写”，重复选“每天”。','或者“快捷指令”App → 自动化 → 新建 → 特定时间 → 选“打开 App”或“打开网址”，填 https://yangchaokevin11-cmyk.github.io ，到点自动提醒你。'].forEach(function(t){ ol2.append(el('li',null,t)); }); rm.append(ol2); m.append(rm);
  var danger=el('section','card stack');
  danger.append(el('h3',null,'重新开始'), el('div','small muted','清空所有进度。建议先导出备份。'));
  var rb=btn('清空所有进度','warn',function(){ if(rb.dataset.armed){ localStorage.removeItem(LS); state=load(); TAB='today'; render(); toast('已清空'); return; } rb.dataset.armed='1'; rb.textContent='再点一次确认清空'; setTimeout(function(){ if(rb.isConnected){ delete rb.dataset.armed; rb.textContent='清空所有进度'; } },4000); });
  danger.append(rb); m.append(danger);
}
function exportBackup(){
  if(state.timer) stopTimer(true);
  state.lastExport=TODAY; save();
  var name='英语打卡备份-'+TODAY+'.json', txt=JSON.stringify(state);
  try {
    var file=new File([txt], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file], title:name}).catch(function(){}); return; }
  } catch(e){}
  try { var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'})); a.download=name; document.body.append(a); a.click(); a.remove(); toast('已导出到下载文件夹'); }
  catch(e){ toast('导出失败'); }
}

// ---------- render ----------
function render(){
  var m=$('main');
  var ae=document.activeElement;
  if(ae && ae.id==='note'){ day(TODAY).note=ae.value; save(); ae.blur(); }
  if(ae && ae.id==='dictpad' && DS){ DS.draft=ae.value; }
  var y=window.scrollY;
  m.replaceChildren();
  m.className = TAB==='words'?'m-words':TAB==='expr'?'m-expr':TAB==='dict'?'m-dict':TAB==='scene'?((SPK==='sound'||SPK==='tone')?'m-sound':'m-scene'):'';
  var tb=timerBar(); if(tb) m.append(tb);
  if(TAB==='today') renderToday(m);
  else if(TAB==='words') renderWords(m);
  else if(TAB==='expr') renderExpr(m);
  else if(TAB==='scene') renderSpeak(m);
  else if(TAB==='me') renderMe(m);
  else if(TAB==='dict') renderDict(m);
  else renderSettings(m);
  renderNav();
  window.scrollTo(0,y);
  afterRender();
  ftFab();
}
var ACHBUSY=false;
function afterRender(){
  var r=peek(TODAY);
  if(r && !r.cel && status(TODAY)==='full'){ r.cel=1; save(); setTimeout(function(){ confetti(170); toast('今日达标，太棒了！', 3500); }, 250); }
  if(!ACHBUSY){ ACHBUSY=true; setTimeout(function(){ ACHBUSY=false; checkAch(); }, 600); }
  if(state.lastSnap!==TODAY) setTimeout(snapSave, 1500);
  if(cloudToken() && Date.now()-SYNC_AT > 5*60000) setTimeout(function(){ cloudSync(false); }, 1500);
}
function tick(){
  checkStale();
  if(RS.state==='recording'){ var rt=document.querySelector('[data-rectime]'); if(rt) rt.textContent=clock(Date.now()-RS.t0).slice(1); }
  if(state.timer){
    var c=$('timerClock'); if(c) c.textContent=clock(Date.now()-state.timer.start);
    var tm=$('todayMin'); if(tm) tm.textContent=String(Math.floor(dayMin(TODAY)));
    var f=$('ringArc'); if(f){ var C=2*Math.PI*56; f.setAttribute('stroke-dashoffset', (C*(1-Math.min(1,dayMin(TODAY)/S().goal))).toFixed(1)); }
    var sp=document.querySelector('[data-spent="'+state.timer.task+'"]'); if(sp) sp.textContent='今天已学 '+Math.round(taskMin(state.timer.task))+' 分钟';
  }
  var t=ymd(new Date());
  if(t!==TODAY){ TODAY=t; WS={phase:null,stage:0,key:null,spoken:null,undo:null}; XS={key:null,stage:0,spoken:null}; SV=null; SL=null; DS=null; render(); }
}
setInterval(tick, 1000);
document.addEventListener('visibilitychange',function(){
  if(document.hidden && PL && !PL.done && !PL.paused){ PL.paused=true; plStop(); PL.until=0; plDraw(); }
  if(!document.hidden && PL) wakeOn();
  if(!document.hidden){ tick(); render(); if(cloudToken()) setTimeout(function(){ cloudSync(false); }, 800); } else if(cloudToken()){ cloudSync(true); }
});
function applyTheme(){
  var t=S().theme||'dark', d = t==='dark' || (t==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  var h=document.documentElement;
  if(d) h.setAttribute('data-dark',''); else h.removeAttribute('data-dark');
  if((S().font||'serif')==='serif') h.setAttribute('data-serif',''); else h.removeAttribute('data-serif');
  var m=document.querySelector('meta[name=theme-color]'); if(m) m.content = d ? '#0E1220' : '#F5F6F9';
}
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if(S().theme==='auto') applyTheme(); }); }catch(e){}
applyTheme();
checkStale();
render();
})();
</script>
