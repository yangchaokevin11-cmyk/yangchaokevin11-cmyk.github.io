<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英语打卡">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.json">
<script>
(function(){ var t='dark', f='serif';
  try{ var st=JSON.parse(localStorage.getItem('en-app-v3')); if(st && st.settings){ t=st.settings.theme||t; f=st.settings.font||f; } }catch(e){}
  var d = t==='dark' || (t==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  var h=document.documentElement; if(d) h.setAttribute('data-dark',''); if(f==='serif') h.setAttribute('data-serif','');
  if(d){ var m=document.querySelector('meta[name=theme-color]'); if(m) m.content='#0E1220'; }
})();
</script>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" href="/apple-touch-icon.png?v=3">
<title>英语打卡</title>
<style>
/* Layout: an iPad study app — one column, bottom tab bar, large touch targets. Ink-blue for actions, highlighter yellow for "done"; English headwords set like a dictionary entry. */
:root{
  --paper:#F5F6F9; --card:#FFFFFF; --ink:#1B2333; --muted:#5C6578; --line:#E0E4EC;
  --accent:#2445B5; --accent-soft:#E2E8FB; --mark:#F3CD52; --mark-soft:#FBF0C6; --on-mark:#1B2333;
  --ok:#1E7F4F; --ok-soft:#DDF1E6; --danger:#B4372B;
  --c-words:#2F5BD3; --c-words-soft:#E3EAFC; --c-listen:#0B7A8C; --c-listen-soft:#DDF1F3;
  --c-scene:#D9480F; --c-scene-soft:#FDE8DE; --c-extra:#7E4BD6; --c-extra-soft:#EEE6FB;
  --c-expr:#C2255C; --c-expr-soft:#FCE4EE; --c-sound:#A15C07; --c-sound-soft:#FBEBD3; --flame:#E8590C;
  --c-dict:#4C7A0B; --c-dict-soft:#E8F3D6;
  --f-display:"Songti SC","STSong","Noto Serif SC",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-word:"New York","Iowan Old Style",Georgia,serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --nav-h:64px;
}
html[data-dark]{
  --paper:#11151D; --card:#1A1F2A; --ink:#E6E9F0; --muted:#9AA2B4; --line:#2B3241;
  --accent:#8EA5FF; --accent-soft:#25305A; --mark:#D9B23C; --mark-soft:#4A3E1A; --ok:#5CC98E; --ok-soft:#1D3A2B; --danger:#F08A7E;
  --c-words:#8EA5FF; --c-words-soft:#232E52; --c-listen:#4FC3D1; --c-listen-soft:#173539; --c-scene:#FF9A66; --c-scene-soft:#42251A; --c-extra:#B79BFF; --c-extra-soft:#2E2448; --c-expr:#F783AC; --c-expr-soft:#45202F; --c-sound:#F0A04B; --c-sound-soft:#3F2C12; --flame:#FF8A4C; --c-dict:#A9E34B; --c-dict-soft:#26340F; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:860px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(var(--nav-h) + 28px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font-family:var(--f-display);font-size:28px}
h2{font-family:var(--f-display);font-size:20px}
h3{font-size:17px}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13.5px} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12.5px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:8px 16px;cursor:pointer;font-size:15.5px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--card);font-weight:600}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px;border-radius:9px}
.btn.big{min-height:56px;font-size:17px;padding:10px 22px;flex:1}
.btn:disabled{opacity:.4}
.btn.rec{border-color:var(--danger);color:var(--danger)}
.btn.rec.on{background:var(--danger);color:var(--card)}
.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;border-radius:20px;padding:1px 10px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.chip.full{background:var(--ok);color:var(--card)} .chip.floor{background:var(--mark);color:var(--on-mark)} .chip.mark{background:var(--mark-soft)}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;font-size:16px;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:0 max(8px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px,env(safe-area-inset-left))}
nav.tabs .in{display:flex;max-width:640px;width:100%}
.tab{flex:1;height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent)}
.tab .dot{position:absolute;top:10px;left:calc(50% + 8px);background:var(--mark);color:var(--on-mark);font-size:11px;font-family:var(--f-mono);border-radius:9px;padding:0 5px;line-height:17px}

/* timer bar */
.timerbar{position:sticky;top:max(8px,env(safe-area-inset-top));z-index:10;background:var(--accent);color:var(--card);border-radius:12px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between;box-shadow:0 4px 16px rgba(20,30,60,.18)}
.timerbar .btn{background:#fff;color:var(--accent);border:0;min-height:38px}

/* today */
.hero{display:flex;flex-direction:column;gap:12px}
.meter{position:relative;height:14px;background:var(--line);border-radius:7px;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--accent);transition:width .3s}
.meter .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--mark)}
.meter .tick span{position:absolute;top:18px;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.bignum{font-family:var(--f-mono);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.task{display:flex;flex-direction:column;gap:10px;position:relative}
.m-words{--mc:var(--c-words);--mc-soft:var(--c-words-soft)} .m-listen{--mc:var(--c-listen);--mc-soft:var(--c-listen-soft)}
.m-scene{--mc:var(--c-scene);--mc-soft:var(--c-scene-soft)} .m-extra{--mc:var(--c-extra);--mc-soft:var(--c-extra-soft)}
.m-expr{--mc:var(--c-expr);--mc-soft:var(--c-expr-soft)} .m-sound{--mc:var(--c-sound);--mc-soft:var(--c-sound-soft)}
.m-dict{--mc:var(--c-dict);--mc-soft:var(--c-dict-soft)} .m-story{--mc:var(--c-scene);--mc-soft:var(--c-scene-soft)}
.task .head{display:flex;gap:12px;align-items:center}
.micon{flex:none;width:42px;height:42px;border-radius:12px;background:var(--mc-soft);color:var(--mc);display:grid;place-items:center}
.micon svg{width:24px;height:24px}
.task .eyebrow{color:var(--mc)}
[class*="m-"] .btn.pri{background:var(--mc);border-color:var(--mc)}
[class*="m-"] .lesson{color:var(--mc)}
main[class*="m-"] h1{color:var(--mc)}
main[class*="m-"] .ph-step.cur{background:var(--mc-soft)}
main[class*="m-"] .ear{background:var(--mc-soft);color:var(--mc)}
main.m-scene .bubble.me,main.m-expr .bubble.me{background:var(--mc-soft)}
.timerbar[class*="m-"]{background:var(--mc)} .timerbar[class*="m-"] .btn{color:var(--mc)}
.pt-bands{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;width:100%;max-width:520px}
.pt-bands i{display:block;height:8px;border-radius:4px;background:var(--line)}
.pt-bands i.on{background:var(--mc)}
.task.done{border-color:var(--ok)}
.task .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.task h3{font-size:18px}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--card);cursor:pointer;padding:0}
.check svg{width:18px;height:18px;opacity:0}
.task.done .check{background:var(--ok);border-color:var(--ok)}
.task.done .check svg{opacity:1}
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:14.5px}
.steps li{margin:2px 0}
.lesson{font-family:var(--f-word);font-size:20px;font-style:italic}
.kw{font-family:var(--f-mono);font-size:13px;background:var(--paper);border-radius:8px;padding:4px 8px;user-select:all;-webkit-user-select:all}
.spent{font-size:13px;color:var(--muted)}
.road{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.road{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stage{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.stage.now{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.stage b{font-size:14px}
.pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}

/* flashcards */
.flash{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:30px 16px;min-height:330px;justify-content:center}
.hw{font-family:var(--f-word);font-size:46px;line-height:1.15;word-break:break-word}
.ph{font-family:var(--f-mono);color:var(--muted);font-size:15px}
.zh{font-size:18px;max-width:34em}
.ex{font-family:var(--f-word);font-style:italic;font-size:19px;color:var(--ink);max-width:34em}
.ear{width:120px;height:120px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.ear svg{width:54px;height:54px}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;max-width:520px}
.phases{display:flex;gap:8px;flex-wrap:wrap}
.ph-step{flex:1;min-width:120px;background:var(--paper);border-radius:10px;padding:8px 12px;font-size:13.5px}
.ph-step.cur{background:var(--accent-soft)}
.ph-step b{font-family:var(--f-mono);font-size:16px;display:block}

/* scenes */
.sent{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.sent:first-child{border-top:0}
.sent .en{font-family:var(--f-word);font-size:20px;line-height:1.4}
.sent .en.hide{color:transparent;background:var(--paper);border-radius:6px;user-select:none}
.sent .cn{color:var(--muted);font-size:14.5px}
.bubble{border-radius:14px;padding:14px 16px;max-width:92%}
.bubble.o{background:var(--paper);align-self:flex-start}
.bubble.me{background:var(--accent-soft);align-self:flex-end}
.bubble .who{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.bubble .en{font-family:var(--f-word);font-size:20px}
.talk{display:flex;flex-direction:column;gap:12px}
.slist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:560px){.slist{grid-template-columns:minmax(0,1fr)}}
.slist button{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px;display:flex;gap:8px;align-items:center}
.slist button.cur{border-color:var(--accent)}
.slist .n{font-family:var(--f-mono);color:var(--muted);font-size:12px;min-width:2em}

/* records */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .n{font-family:var(--f-mono);font-size:24px;line-height:1.2}
.kpi .n small{font-size:13px;color:var(--muted)}
.kpi .l{font-size:12.5px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center}
.cal .d{aspect-ratio:1;border-radius:8px;background:var(--paper);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px}
.cal .d.full{background:var(--ok);color:var(--card)}
.cal .d.floor{background:var(--mark);color:var(--on-mark)}
.cal .d.some{background:var(--accent-soft)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d.out{visibility:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{display:flex;align-items:flex-end;gap:3px;height:130px;border-bottom:1px solid var(--line);position:relative;min-width:420px}
.chart .c{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:0}
.chart .c.full{background:var(--ok)}
.chart .goal{position:absolute;left:0;right:0;border-top:1px dashed var(--mark)}
.chart .goal span{position:absolute;right:0;top:-16px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.xl{display:flex;gap:3px;min-width:420px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.xl span{flex:1;text-align:center}
.scroll-x{overflow-x:auto}
.wl{list-style:none;margin:0;padding:0}
.wl li{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.wl li:first-child{border-top:0}
.wl .w{font-family:var(--f-word);font-size:18px;font-weight:700}
.addw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;gap:8px}
@media (max-width:560px){.addw{grid-template-columns:minmax(0,1fr)}}
.advice{margin:0;padding-left:20px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field label{flex:1}
.field .hint{display:block;font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:50;max-width:90vw;text-align:center}
/* v6: hero, levels, badges, heatmap, expressions, sounds */
.lvchip{display:flex;flex-direction:column;align-items:flex-end;gap:0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px;cursor:pointer;color:var(--ink);font:inherit}
.lvchip b{font-family:var(--f-mono);font-size:17px;line-height:1.2} .lvchip span{font-size:11.5px;color:var(--muted)}
.herocard{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ringwrap{position:relative;width:136px;height:136px;flex:none}
.ring{width:136px;height:136px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:12}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring.full .ring-fg{stroke:var(--ok)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring-c .bignum{font-size:36px}
.herostats{flex:1;min-width:210px;display:flex;flex-direction:column;gap:12px}
.hs{display:flex;align-items:center;gap:12px}
.hs .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.hs .ic svg{width:22px;height:22px}
.hs b{font-family:var(--f-mono);font-size:21px;line-height:1.1;display:block}
.hs span{font-size:12.5px;color:var(--muted)}
.ic.flame{background:var(--c-scene-soft);color:var(--flame)} .ic.tasks{background:var(--ok-soft);color:var(--ok)}
.xpbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px} .xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--c-words),var(--c-expr))}
.dailyline{background:linear-gradient(135deg,var(--c-expr-soft),var(--c-extra-soft));border-color:transparent}
.dailyline .en{font-family:var(--f-word);font-size:25px;line-height:1.3}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--mark-soft);border:1px solid var(--mark);border-radius:14px;padding:14px 16px}
.opt{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:0 8px;margin-left:6px;font-weight:500;vertical-align:2px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px;max-width:420px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;min-height:40px;font-weight:600;color:var(--muted);cursor:pointer;font-size:15px}
.seg button.on{background:var(--card);color:var(--mc,var(--ink));box-shadow:0 1px 3px rgba(0,0,0,.08)}
.rule{font-size:15.5px;line-height:1.8}
.snd{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)} .snd:first-child{border-top:0}
.snd .en{font-family:var(--f-word);font-size:21px;line-height:1.35}
.snd .lk{display:inline-block;width:.55em;height:.42em;border:2px solid var(--mc);border-top:0;border-radius:0 0 .4em .4em;margin:0 .02em;vertical-align:-.12em}
.snd .like{font-family:var(--f-mono);font-size:14px;color:var(--mc)}
.catchip{font-size:12px;font-weight:600;border-radius:20px;padding:2px 10px;background:var(--mc-soft);color:var(--mc)}
.note{background:var(--mc-soft);border-radius:10px;padding:10px 14px;font-size:14.5px;max-width:34em;text-align:left;width:100%}
.wrong{text-decoration:line-through;color:var(--danger);font-family:var(--f-word);font-size:22px}
.flash .talk{width:100%;max-width:520px;text-align:left}
.levelcard{display:flex;flex-direction:column;gap:14px}
.lvbig{font-family:var(--f-mono);font-size:46px;line-height:1;color:var(--accent)}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.statgrid div{background:var(--paper);border-radius:10px;padding:10px 12px}
.statgrid b{display:block;font-family:var(--f-mono);font-size:20px} .statgrid span{font-size:12px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.bdg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 6px;border-radius:12px;background:var(--paper)}
.bdg .med{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:15px;background:var(--line);color:var(--muted)}
.bdg.on .med{background:var(--mc);color:#fff;box-shadow:0 0 0 4px var(--mc-soft)}

ve speakers."],["catch up","赶上；叙旧","Let's catch up over coffee."],["sort out","整理；解决","I need to sort out my visa first."],["bring up","提出（话题）；抚养","He brought up an interesting question."],["drop off","把……送到；放下","I'll drop you off at the airport."],["drop by","顺便拜访","Feel free to drop by my office."],["move in","搬进","We moved in last month."],["move out","搬出","I'm moving out next week."],["pay back","还钱","I'll pay you back tomorrow."],["slow down","放慢","Could you slow down a little, please?"],["calm down","冷静下来","Calm down, it's not a big problem."],["write down","写下","Let me write down your number."],["come across","偶然遇到","I came across an interesting paper."],["count on","依靠","You can count on me."],["think about","考虑","I'm thinking about studying abroad."],["talk about","谈论","What do you want to talk about?"],["hear from","收到……的消息","I haven't heard from him for weeks."],["ask for","请求，要求","Don't be afraid to ask for help."],["wait for","等待","I'm waiting for the bus."],["depend on","取决于；依靠","It depends on the weather."],["belong to","属于","This bag belongs to me."],["consist of","由……组成","The team consists of five people."],["result in","导致","The error resulted in a wrong answer."],["lead to","导致；通向","Too much stress can lead to illness."],["focus on","集中于","Today we'll focus on listening."],["rely on","依靠，依赖","Our results rely on this assumption."],["account for","解释；占（比例）","This effect accounts for about ten percent."],["base on","以……为基础","The model is based on real data."],["compare with","与……比较","Compared with last year, prices are higher."],["look into","调查，研究","We'll look into the problem."],["build on","在……基础上发展","Our work builds on earlier studies."],["back up","支持；备份","Can you back up your claim with data?"],["narrow down","缩小（范围）","We narrowed down the list to three options."],["rule out","排除","We can't rule out other explanations."],["come up","被提出；出现","A problem came up during the test."],["follow up","跟进","I'll follow up with an email."],["fall behind","落后","I fell behind in my studies last month."],["try on","试穿","Can I try on this jacket?"],["try out","试用","I want to try out the new app."],["eat out","在外面吃饭","We eat out on Fridays."],["clean up","打扫干净","Let's clean up the kitchen."],["throw away","扔掉","Don't throw away the receipt."],["run into","偶然碰到","I ran into my professor at the supermarket."],["stand out","突出，显眼","Your presentation really stood out."],["speak up","大声说；说出看法","Could you speak up a little?"],["grow up","长大","I grew up in a small town."],["settle in","安顿下来","It took me a few weeks to settle in."],["cut down on","减少","I'm trying to cut down on sugar."],["put up with","忍受","I can't put up with the noise anymore."],["get rid of","摆脱，扔掉","I need to get rid of some old clothes."],["make up","编造；弥补；化妆","I'll make up the lost time this weekend."],["make sure","确保","Make sure you lock the door."],["used to","过去常常","I used to play basketball every day."]],"scenes":[{"t":"Introducing yourself","zh":"自我介绍","k":"life","s":[["Hi, I'm Yang Chao. Nice to meet you.","你好，我是杨超，很高兴认识你。"],["You can call me Yang.","你可以叫我 Yang。"],["I'm from Fuzhou, in the south-east of China.","我来自福州，在中国东南部。"],["I'm a graduate student in physics.","我是物理专业的研究生。"],["I also help run a small factory.","我也在帮忙经营一家小工厂。"],["In my free time, I like watching videos and walking.","空闲时我喜欢看视频和散步。"],["Nice to meet you, too.","我也很高兴认识你。"]],"d":{"intro":"在一个聚会上，你第一次见到 Emma。","turns":[{"o":"Hi there! I'm Emma. What's your name?","h":"介绍你的名字","a":"Hi Emma, I'm Yang Chao. You can call me Yang."},{"o":"Nice to meet you, Yang. Where are you from?","h":"说你来自中国福州","a":"Nice to meet you too. I'm from Fuzhou, in China."},{"o":"Oh, cool. What do you do?","h":"说你是物理研究生","a":"I'm a graduate student. I study physics."},{"o":"Physics! That sounds hard. Do you like it?","h":"说你喜欢，但有时很难","a":"Yes, I like it, but sometimes it's really hard."},{"o":"What do you do for fun?","h":"说你喜欢看视频和散步","a":"I like watching videos and going for walks."}]},"c":"美国人初次见面通常只说名字，不交换名片，也不问年龄和收入。握手短而有力，看着对方眼睛。对方常会重复一遍你的名字来记住它。","n":[[1,"中文名对外国人很难发音，主动给一个好叫的叫法，对方会轻松很多。",[["Yang is fine.","叫我 Yang 就行。"],["Everyone calls me Yang.","大家都叫我 Yang。"]]],[3,"美国口语常说 grad student。说专业用 in physics，或者直接说 I study physics。",[["I'm a grad student. I study physics.","我是研究生，学物理。"],["I'm in grad school for physics.","我在读物理研究生。"]]]]},{"t":"Small talk","zh":"问候与闲聊","k":"life","s":[["How's it going?","最近怎么样？"],["Not bad, thanks. How about you?","还不错，谢谢。你呢？"],["Pretty good. Just a little tired.","挺好的，就是有点累。"],["It's really nice weather today, isn't it?","今天天气真好，是吧？"],["What are you up to this weekend?","这周末你打算做什么？"],["Nothing special. Maybe I'll just relax.","没什么特别的，可能就休息一下。"],["Have a good one!","祝你愉快！（告别）"]],"d":{"intro":"早上在楼道里碰到同事 Mike。","turns":[{"o":"Morning, Yang! How's it going?","h":"说还不错，并反问他","a":"Morning! Not bad, thanks. How about you?"},{"o":"Pretty good. Nice weather today, isn't it?","h":"同意，说天气真好","a":"Yeah, it's really nice today."},{"o":"Any plans for the weekend?","h":"说没什么特别的，可能休息","a":"Nothing special. Maybe I'll just relax at home."},{"o":"Sounds good. I'm going hiking with some friends.","h":"说听起来很有意思","a":"That sounds like fun. Have a great time!"},{"o":"Thanks! See you later.","h":"道别","a":"See you. Have a good one!"}]},"c":"How's it going 和 How are you 是打招呼，不是真的问你过得怎样。回一句 Good 或 Not bad，再反问一句就够了，不用讲细节。天气、周末计划是最安全的话题。","n":[[0,"How's it going? 就是“你好”，对方不期待详细回答。标准回法是简短回答再反问。",[["Good, you?","挺好的，你呢？"],["Pretty good. How about yourself?","挺好的，你自己呢？"]]],[6,"Have a good one! 是万能告别语，什么时间都能用，比 Goodbye 自然得多。",[["Have a good day!","祝你今天愉快！"],["Take care!","保重！"]]]]},{"t":"When you don't understand","zh":"听不懂时怎么办","k":"life","s":[["Sorry, could you say that again?","不好意思，你能再说一遍吗？"],["Could you speak a little more slowly, please?","你能说得慢一点吗？"],["Sorry, I didn't catch that.","抱歉，我没听清。"],["What does that word mean?","那个词是什么意思？"],["How do you spell that?","那个怎么拼？"],["Do you mean ...?","你的意思是……吗？"],["My English isn't perfect, so please bear with me.","我英语不太好，请多包涵。"]],"d":{"intro":"一位工作人员语速很快地跟你说话，你没听懂。","turns":[{"o":"You'll need to go to the second floor and get a form from the front desk before you see the advisor.","h":"说没听清，请他再说一遍","a":"Sorry, I didn't catch that. Could you say that again?"},{"o":"Sure. Second floor. Get a form. Then see the advisor.","h":"确认：你是说去二楼拿表？","a":"Do you mean I should go to the second floor and get a form?"},{"o":"Exactly. The form is called an I-twenty.","h":"问那个词怎么拼","a":"Sorry, how do you spell that?"},{"o":"I, then the number twenty. I-two-zero.","h":"说明白了，谢谢他","a":"Got it. Thank you for your patience."}]},"c":"听不懂就直接问。外国人很习惯和非母语者说话，完全不会觉得没礼貌。最忌讳的是假装听懂、一直点头，后面会更麻烦。","n":[[2,"I didn't catch that 是“我没听清”。比 I don't understand 好：问题在“没听清”，不会让对方觉得你英语不行。",[["Sorry, I missed that.","抱歉，我没听到。"],["Sorry, what was that?","抱歉，你说什么？"]]],[5,"Do you mean ...? 用来确认意思：把你理解的内容换个说法说出来，对方会说 Yes 或纠正你。",[["So you're saying it's closed today?","所以你是说今天关门？"],["Just to check, you mean tomorrow, right?","确认一下，你是说明天对吧？"]]]]},{"t":"Ordering coffee","zh":"咖啡店点单","k":"life","s":[["Can I get a medium latte, please?","请给我一杯中杯拿铁。"],["For here or to go?","在这儿喝还是带走？"],["To go, please.","带走，谢谢。"],["Could I have oat milk instead?","能换成燕麦奶吗？"],["Can I pay by card?","可以刷卡吗？"],["That's all, thanks.","就这些，谢谢。"],["Could I get a receipt, please?","能给我一张小票吗？"]],"d":{"intro":"你在一家咖啡店排到了柜台前。","turns":[{"o":"Hi! What can I get for you?","h":"点一杯中杯拿铁","a":"Hi, can I get a medium latte, please?"},{"o":"Sure. Any milk preference?","h":"说要燕麦奶","a":"Could I have oat milk, please?"},{"o":"Of course. For here or to go?","h":"说带走","a":"To go, please."},{"o":"Anything else?","h":"说就这些","a":"No, that's all, thanks."},{"o":"That'll be five fifty.","h":"问能不能刷卡","a":"Can I pay by card?"}]},"c":"美国点咖啡的流程：说要什么，店员问你的名字写在杯子上，付款，然后到另一头等着叫名字。杯型一般是 small、medium、large，星巴克叫 tall、grande、venti。","n":[[0,"Can I get ...? 是美国人点单最常用的句型，比 I want 礼貌，又不会太正式。",[["I'll have a medium latte.","我要一杯中杯拿铁。"],["Could I get an iced coffee?","能给我一杯冰咖啡吗？"]]],[1,"For here or to go? 是“在这儿喝还是带走”。听不出来就抓关键词 here 和 go。",[["Is that for here?","在这儿喝吗？"],["Is this to go?","这个是带走吗？"]]]]},{"t":"At the supermarket","zh":"超市购物","k":"life","s":[["Excuse me, where can I find the rice?","请问米在哪儿？"],["It's in aisle five, next to the pasta.","在五号货架，意面旁边。"],["Do you have any fresh fish?","有新鲜的鱼吗？"],["How much is this?","这个多少钱？"],["Is this on sale?","这个在打折吗？"],["I don't need a bag, thanks.","我不需要袋子，谢谢。"],["Do you take cash?","收现金吗？"]],"d":{"intro":"你在超市找不到米，问一位店员。","turns":[{"o":"Hi, can I help you find something?","h":"问米在哪儿","a":"Yes, please. Where can I find the rice?"},{"o":"It's in aisle five, next to the pasta.","h":"谢谢，再问有没有新鲜的鱼","a":"Thanks. Do you have any fresh fish?"},{"o":"Yes, the seafood counter is at the back of the store.","h":"道谢","a":"Great, thank you."},{"o":"(At the checkout) Would you like a bag?","h":"说不需要袋子","a":"No, I don't need a bag, thanks."},{"o":"Your total is twenty-three forty.","h":"问能不能刷卡","a":"Can I pay by card?"}]},"c":"美国超市的货架按 aisle（过道）编号，头顶挂牌写着这一排卖什么。找不到就问店员，他们通常会直接带你过去。","n":[[0,"Excuse me 开头引起注意，再用 where can I find ... 问东西在哪，是在店里找东西的标准问法。",[["Do you know where the rice is?","你知道米在哪儿吗？"],["Where do you keep the rice?","你们的米放在哪儿？"]]],[5,"店员常问 Do you need a bag?。注意 I'm good 在这里是“不用了”，不是“我很好”。",[["I'm good without a bag.","不用袋子。"],["No bag, thanks.","不要袋子，谢谢。"]]]]},{"t":"Asking for directions","zh":"问路","k":"life","s":[["Excuse me, how do I get to the train station?","请问去火车站怎么走？"],["Go straight and turn left at the second light.","直走，在第二个红绿灯左转。"],["Is it far from here?","离这儿远吗？"],["It's about a ten-minute walk.","走路大约十分钟。"],["Is there a bus that goes there?","有公交车到那儿吗？"],["So I go straight, then turn left?","所以我直走，然后左转？"],["Thanks for your help.","谢谢你的帮助。"]],"d":{"intro":"你在街上迷路了，问一位路人。","turns":[{"o":"You look lost. Can I help?","h":"问去火车站怎么走","a":"Yes, thanks. How do I get to the train station?"},{"o":"Go straight down this street and turn left at the second light.","h":"复述确认路线","a":"So I go straight, then turn left at the second light?"},{"o":"That's right.","h":"问远不远","a":"Is it far from here?"},{"o":"About ten minutes on foot.","h":"问有没有公交","a":"Is there a bus that goes there?"},{"o":"The number twelve, but walking is faster.","h":"道谢说你走过去","a":"OK, I'll walk then. Thanks for your help!"}]},"c":"美国城市常用 block（街区）说距离：two blocks down 就是往前走两个路口。现在大家多用地图软件，问路时对方也可能直接帮你看手机。","n":[[5,"问完路把对方的话重复一遍，是确认自己没听错的好办法，对方会说 Exactly 或者纠正你。",[["Just to make sure, I turn left at the second light?","确认一下，我在第二个红绿灯左转？"],["So it's on the right side?","所以在右手边？"]]],[3,"a ten-minute walk 是走路十分钟。ten-minute 中间有连字符，minute 不加 s。",[["It's about ten minutes on foot.","走路大概十分钟。"],["It's just around the corner.","就在拐角那儿，很近。"]]]]},{"t":"Taking public transport","zh":"乘坐公共交通","k":"life","s":[["Does this bus go downtown?","这辆车去市中心吗？"],["How much is a ticket?","票多少钱？"],["Where do I buy a ticket?","在哪儿买票？"],["Which stop should I get off at?","我应该在哪站下车？"],["How many stops is it?","要坐几站？"],["Could you tell me when we get there?","到了能告诉我一声吗？"],["I think I missed my stop.","我好像坐过站了。"]],"d":{"intro":"你上公交车前问司机。","turns":[{"o":"Good morning.","h":"问这辆车去不去市立医院","a":"Morning. Does this bus go to City Hospital?"},{"o":"Yes, it does.","h":"问票价","a":"How much is a ticket?"},{"o":"Two seventy-five. You can tap your card here.","h":"问要坐几站","a":"OK. How many stops is it?"},{"o":"About eight stops.","h":"请他到站时提醒你","a":"Could you tell me when we get there, please?"},{"o":"Sure, no problem.","h":"道谢","a":"Thank you so much."}]},"c":"美国公交很多是上车投零钱或刷卡，司机不找零。到站要拉车窗边的绳子或按按钮，提示灯会亮 stop requested。","n":[[3,"get off 是下车，get on 是上车。at 放在句末是口语常态。",[["Where should I get off?","我该在哪下车？"],["Is this my stop?","这是我要下的站吗？"]]],[5,"请司机或旁边的人到站提醒你，美国司机通常很乐意。",[["Could you let me know when we get to Main Street?","到 Main Street 能告诉我一声吗？"],["Can you tell me when to get off?","能告诉我什么时候下车吗？"]]]]},{"t":"At a restaurant","zh":"餐厅点餐","k":"life","s":[["A table for two, please.","两位，谢谢。"],["Could we see the menu, please?","能看一下菜单吗？"],["What do you recommend?","你推荐什么？"],["I'll have the chicken salad.","我要鸡肉沙拉。"],["Could I get some water, please?","能给我点水吗？"],["Could we get the check, please?","请结账。"],["Can we split the bill?","我们可以分开付吗？"]],"d":{"intro":"你和朋友去一家餐厅吃饭。","turns":[{"o":"Hi, welcome! How many?","h":"说两位","a":"Hi, a table for two, please."},{"o":"Right this way. Here are your menus. Can I get you something to drink?","h":"要水","a":"Could we get some water, please?"},{"o":"Sure. Are you ready to order?","h":"问服务员推荐什么","a":"Not yet. What do you recommend?"},{"o":"The grilled salmon is really popular.","h":"说你要三文鱼","a":"OK, I'll have the grilled salmon."},{"o":"(Later) How was everything?","h":"说很好吃，请结账","a":"It was great, thanks. Could we get the check, please?"}]},"c":"美国餐厅一般等人带位（Please wait to be seated），每桌有固定服务员。吃完要给小费，通常是税前金额的 15%–20%。叫服务员举手或用眼神示意，不要大声喊。","n":[[5,"美国说 check，英国说 bill。结账时服务员把账单拿到桌上，你放卡，他拿去刷完再拿回来让你签字、写小费。",[["Can we get the check?","能给我们账单吗？"],["We're ready for the check.","我们可以结账了。"]]],[6,"split the bill 是分开付。服务员常问 Together or separate?（一起付还是分开付）。",[["Can we pay separately?","我们能分开付吗？"],["Could you split it in half?","能平分成两份吗？"]]]]},{"t":"Passing immigration","zh":"机场入境","k":"life","s":[["I'm here to study.","我来这里读书。"],["I'm going to be a visiting student.","我是来做访问学生的。"],["I'll be staying for one year.","我会待一年。"],["I'll be staying in student housing.","我住学生宿舍。"],["Here is my passport and my visa.","这是我的护照和签证。"],["This is my letter from the university.","这是学校的录取信。"],["This is my first time here.","这是我第一次来。"]],"d":{"intro":"你在机场入境柜台。","turns":[{"o":"Passport, please.","h":"递上护照和签证","a":"Here is my passport and my visa."},{"o":"What's the purpose of your visit?","h":"说来读书","a":"I'm here to study."},{"o":"How long will you be staying?","h":"说待一年","a":"I'll be staying for one year."},{"o":"Where will you be staying?","h":"说住学生宿舍","a":"In student housing at the university."},{"o":"Do you have any documents from the school?","h":"说这是学校的信","a":"Yes, this is my letter from the university."}]},"c":"入境官的问题很短：来干什么、待多久、住哪里。回答要简短，和证件一致，不用主动多说。听不清就说 Sorry, could you repeat that?，完全没问题。","n":[[0,"回答来访目的用 I'm here to + 动词。入境官最常问 What's the purpose of your visit?",[["I'm here for school.","我来上学。"],["I'm here for a conference.","我来参加会议。"]]],[2,"待多久用 I'll be staying for + 时间。也可以只说时间。",[["About a year.","大约一年。"],["Until next June.","到明年六月。"]]]]},{"t":"Checking into a hotel","zh":"酒店入住","k":"life","s":[["I have a reservation under Yang.","我用 Yang 这个名字订了房。"],["I'd like to check in, please.","我想办理入住。"],["What time is check-out?","几点退房？"],["Is breakfast included?","含早餐吗？"],["What's the Wi-Fi password?","Wi-Fi 密码是多少？"],["Could I have a late check-out?","可以晚点退房吗？"],["The air conditioning isn't working.","空调坏了。"]],"d":{"intro":"你到了酒店前台。","turns":[{"o":"Good evening. How can I help you?","h":"说你要入住，用 Yang 订的","a":"Hi, I'd like to check in. I have a reservation under Yang."},{"o":"Let me see... Yes, three nights. Can I see your passport?","h":"递上护照","a":"Sure, here you go."},{"o":"Your room is 405.","h":"问含不含早餐","a":"Thank you. Is breakfast included?"},{"o":"Yes, from seven to ten in the restaurant.","h":"问 Wi-Fi 密码","a":"Great. What's the Wi-Fi password?"},{"o":"It's on the card with your key.","h":"问几点退房","a":"Thanks. And what time is check-out?"}]},"c":"美国酒店入住通常要刷信用卡做预授权（押金）。退房时间一般是上午 11 点左右。服务员帮你拿行李，每件给几美元小费。","n":[[0,"reservation under + 名字，是“用某某的名字订的”。前台最常问 Do you have a reservation?",[["I booked a room under Yang.","我用 Yang 这个名字订了一间房。"],["I booked online.","我是在网上订的。"]]],[6,"设备坏了用 isn't working，什么东西都能套。",[["The TV doesn't turn on.","电视打不开。"],["The AC is broken.","空调坏了。"]]]]},{"t":"Opening a bank account","zh":"银行开户","k":"life","s":[["I'd like to open a bank account.","我想开一个银行账户。"],["I'm an international student.","我是国际学生。"],["What documents do I need?","需要什么材料？"],["Is there a monthly fee?","有月费吗？"],["Can I get a debit card?","能办一张借记卡吗？"],["How long does it take to get the card?","卡多久能拿到？"],["Can I set up online banking?","可以开通网上银行吗？"]],"d":{"intro":"你去银行开户。","turns":[{"o":"Hello, what can I do for you today?","h":"说想开户，你是国际学生","a":"Hi, I'd like to open a bank account. I'm an international student."},{"o":"Sure. Do you have your passport and proof of address?","h":"问还需要什么材料","a":"Yes, I have my passport. What other documents do I need?"},{"o":"A letter from your school would help.","h":"说你带了，问有没有月费","a":"I have that here. Is there a monthly fee?"},{"o":"No fee for students.","h":"问能不能办借记卡","a":"Great. Can I get a debit card too?"},{"o":"Yes, it'll arrive by mail in about a week.","h":"道谢","a":"Perfect. Thank you for your help."}]},"c":"美国开户要带护照、签证材料、学生证和住址证明。debit card 是借记卡，花自己账户里的钱；credit card 是信用卡。留学生刚到一般先办 debit card。","n":[[2,"documents 是文件、证件的统称。问要带什么材料就用这句。",[["What do I need to bring?","我需要带什么？"],["Is my passport enough?","护照就够了吗？"]]],[3,"monthly fee 是账户管理费。很多银行对学生免费，或存款够一定数额就免，开户时一定要问。",[["Are there any fees?","有什么费用吗？"],["Is it free for students?","学生免费吗？"]]]]},{"t":"Getting a phone plan","zh":"办手机卡","k":"life","s":[["I need a SIM card for my phone.","我需要一张手机卡。"],["Do you have any prepaid plans?","有预付费套餐吗？"],["How much data does it include?","包含多少流量？"],["Can I make international calls?","能打国际电话吗？"],["Is there a contract?","需要签合约吗？"],["Can I keep my phone?","可以用我自己的手机吗？"],["I'll take this one.","我要这个。"]],"d":{"intro":"你在手机店办卡。","turns":[{"o":"Hi, how can I help?","h":"说需要一张手机卡","a":"Hi, I need a SIM card for my phone."},{"o":"Are you looking for a monthly plan or prepaid?","h":"问预付费套餐","a":"Do you have any prepaid plans?"},{"o":"Yes, this one is thirty dollars a month.","h":"问包含多少流量","a":"How much data does it include?"},{"o":"Fifteen gigs, and unlimited calls.","h":"问能否打国际电话","a":"Can I call China with it?"},{"o":"You can add international calls for five dollars.","h":"说就要这个","a":"OK, I'll take this one."}]},"c":"美国手机套餐分 prepaid（预付费，按月充值，不用签合同）和 postpaid（合约套餐，常要信用记录）。刚到美国一般先办预付费，最省事。","n":[[1,"prepaid 预付费，不需要信用记录，留学生最常用。",[["Do you have any plans without a contract?","有不用签合同的套餐吗？"],["What's your cheapest plan?","你们最便宜的套餐是哪个？"]]],[5,"Can I keep my phone? 问的是自己的手机能不能直接插卡用。手机没锁网叫 unlocked。",[["Will my phone work with your network?","我的手机能用你们的网络吗？"],["My phone is unlocked.","我的手机没有锁网。"]]]]},{"t":"Viewing an apartment","zh":"租房看房","k":"life","s":[["I'm calling about the apartment for rent.","我打电话是想问出租的公寓。"],["Is it still available?","还在出租吗？"],["How much is the rent?","房租多少？"],["Are utilities included?","包含水电费吗？"],["How long is the lease?","租期多长？"],["Is there a washing machine?","有洗衣机吗？"],["When can I move in?","我什么时候能搬进来？"]],"d":{"intro":"你去看一间出租公寓，房东带你参观。","turns":[{"o":"Hi, you must be Yang. Come on in.","h":"打招呼，问房租多少","a":"Hi, nice to meet you. How much is the rent?"},{"o":"It's twelve hundred a month.","h":"问包不包水电","a":"Are utilities included?"},{"o":"Water is included, but not electricity.","h":"问租期多长","a":"I see. How long is the lease?"},{"o":"Twelve months, but six is possible.","h":"问有没有洗衣机","a":"Is there a washing machine?"},{"o":"Yes, in the basement.","h":"问什么时候能搬进来","a":"Great. When can I move in?"}]},"c":"美国租房常见词：lease 租约，deposit 押金（常为一个月房租），utilities 水电燃气，studio 开间。签约前问清哪些费用含在房租里。","n":[[0,"打电话开场直接说目的：I'm calling about + 事情。各种电话都能用。",[["I saw your ad for the apartment.","我看到了你们的租房广告。"],["I'm interested in the apartment on Oak Street.","我对 Oak Street 那套房子感兴趣。"]]],[3,"utilities 指水、电、燃气等费用。问包不包含在房租里非常重要。",[["Does the rent include utilities?","房租包含水电吗？"],["Which utilities do I pay?","哪些水电费要我自己付？"]]]]},{"t":"Living with a roommate","zh":"和室友沟通","k":"life","s":[["Do you mind if I use the kitchen now?","我现在用厨房你介意吗？"],["Could you keep it down a bit? I have an exam tomorrow.","能小声一点吗？我明天有考试。"],["Let's split the bills evenly.","我们平摊账单吧。"],["Whose turn is it to take out the trash?","这次轮到谁倒垃圾？"],["I'll clean the bathroom this week.","这周我来打扫卫生间。"],["Is it OK if a friend stays over?","朋友来住一晚可以吗？"],["Thanks for understanding.","谢谢理解。"]],"d":{"intro":"晚上 11 点，室友在客厅放音乐，你明天有考试。","turns":[{"o":"Hey Yang! Want to watch a movie with us?","h":"谢谢但说明天有考试","a":"Thanks, but I have an exam tomorrow."},{"o":"Oh, good luck!","h":"礼貌请他们小声一点","a":"Thanks. Could you keep it down a bit, please?"},{"o":"Sure, sorry about that.","h":"说没关系，谢谢理解","a":"No problem. Thanks for understanding."},{"o":"By the way, the electricity bill came today.","h":"提议平摊","a":"Let's split it evenly, OK?"},{"o":"Sounds fair.","h":"说这周你来打扫卫生间","a":"And I'll clean the bathroom this week."}]},"c":"美国人很重视个人空间和事先沟通。用别人的东西、带朋友回来过夜，都要先问。有矛盾直接、礼貌地说出来，比憋着更好。","n":[[0,"Do you mind if I ...? 是“我……你介意吗？”。注意回答：No, go ahead 才是“不介意，用吧”，答 Yes 是“介意”。",[["Is it OK if I use the kitchen?","我用一下厨房可以吗？"],["Mind if I use the kitchen?","介意我用一下厨房吗？"]]],[1,"keep it down 是“小声点”。前面加 Could you，后面说原因，就不会显得冲。",[["Could you turn the music down a little?","能把音乐关小一点吗？"],["Sorry, it's a little loud.","不好意思，有点吵。"]]]]},{"t":"Reporting a problem","zh":"报修","k":"life","s":[["The heater in my room isn't working.","我房间的暖气坏了。"],["The sink is leaking.","水槽漏水。"],["There's no hot water.","没有热水。"],["It started yesterday evening.","从昨天晚上开始的。"],["Could someone come and take a look?","能派人来看看吗？"],["When would be a good time?","什么时间方便？"],["I'll be home after six.","我六点以后在家。"]],"d":{"intro":"你打电话给公寓管理处报修。","turns":[{"o":"Maintenance office, how can I help?","h":"说你房间暖气坏了","a":"Hi, the heater in my room isn't working."},{"o":"I'm sorry to hear that. Which apartment?","h":"说 3B 号","a":"Apartment 3B."},{"o":"When did it stop working?","h":"说从昨晚开始","a":"It started yesterday evening."},{"o":"We can send someone tomorrow.","h":"问什么时间","a":"Thank you. What time would that be?"},{"o":"Between ten and two. Is that OK?","h":"说你两点后才在家，问能否晚点","a":"I'm not home until two. Could they come after that?"}]},"c":"租房设施坏了找 landlord（房东）或 property manager（物业）。美国维修常要约时间，最好写邮件或短信留个记录。","n":[[0,"报修句型：东西 + isn't working、is broken 或 is leaking。先说什么坏了，再说什么时候开始的。",[["The heater is broken.","暖气坏了。"],["My heater stopped working.","我的暖气不工作了。"]]],[4,"take a look 是看一看、检查一下，比 check 更口语。",[["Could you send someone to fix it?","能派人来修吗？"],["Can someone come by today?","今天能有人过来吗？"]]]]},{"t":"Making a doctor's appointment","zh":"电话预约看病","k":"life","s":[["I'd like to make an appointment.","我想预约。"],["I've had a sore throat for three days.","我嗓子疼三天了。"],["Is there anything available this week?","这周有空位吗？"],["Do you take student insurance?","你们接受学生保险吗？"],["Could you spell the doctor's name?","能拼一下医生的名字吗？"],["What should I bring?","我要带什么？"],["See you on Thursday.","周四见。"]],"d":{"intro":"你打电话给诊所预约。","turns":[{"o":"Good morning, Green Street Clinic.","h":"说想预约","a":"Hi, I'd like to make an appointment, please."},{"o":"What's the problem?","h":"说嗓子疼了三天","a":"I've had a sore throat for three days."},{"o":"We have an opening on Thursday at ten.","h":"说可以，问是否接受学生保险","a":"That works. Do you take student insurance?"},{"o":"Yes, we do. Can I have your name?","h":"说名字并拼出来","a":"Yang Chao. Y-A-N-G, C-H-A-O."},{"o":"Great. Please bring your insurance card.","h":"道谢，周四见","a":"OK, thank you. See you on Thursday."}]},"c":"美国看病基本都要预约（appointment），不能直接去医院排队。不严重但要当天看的去 urgent care，危急情况才去 ER 急诊室。","n":[[1,"I've had ... for + 时间，说某症状持续了多久。医生一定会问 How long have you had it?",[["My throat has been sore since Monday.","我从周一开始喉咙疼。"],["I've had a cough for a week.","我咳嗽一周了。"]]],[2,"Is there anything available ...? 问有没有空档，预约、订位都能用。",[["What's the earliest appointment?","最早能约到什么时候？"],["Do you have anything tomorrow?","明天有空位吗？"]]]]},{"t":"At the doctor's","zh":"看医生","k":"life","s":[["I don't feel well.","我感觉不舒服。"],["I have a headache and a fever.","我头疼还发烧。"],["It hurts when I swallow.","咽东西的时候疼。"],["I'm not allergic to anything.","我没有过敏。"],["How often should I take this?","这个多久吃一次？"],["Do I need to come back?","我需要复诊吗？"],["Could you write that down for me?","您能帮我写下来吗？"]],"d":{"intro":"你在诊室里，医生问你情况。","turns":[{"o":"So, what brings you in today?","h":"说嗓子疼，还有点发烧","a":"I have a sore throat and a slight fever."},{"o":"How long have you had it?","h":"说三天","a":"About three days."},{"o":"Any allergies to medication?","h":"说没有过敏","a":"No, I'm not allergic to anything."},{"o":"I'll prescribe some antibiotics.","h":"问多久吃一次","a":"How often should I take them?"},{"o":"Twice a day for seven days.","h":"请医生写下来","a":"Could you write that down for me, please?"}]},"c":"美国医生会问很多问题：症状、持续多久、过敏史、在吃什么药。听不懂医学词一定要问，也可以请对方写下来。","n":[[0,"I don't feel well 是“我不舒服”的万能说法，先说这句，再说具体症状。",[["I'm not feeling well.","我感觉不太舒服。"],["I feel sick.","我觉得难受，想吐。"]]],[2,"It hurts when I + 动作，说做什么时疼，是描述疼痛最好用的句型。",[["My throat hurts.","我喉咙疼。"],["It hurts right here.","就这里疼。"]]]]},{"t":"At the pharmacy","zh":"药店","k":"life","s":[["I'm here to pick up a prescription.","我来取处方药。"],["Do you have something for a cold?","有治感冒的药吗？"],["Does this make you sleepy?","这个吃了会犯困吗？"],["Should I take it with food?","要饭后吃吗？"],["How many should I take?","要吃几片？"],["Are there any side effects?","有副作用吗？"],["Do you have a smaller size?","有小包装吗？"]],"d":{"intro":"你去药店买感冒药。","turns":[{"o":"Hi, what can I help you with?","h":"问有没有治感冒的药","a":"Hi, do you have something for a cold?"},{"o":"This one works well for a runny nose and cough.","h":"问会不会犯困","a":"Does it make you sleepy?"},{"o":"The night version does, the day version doesn't.","h":"说要白天那种，问要不要饭后吃","a":"I'll take the day version. Should I take it with food?"},{"o":"It's better with food.","h":"问一次吃几片","a":"How many should I take?"},{"o":"Two tablets every six hours.","h":"道谢","a":"Got it. Thank you."}]},"c":"美国处方药在药店的 pharmacy 柜台取，要等一会儿；感冒药这类非处方药（over-the-counter）直接在货架上拿。不确定就问药剂师（pharmacist），是免费的。","n":[[1,"Do you have something for + 症状？问有没有治某症状的药，最实用。",[["What do you recommend for a cough?","咳嗽你推荐吃什么？"],["I need something for a headache.","我需要治头疼的药。"]]],[2,"这里的 you 指“人”，不是特指对方。drowsy 是犯困，药品说明上常见。",[["Will this make me drowsy?","这个吃了会犯困吗？"],["Can I drive after taking this?","吃了这个还能开车吗？"]]]]},{"t":"Making and declining plans","zh":"邀请与拒绝","k":"life","s":[["Are you free on Saturday?","你周六有空吗？"],["Do you want to grab dinner sometime?","要不要找时间一起吃饭？"],["That sounds great. What time?","听起来不错，几点？"],["I'd love to, but I'm busy that day.","我很想去，但那天有事。"],["How about next week instead?","改成下周怎么样？"],["Let me check my schedule.","我看一下安排。"],["Let me know if anything changes.","有变化告诉我。"]],"d":{"intro":"同学 Sarah 约你出去。","turns":[{"o":"Hey Yang, are you free on Saturday? A few of us are going for dinner.","h":"说很想去但那天有事","a":"I'd love to, but I'm busy on Saturday."},{"o":"Oh, that's too bad.","h":"提议改到下周","a":"How about next week instead?"},{"o":"Sure! How about next Friday?","h":"说让我看一下安排","a":"Let me check my schedule... Friday works."},{"o":"Great. Seven o'clock at the Thai place?","h":"说没问题，有变化告诉你","a":"Sounds good. Let me know if anything changes."}]},"c":"美国人说 We should hang out sometime 常常只是客气话，真想约要给具体时间。拒绝时先表示感谢或遗憾，再给理由，最好提一个替代时间。","n":[[1,"grab dinner 是一起随便吃个饭。grab 让语气很轻松，grab coffee、grab lunch 都常用。",[["Want to get lunch sometime?","有空一起吃午饭吗？"],["Let's grab coffee this week.","这周一起喝个咖啡吧。"]]],[3,"I'd love to, but ... 是最礼貌的拒绝开头：先表示很想去，再说原因。",[["I wish I could, but I have class.","我也想去，但我有课。"],["Sorry, I already have plans.","抱歉，我已经有安排了。"]]]]},{"t":"Returning an item","zh":"退换货","k":"life","s":[["I'd like to return this.","我想退这个。"],["It doesn't fit.","尺寸不合适。"],["It was broken when I opened it.","打开时就是坏的。"],["Here's my receipt.","这是我的小票。"],["Can I exchange it for a bigger size?","能换大一号吗？"],["Can I get a refund instead?","能退款吗？"],["How long does the refund take?","退款要多久？"]],"d":{"intro":"你买的电水壶是坏的，拿回店里。","turns":[{"o":"Hi, how can I help you?","h":"说想退货","a":"Hi, I'd like to return this kettle."},{"o":"What's wrong with it?","h":"说打开时就是坏的","a":"It was broken when I opened it."},{"o":"I'm sorry. Do you have the receipt?","h":"递上小票","a":"Yes, here's my receipt."},{"o":"Would you like an exchange or a refund?","h":"说要退款","a":"I'd like a refund, please."},{"o":"No problem. It goes back to your card.","h":"问要多久","a":"How long does that take?"}]},"c":"美国退货很方便，大多数商店 30 天内凭小票可以无理由退货。退款一般原路退回，到账要几天。","n":[[0,"商店的退货柜台叫 Returns 或 Customer Service。",[["Can I return this?","这个能退吗？"],["I need to return this.","我要退这个。"]]],[1,"It doesn't fit 是尺码不合适，太大或太小都用它。fit 说的是尺寸，不是款式。",[["It's too small.","太小了。"],["It's a little too big.","有点大了。"]]]]},{"t":"Talking with neighbors","zh":"和邻居相处","k":"life","s":[["Hi, I just moved in next door.","你好，我刚搬到隔壁。"],["How long have you lived here?","你在这里住多久了？"],["Is there a good place to eat nearby?","附近有好吃的地方吗？"],["Do you know when the trash is collected?","你知道什么时候收垃圾吗？"],["A package for you came to my door.","你的包裹送到我门口了。"],["Let me know if you need anything.","需要什么跟我说。"],["It's nice to have you as a neighbor.","很高兴有你这样的邻居。"]],"d":{"intro":"你刚搬家，在门口遇到邻居 Linda。","turns":[{"o":"Hi! Are you new here?","h":"说刚搬到隔壁","a":"Hi, yes, I just moved in next door. I'm Yang."},{"o":"Welcome! I'm Linda.","h":"问她在这里住多久了","a":"Nice to meet you, Linda. How long have you lived here?"},{"o":"Almost five years. It's a quiet street.","h":"问附近有没有好吃的","a":"That's great. Is there a good place to eat nearby?"},{"o":"The noodle place on the corner is great.","h":"再问什么时候收垃圾","a":"Thanks! Do you know when the trash is collected?"},{"o":"Tuesday mornings. Let me know if you need anything.","h":"道谢","a":"Thank you. It's nice to have you as a neighbor."}]},"c":"刚搬家可以主动和邻居打个招呼，简单介绍自己。美国邻居之间常互相帮忙收快递、照看房子。","n":[[0,"I just moved in 是“我刚搬来”，next door 是隔壁。",[["I'm your new neighbor.","我是你的新邻居。"],["I live in 3B, just down the hall.","我住 3B，就在走廊那头。"]]],[5,"Let me know if you need anything 是很常用的客气话，对方也常对你说。",[["If you ever need anything, just knock.","需要什么就来敲门。"],["Feel free to ask me anytime.","随时找我。"]]]]},{"t":"Emergencies","zh":"求助与紧急情况","k":"life","s":[["Help! Please call an ambulance.","救命！请叫救护车。"],["Someone fell down and isn't moving.","有人摔倒了，一动不动。"],["I lost my wallet.","我的钱包丢了。"],["I want to report a theft.","我要报案，东西被偷了。"],["I'm at the corner of Main Street and Fifth.","我在主街和第五街的路口。"],["Is there anyone here who speaks Chinese?","这里有人会说中文吗？"],["Where is the nearest hospital?","最近的医院在哪儿？"]],"d":{"intro":"你看到街上有人摔倒，你拨打了急救电话。","turns":[{"o":"Nine-one-one, what's your emergency?","h":"说有人摔倒了，一动不动","a":"Someone fell down and isn't moving."},{"o":"Where are you?","h":"说在主街和第五街路口","a":"I'm at the corner of Main Street and Fifth."},{"o":"Is the person breathing?","h":"说是的，在呼吸","a":"Yes, I think he's breathing."},{"o":"OK, an ambulance is on the way. Stay with him.","h":"说好的，你会等着","a":"OK, I'll stay here."},{"o":"Can I have your name and number?","h":"说名字和电话","a":"My name is Yang Chao. My number is five-five-five, one-two-three-four."}]},"c":"美国急救、报警、火警都打 911。电话里先说地点，再说发生了什么。可以说 I need a Chinese interpreter，很多地方能提供电话翻译。","n":[[0,"紧急情况下句子越短越好，先喊出来再说别的。",[["Call 911!","打 911！"],["Somebody help!","来人帮帮忙！"]]],[5,"实在说不清的时候，直接要翻译。这是你的权利，不用不好意思。",[["I need a Chinese interpreter.","我需要中文翻译。"],["Can I get an interpreter?","能给我找个翻译吗？"]]]]},{"t":"Getting a haircut","zh":"理发","k":"life","s":[["I'd like a haircut, please.","我想剪头发。"],["Just a trim, please.","稍微修一下就好。"],["Not too short on the sides.","两边别剪太短。"],["Could you take a little more off the top?","上面能再剪短一点吗？"],["No, that's fine, thanks.","不用了，这样就好，谢谢。"],["How much do I owe you?","我该付多少钱？"],["It looks great. Thank you!","看起来很好，谢谢！"]],"d":{"intro":"你走进一家理发店。","turns":[{"o":"Hi there! What can I do for you today?","h":"说想剪头发","a":"Hi, I'd like a haircut, please."},{"o":"Sure. How would you like it?","h":"说稍微修一下，两边别太短","a":"Just a trim. Not too short on the sides, please."},{"o":"(Later) How does that look?","h":"请他上面再剪短一点","a":"Could you take a little more off the top?"},{"o":"No problem. How about now?","h":"说很好，谢谢","a":"It looks great. Thank you!"},{"o":"You're welcome. That'll be twenty-five dollars.","h":"问能不能刷卡","a":"Can I pay by card?"}]},"c":"美国理发要提前预约，剪完给理发师 15%–20% 小费。可以带照片给理发师看，比用嘴描述准确得多。","n":[[1,"a trim 是稍微修一下，不改发型，理发最实用的一个词。",[["Just clean it up a little.","稍微修整一下就行。"],["Not too much off, please.","别剪太多。"]]],[5,"How much do I owe you? 是“我该付你多少钱？”，理发、修东西这类服务结束时常用。",[["What do I owe you?","多少钱？"],["How much is it?","多少钱？"]]]]},{"t":"Ordering takeout by phone","zh":"电话点外卖","k":"life","s":[["I'd like to place an order for pickup.","我想点一份自取的外卖。"],["Can I get one kung pao chicken?","我要一份宫保鸡丁。"],["Can you make it less spicy?","能少放点辣吗？"],["How long will it take?","要等多久？"],["The name is Yang.","名字是 Yang。"],["Do you deliver?","你们送餐吗？"],["My address is 25 Oak Street.","我的地址是橡树街 25 号。"]],"d":{"intro":"你打电话给一家中餐馆点外卖。","turns":[{"o":"Golden Dragon, how can I help you?","h":"说想点外卖自取","a":"Hi, I'd like to place an order for pickup."},{"o":"Sure. What would you like?","h":"点一份宫保鸡丁，少辣","a":"Can I get one kung pao chicken, less spicy?"},{"o":"Anything else?","h":"再要一份炒饭","a":"And one fried rice, please."},{"o":"OK. Can I have a name for the order?","h":"说名字是 Yang","a":"The name is Yang."},{"o":"Great. It'll be ready in twenty minutes.","h":"道谢","a":"Perfect, thank you."}]},"c":"美国中餐馆的菜名和国内不一样，比如 General Tso's chicken（左宗棠鸡）。pickup 是自取，delivery 是送餐，送餐要给送餐员小费。","n":[[0,"place an order 是下单。for pickup 自取，for delivery 外送。",[["I'd like to order takeout.","我想点外卖。"],["Can I order for pickup?","我能点餐自取吗？"]]],[2,"make it + 形容词，是改要求的万能句型。",[["Not too spicy, please.","别太辣。"],["Can you make it extra spicy?","能做得特别辣吗？"]]]]},{"t":"Sending a package","zh":"邮局寄包裹","k":"life","s":[["I'd like to send this package to China.","我想把这个包裹寄到中国。"],["How long will it take to get there?","寄到那里要多久？"],["What's the cheapest way to send it?","最便宜的寄法是什么？"],["Can I get a tracking number?","能给我一个追踪号吗？"],["It's just clothes and books.","里面只是衣服和书。"],["Do I need to fill out a form?","我需要填表吗？"],["I'd like to buy some stamps.","我想买些邮票。"]],"d":{"intro":"你在邮局柜台寄东西回国。","turns":[{"o":"Next, please. How can I help?","h":"说想把包裹寄到中国","a":"Hi, I'd like to send this package to China."},{"o":"Sure. What's inside?","h":"说只有衣服和书","a":"Just clothes and books."},{"o":"OK. Express or standard?","h":"问哪种最便宜、要多久","a":"Which one is cheaper, and how long does it take?"},{"o":"Standard is forty dollars and takes about two weeks.","h":"选标准的，并要追踪号","a":"Standard is fine. Can I get a tracking number?"},{"o":"Of course. Please fill out this form.","h":"说好的","a":"Sure, no problem."}]},"c":"美国邮局叫 USPS。寄国际包裹要填海关申报单（customs form），写清楚里面是什么、值多少钱。","n":[[2,"What's the cheapest way ...? 问最便宜的方式，寄东西、出行都能用。",[["What's the fastest way to send it?","最快的寄法是哪种？"],["How much would that be?","那要多少钱？"]]],[3,"tracking number 是快递单号、追踪号。",[["Can I track it online?","能在网上查物流吗？"],["Does it come with tracking?","有物流追踪吗？"]]]]},{"t":"Losing something","zh":"丢了东西","k":"life","s":[["I think I lost my phone.","我好像把手机丢了。"],["I left my bag on the bus.","我把包落在公交车上了。"],["Has anyone turned in a black wallet?","有人交来一个黑色钱包吗？"],["It has my ID in it.","里面有我的证件。"],["When did you last see it?","你最后一次看到它是什么时候？"],["Is there a lost and found here?","这里有失物招领处吗？"],["Here's my number in case you find it.","这是我的电话，找到了请联系我。"]],"d":{"intro":"你把钱包落在了咖啡店，回去问店员。","turns":[{"o":"Hi, can I help you?","h":"说你好像把钱包落在这了","a":"Hi, I think I left my wallet here."},{"o":"Oh no. What does it look like?","h":"说是黑色的，里面有证件","a":"It's black, and it has my ID in it."},{"o":"When were you here?","h":"说大约一小时前","a":"About an hour ago."},{"o":"Let me check the lost and found… Sorry, nothing yet.","h":"留下电话，请找到联系你","a":"Here's my number in case someone finds it."},{"o":"Sure, we'll call you.","h":"道谢","a":"Thank you so much."}]},"c":"美国公交、机场、商场都有 lost and found（失物招领）。手机丢了，先用别的设备定位，再去失物招领问。","n":[[0,"用 I think 让语气不那么确定，实际很常用。",[["I can't find my phone.","我找不到我的手机了。"],["I must have left my phone somewhere.","我一定是把手机落在哪儿了。"]]],[2,"turn in 是上交捡到的东西。Has anyone turned in ...? 问有没有人交上来。",[["Did anyone find a black wallet?","有没有人捡到一个黑色钱包？"],["I'm looking for a black wallet.","我在找一个黑色钱包。"]]]]},{"t":"Buying a laptop","zh":"买电子产品","k":"life","s":[["I'm looking for a laptop for school.","我在找一台上学用的笔记本电脑。"],["What's the difference between these two?","这两台有什么区别？"],["How long does the battery last?","电池能用多久？"],["Does it come with a warranty?","有保修吗？"],["Is this the best price?","这是最低价了吗？"],["Do you offer a student discount?","有学生折扣吗？"],["I'll think about it and come back.","我考虑一下再来。"]],"d":{"intro":"你在电器店看笔记本电脑。","turns":[{"o":"Hi, are you looking for anything special?","h":"说想买上学用的笔记本","a":"Yes, I'm looking for a laptop for school."},{"o":"These two are very popular.","h":"问两台有什么区别","a":"What's the difference between them?"},{"o":"This one is lighter, and the battery lasts longer.","h":"问有没有学生折扣","a":"Do you offer a student discount?"},{"o":"Yes, ten percent off with a student ID.","h":"问有没有保修","a":"Great. Does it come with a warranty?"},{"o":"One year, standard.","h":"说考虑一下再来","a":"OK, I'll think about it and come back."}]},"c":"美国买电子产品可以问 student discount（学生优惠）。买前问清 return policy（退货政策），很多店 14 到 30 天内可退。","n":[[1,"What's the difference between A and B? 是比较两样东西最常用的问法。",[["Which one would you recommend?","你推荐哪一个？"],["Why is this one more expensive?","为什么这个更贵？"]]],[6,"I'll think about it 是礼貌地离开、不买的说法，店员不会介意。",[["I'm just looking, thanks.","我只是看看，谢谢。"],["Let me think about it.","我考虑考虑。"]]]]},{"t":"At the gym","zh":"健身房","k":"life","s":[["I'd like to sign up for a membership.","我想办会员卡。"],["How much is it per month?","每月多少钱？"],["Is there a student rate?","有学生价吗？"],["Can I try it for a day first?","可以先试一天吗？"],["What time do you open?","你们几点开门？"],["Are you using this machine?","这台机器你在用吗？"],["Mind if I work in with you?","我能和你轮流用吗？"]],"d":{"intro":"你去附近的健身房咨询。","turns":[{"o":"Welcome! How can I help you?","h":"说想办会员","a":"Hi, I'd like to sign up for a membership."},{"o":"Great. It's forty dollars a month.","h":"问有没有学生价","a":"Is there a student rate?"},{"o":"Yes, thirty dollars with a student ID.","h":"问能不能先试一天","a":"Can I try it for a day first?"},{"o":"Sure, here's a free day pass.","h":"问几点开门","a":"Thanks. What time do you open?"},{"o":"Six a.m. to eleven p.m. every day.","h":"道谢","a":"Perfect. Thank you."}]},"c":"美国健身房礼仪：用完器械要擦干净（wipe down）；器械上放着毛巾或水杯表示有人在用。想一起用要先问。","n":[[5,"问器械有没有人用。对方没在用会说 No, go ahead。",[["Is anyone using this?","这个有人在用吗？"],["Are you done with this?","你用完了吗？"]]],[6,"work in 是趁对方组间休息时轮流用同一台器械，健身房专用说法。",[["Can I jump in between your sets?","你组间休息时我能用一下吗？"],["How many sets do you have left?","你还剩几组？"]]]]},{"t":"At the library","zh":"图书馆","k":"life","s":[["I'd like to get a library card.","我想办一张借书证。"],["How many books can I borrow?","我能借几本书？"],["When are these due?","这些什么时候到期？"],["Can I renew them online?","可以网上续借吗？"],["Where can I find books on physics?","物理类的书在哪里？"],["Is there a quiet place to study?","有安静的学习区吗？"],["Can I print here?","这里可以打印吗？"]],"d":{"intro":"你第一次去学校图书馆。","turns":[{"o":"Hi, can I help you?","h":"说想办借书证","a":"Hi, I'd like to get a library card."},{"o":"Sure, I just need your student ID.","h":"递上学生证，问能借几本","a":"Here you go. How many books can I borrow?"},{"o":"Up to ten books for three weeks.","h":"问能不能网上续借","a":"Can I renew them online?"},{"o":"Yes, through our website.","h":"问有没有安静的学习区","a":"Great. Is there a quiet place to study?"},{"o":"The third floor is a quiet zone.","h":"道谢","a":"Thanks a lot."}]},"c":"美国大学图书馆可以预约 study room（自习室）。打印一般用学生卡付费，很多书可以在网上续借。","n":[[2,"due 是到期。还书日期、作业截止都用 due。",[["When do I need to return these?","这些我什么时候要还？"],["What's the due date?","到期日是哪天？"]]],[4,"books on + 主题，是关于某主题的书。",[["Where's the physics section?","物理类的书在哪儿？"],["Do you have this book?","你们有这本书吗？"]]]]},{"t":"Chatting at a party","zh":"派对上聊天","k":"life","s":[["How do you know the host?","你是怎么认识主人的？"],["I'm a friend of Sarah's from school.","我是 Sarah 的同学。"],["This place is really nice.","这个地方真不错。"],["Have you tried the food? It's great.","你尝过吃的了吗？很好吃。"],["What brings you here?","你怎么来这里了？"],["It was great talking to you.","和你聊天很开心。"],["I'm going to grab a drink. Want anything?","我去拿杯喝的，你要什么吗？"]],"d":{"intro":"在朋友的派对上，一个陌生人跟你搭话。","turns":[{"o":"Hi, I don't think we've met. I'm Jake.","h":"自我介绍","a":"Hi Jake, I'm Yang. Nice to meet you."},{"o":"So how do you know Sarah?","h":"说你是她的同学","a":"I'm a friend of hers from school."},{"o":"Oh, cool. What do you study?","h":"说你学物理","a":"I study physics."},{"o":"Wow, smart guy! Are you enjoying the party?","h":"说很开心，吃的很好","a":"Yeah, it's great. The food is really good."},{"o":"I'm going to grab a drink. Want anything?","h":"请他帮你拿一杯水","a":"Sure, could you get me some water? Thanks."}]},"c":"美国派对上大家会主动和不认识的人聊天。最自然的开场问题是怎么认识主人的。想换人聊，说一句 It was great talking to you 然后走开，很正常。","n":[[0,"派对上最安全的开场白，几乎所有人都能接上话。",[["So how do you know Sarah?","你是怎么认识 Sarah 的？"],["Are you a friend of Sarah's?","你是 Sarah 的朋友吗？"]]],[6,"去拿喝的、拿吃的，也是礼貌结束一段对话的好借口。",[["I'm going to get some food. I'll catch you later.","我去拿点吃的，待会儿聊。"],["Excuse me, I'm going to say hi to a friend.","失陪一下，我去跟朋友打个招呼。"]]]]},{"t":"Talking about hobbies","zh":"聊爱好","k":"life","s":[["What do you do in your free time?","你空闲时做什么？"],["I'm really into hiking.","我特别喜欢徒步。"],["I've been learning to cook lately.","我最近在学做饭。"],["I play basketball twice a week.","我一周打两次篮球。"],["How did you get into that?","你是怎么喜欢上这个的？"],["I'm not very good at it, but it's fun.","我不太擅长，但很好玩。"],["We should go together sometime.","我们哪天一起去吧。"]],"d":{"intro":"你和新认识的朋友 Mia 聊天。","turns":[{"o":"So what do you do in your free time?","h":"说你喜欢徒步","a":"I'm really into hiking."},{"o":"Oh nice! Where do you usually go?","h":"说常去学校附近的山","a":"Usually the mountains near my school."},{"o":"I love hiking too. How did you get into it?","h":"说朋友带你去的","a":"A friend took me once, and I loved it."},{"o":"Do you do anything else?","h":"说你最近在学做饭，但不太擅长","a":"I've been learning to cook lately. I'm not very good, but it's fun."},{"o":"Ha! We should go hiking together sometime.","h":"同意，交换联系方式","a":"Definitely. Let me get your number."}]},"c":"美国人聊爱好很常见。对方问 What do you do for fun? 时，期待你说具体的事，并且回问一句。","n":[[1,"I'm really into ... 是“我特别喜欢……”，比 I like 更口语、更有热情。",[["I love hiking.","我很喜欢徒步。"],["I've gotten into photography.","我最近迷上了摄影。"]]],[4,"问对方怎么开始的，表示你真的感兴趣，聊天就能继续下去。",[["How long have you been doing that?","你做这个多久了？"],["What got you into it?","你是怎么入坑的？"]]]]},{"t":"Visiting a friend's home","zh":"去朋友家做客","k":"life","s":[["Thanks for having me.","谢谢你请我来。"],["I brought you a little something.","我给你带了点小东西。"],["Should I take off my shoes?","需要脱鞋吗？"],["Your place is so nice.","你家真漂亮。"],["Can I help with anything?","有什么我能帮忙的吗？"],["This is delicious. Did you make it yourself?","太好吃了，是你自己做的吗？"],["I should get going. Thanks for everything.","我该走了，谢谢你的款待。"]],"d":{"intro":"你去朋友 Tom 家吃晚饭。","turns":[{"o":"Hey, come on in!","h":"感谢他邀请，并递上小礼物","a":"Thanks for having me. I brought you a little something."},{"o":"Oh, you didn't have to! Thank you.","h":"问要不要脱鞋","a":"Should I take off my shoes?"},{"o":"No, you're fine. Make yourself at home.","h":"夸他家漂亮，问要不要帮忙","a":"Your place is so nice. Can I help with anything?"},{"o":"(Later) How's the pasta?","h":"说很好吃，问是不是他做的","a":"It's delicious. Did you make it yourself?"},{"o":"Yep! Want some more?","h":"说吃饱了，你该走了，谢谢款待","a":"I'm full, thanks. I should get going. Thanks for everything."}]},"c":"去美国朋友家做客，常带一瓶酒、甜点或花。很多美国家庭进门不脱鞋，不确定就问。走之前要再次感谢。","n":[[0,"Thanks for having me 是“谢谢你招待我”，进门和离开时都能说。",[["Thanks for inviting me.","谢谢你邀请我。"],["I'm so glad I could come.","很高兴能来。"]]],[6,"I should get going 是“我该走了”，比 I must go 自然。",[["I should head out.","我该走了。"],["It's getting late. I'd better go.","不早了，我得走了。"]]]]},{"t":"Taking a taxi","zh":"打车","k":"life","s":[["Could you take me to the airport?","能送我去机场吗？"],["How long will it take?","要多久？"],["Can you take the fastest route?","能走最快的路线吗？"],["Could you turn on the air conditioning?","能开一下空调吗？"],["You can drop me off at the corner.","在路口放我下来就行。"],["Can I get a receipt?","能给我一张收据吗？"],["Keep the change.","不用找了。"]],"d":{"intro":"你上了一辆出租车。","turns":[{"o":"Where to?","h":"说去机场","a":"Could you take me to the airport, please?"},{"o":"Sure. Which terminal?","h":"说二号航站楼，问要多久","a":"Terminal two. How long will it take?"},{"o":"About thirty minutes with this traffic.","h":"请他走最快的路线","a":"Can you take the fastest route? I'm in a bit of a hurry."},{"o":"(Later) Here we are. That's forty-five dollars.","h":"给五十，不用找了","a":"Here's fifty. Keep the change."},{"o":"Thanks! Have a good flight.","h":"请他给收据","a":"Thank you. Could I get a receipt?"}]},"c":"美国现在大多用 Uber 或 Lyft 打车，在 App 里付款和给小费。坐出租车一般给 15%–20% 小费。","n":[[0,"上车告诉司机目的地，也可以直接说地址。",[["To the airport, please.","去机场，谢谢。"],["I'm going to 25 Oak Street.","我去 Oak Street 25 号。"]]],[4,"drop me off 是让我下车，pick me up 是来接我。",[["You can let me out here.","在这儿让我下车就行。"],["Right here is fine.","就这儿吧。"]]]]},{"t":"Checking in at the airport","zh":"机场值机","k":"life","s":[["I'd like to check in for my flight to Shanghai.","我要办理去上海的航班值机。"],["Can I have a window seat?","能给我靠窗的座位吗？"],["How many bags can I check?","我能托运几件行李？"],["Is my bag overweight?","我的行李超重了吗？"],["What time does boarding start?","几点开始登机？"],["Which gate is it?","在哪个登机口？"],["Is the flight on time?","航班准时吗？"]],"d":{"intro":"你在航空公司柜台办理值机。","turns":[{"o":"Good morning. Where are you flying today?","h":"说去上海","a":"Good morning. I'm flying to Shanghai."},{"o":"Passport, please. Any bags to check?","h":"递护照，说一件行李要托运","a":"Here's my passport. I have one bag to check."},{"o":"Window or aisle?","h":"要靠窗","a":"A window seat, please."},{"o":"Here's your boarding pass. Gate twenty-two.","h":"问几点开始登机","a":"Thanks. What time does boarding start?"},{"o":"At ten forty. The flight is on time.","h":"道谢","a":"Great, thank you."}]},"c":"美国国内航班托运行李常要额外收费，国际航班一般有免费额度。登机口可能临时更改，注意广播和屏幕。","n":[[3,"overweight 是超重。超重要付费，可以把东西挪到随身行李里。",[["How much is the fee for an overweight bag?","超重要付多少钱？"],["Can I move some things to my carry-on?","我能把一些东西挪到随身行李里吗？"]]],[6,"on time 准点，delayed 延误，canceled 取消，机场广播最常听到这三个词。",[["Is the flight delayed?","航班延误了吗？"],["Is my flight still on schedule?","我的航班还按时吗？"]]]]},{"t":"Booking a table","zh":"电话订餐位","k":"life","s":[["I'd like to book a table for four.","我想订一张四人桌。"],["For seven o'clock tonight.","今晚七点。"],["Do you have anything earlier?","有更早一点的吗？"],["Could we sit by the window?","我们能坐靠窗的位置吗？"],["The reservation is under Yang.","预订人名字是 Yang。"],["We might be a few minutes late.","我们可能会晚到几分钟。"],["Do you have vegetarian options?","有素食吗？"]],"d":{"intro":"你打电话给餐厅订位置。","turns":[{"o":"Thank you for calling Bella's. How can I help?","h":"说想订四人桌，今晚七点","a":"Hi, I'd like to book a table for four at seven tonight."},{"o":"I'm sorry, seven is full. How about eight?","h":"问有没有更早的","a":"Do you have anything earlier?"},{"o":"We have six thirty.","h":"说可以，问能不能靠窗","a":"Six thirty is fine. Could we sit by the window?"},{"o":"I'll do my best. Can I have a name?","h":"说名字 Yang","a":"The reservation is under Yang."},{"o":"Great, see you at six thirty.","h":"道谢道别","a":"Thank you. See you then."}]},"c":"美国热门餐厅要提前订位，很多用 OpenTable 这类 App 网上订。迟到超过 15 分钟位子可能就没了，要提前打电话说。","n":[[0,"book a table for + 人数，也可以说 make a reservation。",[["I'd like to make a reservation for four.","我想订四个人的位子。"],["Do you have a table for four tonight?","今晚有四人桌吗？"]]],[5,"提前说明可能晚到是礼貌的做法。",[["We're running a little late.","我们会晚一点到。"],["We'll be there in ten minutes.","我们十分钟后到。"]]]]},{"t":"Wrong order at a restaurant","zh":"上错菜","k":"life","s":[["Excuse me, I think this isn't what I ordered.","不好意思，这好像不是我点的。"],["I ordered the chicken, not the beef.","我点的是鸡肉，不是牛肉。"],["This is a bit cold.","这个有点凉了。"],["Could you warm it up, please?","能帮我热一下吗？"],["We've been waiting for a while.","我们已经等了一会儿了。"],["It's OK, these things happen.","没关系，这种事难免。"],["Could you check on our order?","能帮我们催一下菜吗？"]],"d":{"intro":"服务员给你上错了菜。","turns":[{"o":"Here's your beef noodle soup.","h":"礼貌地说这不是你点的","a":"Excuse me, I think this isn't what I ordered."},{"o":"Oh, what did you order?","h":"说你点的是鸡肉面","a":"I ordered the chicken noodle soup."},{"o":"I'm so sorry. I'll fix that right away.","h":"说没关系","a":"It's OK, these things happen."},{"o":"Is there anything else I can get you?","h":"请她顺便催一下朋友的菜","a":"Could you also check on my friend's order? We've been waiting a while."},{"o":"Of course. I'll be right back.","h":"道谢","a":"Thank you."}]},"c":"美国餐厅上错菜、菜凉了，直接礼貌地说出来很正常，服务员会马上处理，有时还会免单。","n":[[0,"用 Excuse me 和 I think，让抱怨听起来很客气。",[["Sorry, I don't think this is mine.","不好意思，这个好像不是我的。"],["I think there's been a mix-up.","好像弄混了。"]]],[4,"We've been waiting for a while 是委婉地催菜：只说事实，不指责。",[["Is our food almost ready?","我们的菜快好了吗？"],["Could you check how long it'll be?","能帮忙看看还要多久吗？"]]]]},{"t":"Doing laundry","zh":"洗衣房","k":"life","s":[["How does this machine work?","这台机器怎么用？"],["Do I need coins?","需要硬币吗？"],["Where do I put the detergent?","洗衣液放在哪里？"],["How long does a wash take?","洗一次要多久？"],["Is this dryer free?","这台烘干机空着吗？"],["Sorry, are these your clothes?","不好意思，这些是你的衣服吗？"],["I'll be back in half an hour.","我半小时后回来。"]],"d":{"intro":"你第一次用公寓的洗衣房，问旁边的邻居。","turns":[{"o":"Hi! First time here?","h":"说是的，问机器怎么用","a":"Yes. How does this machine work?"},{"o":"You just put your card in here and choose the setting.","h":"问洗衣液放哪里","a":"Where do I put the detergent?"},{"o":"In that little drawer on top.","h":"问洗一次要多久","a":"Got it. How long does a wash take?"},{"o":"About forty minutes.","h":"问那台烘干机是不是空着","a":"Thanks. Is that dryer free?"},{"o":"Yeah, go ahead.","h":"道谢","a":"Thanks for your help!"}]},"c":"美国很多公寓的洗衣房是公用的，投币或刷卡。衣服洗完放着不拿，别人等着用机器时会把衣服拿出来放在桌上，很正常。","n":[[0,"不会用任何机器都能这么问。",[["Could you show me how to use this?","能教我怎么用这个吗？"],["Which button do I press?","按哪个按钮？"]]],[4,"这里 free 是“空着、没人用”，不是“免费”。",[["Is anyone using this dryer?","这个烘干机有人用吗？"],["Is this one taken?","这个有人用吗？"]]]]},{"t":"Asking someone to take a photo","zh":"请人帮忙拍照","k":"life","s":[["Excuse me, could you take a picture of us?","不好意思，能帮我们拍张照吗？"],["Just press this button.","按这个按钮就行。"],["Could you get the mountain in the background?","能把后面的山拍进去吗？"],["One more, please.","请再拍一张。"],["Could you take a vertical one?","能拍一张竖的吗？"],["Do you want me to take one of you?","要我帮你们拍一张吗？"],["Thanks, they look great!","谢谢，拍得很好！"]],"d":{"intro":"你和朋友在景点，想请路人帮忙拍照。","turns":[{"o":"(A tourist walks by.)","h":"礼貌地请他帮你们拍照","a":"Excuse me, could you take a picture of us?"},{"o":"Sure! How does it work?","h":"说按这个按钮就行","a":"Just press this button."},{"o":"OK, ready? Three, two, one!","h":"请他把后面的山拍进去，再拍一张","a":"Could you get the mountain in the background? One more, please."},{"o":"Here you go. Take a look.","h":"说拍得很好，并问要不要帮他拍","a":"They look great, thanks! Do you want me to take one of you?"},{"o":"Oh, that would be great, thanks!","h":"说没问题","a":"Sure, no problem."}]},"c":"在美国景点请陌生人拍照很常见，一般都会帮忙。对方帮你拍完，主动问要不要帮他们拍一张，是礼貌。","n":[[0,"picture 和 photo 都行。Would you mind ...? 比 Could you 更客气。",[["Would you mind taking a photo of us?","你介意给我们拍张照吗？"],["Could you take one of us?","能帮我们拍一张吗？"]]],[4,"vertical 竖着拍，horizontal 横着拍。",[["Could you take a horizontal one too?","能再横着拍一张吗？"],["Could you get our whole bodies in?","能拍到全身吗？"]]]]},{"t":"Apologizing for being late","zh":"迟到道歉","k":"life","s":[["Sorry I'm late.","抱歉我迟到了。"],["The bus was really late.","公交车晚点很久。"],["I should have left earlier.","我应该早点出门的。"],["I hope you haven't been waiting long.","希望你没等太久。"],["It won't happen again.","下次不会了。"],["Let me buy you a coffee to make up for it.","我请你喝咖啡赔罪吧。"],["Thanks for waiting.","谢谢你等我。"]],"d":{"intro":"你和朋友约好见面，迟到了 20 分钟。","turns":[{"o":"There you are!","h":"道歉，说公交晚点","a":"Sorry I'm late. The bus was really late."},{"o":"It's OK. I just got here, too.","h":"说希望她没等太久","a":"I hope you haven't been waiting long."},{"o":"Only about ten minutes.","h":"说应该早点出门，要请她喝咖啡赔罪","a":"I should have left earlier. Let me buy you a coffee to make up for it."},{"o":"Ha, deal!","h":"谢谢她等你","a":"Thanks for waiting."}]},"c":"美国人很看重准时。会晚到要提前发消息说明，而不是到了再道歉。道歉简短真诚即可，不用反复解释。","n":[[2,"I should have + 过去分词，是“我本该……（但没有）”，表示后悔。口语里读成 should've。",[["I should've taken an earlier bus.","我应该坐早一班的车。"],["I should've called you.","我应该给你打个电话的。"]]],[3,"到达时的第一句。",[["Have you been waiting long?","你等很久了吗？"],["Sorry to keep you waiting.","抱歉让你久等了。"]]]]},{"t":"Talking about family","zh":"聊家人","k":"life","s":[["Do you have any brothers or sisters?","你有兄弟姐妹吗？"],["I have an older sister.","我有一个姐姐。"],["I'm an only child.","我是独生子。"],["My parents live in Fuzhou.","我父母住在福州。"],["We're very close.","我们关系很好。"],["I call them every weekend.","我每周末给他们打电话。"],["Do you miss your family?","你想家人吗？"]],"d":{"intro":"新朋友问起你的家人。","turns":[{"o":"Do you have any brothers or sisters?","h":"说你有一个姐姐（换成你的真实情况）","a":"Yes, I have an older sister."},{"o":"Nice. Where does your family live?","h":"说父母住在福州（换成你的真实情况）","a":"My parents live in Fuzhou."},{"o":"Do you miss them?","h":"说想，每周末打电话（换成你的真实情况）","a":"Yes, I do. I call them every weekend."},{"o":"That's sweet. Are you close with your sister?","h":"说关系很好（换成你的真实情况）","a":"Yeah, we're very close."}]},"c":"美国人聊家人很平常，但不会问得很细，比如收入、婚育计划。说兄弟姐妹要说清楚 older 还是 younger。","n":[[1,"哥哥姐姐是 older brother、older sister，弟弟妹妹是 younger。只说 sister 分不出大小。",[["I have a younger brother.","我有一个弟弟。"],["I have two older brothers.","我有两个哥哥。"]]],[4,"We're very close 是“我们关系很亲”。这里 close 读 /kloʊs/，和关门的 close 读音不同。",[["We get along really well.","我们相处得很好。"],["I'm close with my mom.","我和我妈很亲。"]]]]},{"t":"Introducing Chinese food","zh":"介绍中国菜","k":"life","s":[["Have you ever tried Chinese hot pot?","你吃过中国火锅吗？"],["You cook the food yourself at the table.","你在桌上自己煮食物。"],["It's a bit spicy, but you can choose a mild soup.","有点辣，但可以选不辣的锅底。"],["Fuzhou is famous for its fish balls.","福州的鱼丸很有名。"],["Dumplings are usually eaten during Spring Festival.","饺子通常在春节吃。"],["You should try it sometime.","你哪天应该试试。"],["I can take you to a good place.","我可以带你去一家好店。"]],"d":{"intro":"外国朋友对中国菜很好奇。","turns":[{"o":"I love Chinese food, but I only know fried rice.","h":"问他吃过火锅没有","a":"Have you ever tried Chinese hot pot?"},{"o":"No. What is it?","h":"解释：在桌上自己煮","a":"You cook the food yourself in a pot of soup at the table."},{"o":"Is it spicy?","h":"说有点辣，但可以选不辣的锅底","a":"It can be, but you can choose a mild soup."},{"o":"Sounds fun! Where can I try it?","h":"说你可以带他去一家好店","a":"I can take you to a good place this weekend."}]},"c":"外国人对中国菜很好奇，但大多只吃过美式中餐。介绍时说清楚怎么吃、是什么味道，比说菜名更有用。","n":[[1,"介绍怎么吃，用 you 泛指“人们”。",[["You dip it in sauce.","蘸酱吃。"],["You eat it with rice.","配米饭吃。"]]],[5,"推荐东西的万能句。",[["You have to try it.","你一定要尝尝。"],["I think you'd like it.","我觉得你会喜欢的。"]]]]},{"t":"Explaining Spring Festival","zh":"介绍春节","k":"life","s":[["Spring Festival is the most important holiday in China.","春节是中国最重要的节日。"],["It's also called Chinese New Year.","也叫中国新年。"],["Families get together for a big dinner.","家人团聚吃一顿大餐。"],["Kids get red envelopes with money inside.","孩子会收到装着钱的红包。"],["We set off fireworks at midnight.","我们半夜放烟花。"],["Everyone travels home, so trains are really crowded.","大家都回家，所以火车非常挤。"],["It usually lasts about a week.","通常放假一周左右。"]],"d":{"intro":"外国同学问你春节是什么。","turns":[{"o":"What's Spring Festival?","h":"说它是中国最重要的节日，也叫中国新年","a":"It's the most important holiday in China. It's also called Chinese New Year."},{"o":"What do people do?","h":"说家人团聚吃大餐","a":"Families get together for a big dinner."},{"o":"Do you give gifts?","h":"说孩子会收到红包","a":"Kids get red envelopes with money inside."},{"o":"That's cool. Are you going home this year?","h":"说会回家，但火车很挤","a":"Yes, but the trains are really crowded."}]},"c":"外国人常问中国节日。介绍时说三件事就够：什么时候、人们做什么、有什么意义。可以拿感恩节、圣诞节类比。","n":[[1,"It's also called ... 用来介绍别称。",[["Some people call it Lunar New Year.","有些人叫它农历新年。"],["It's kind of like Christmas in the US.","有点像美国的圣诞节。"]]],[2,"get together 是团聚、聚在一起。",[["The whole family gets together.","全家人聚在一起。"],["Everyone goes home to see their parents.","大家都回家看父母。"]]]]},{"t":"Exchanging money","zh":"换钱","k":"life","s":[["I'd like to exchange some money.","我想换点钱。"],["What's the exchange rate today?","今天的汇率是多少？"],["Is there a fee?","要手续费吗？"],["I'd like to change Chinese yuan to US dollars.","我想把人民币换成美元。"],["Could I have some smaller bills?","能给我一些小面额的吗？"],["Can I use my card at this ATM?","这台取款机能用我的卡吗？"],["How much can I take out?","最多能取多少？"]],"d":{"intro":"你在机场换钱柜台。","turns":[{"o":"Hello, how can I help you?","h":"说想把人民币换成美元","a":"Hi, I'd like to change Chinese yuan to US dollars."},{"o":"Sure. How much would you like to exchange?","h":"说两千人民币，问汇率","a":"Two thousand yuan. What's the exchange rate today?"},{"o":"It's about seven point two yuan to the dollar.","h":"问要不要手续费","a":"Is there a fee?"},{"o":"There's a five-dollar service fee.","h":"说好，要一些小面额","a":"OK. Could I have some smaller bills, please?"},{"o":"Of course. Here you go.","h":"道谢","a":"Thank you."}]},"c":"机场换汇汇率一般最差。在美国用国内的卡取现会收手续费，出国前问清楚。","n":[[1,"exchange rate 是汇率，简单说 What's the rate? 也行。",[["What's the rate for yuan?","人民币汇率是多少？"],["How many dollars will I get?","我能换到多少美元？"]]],[4,"bill 在这里是纸币，不是账单。",[["Could I get some twenties?","能给我一些二十元的吗？"],["Could you break this hundred?","能把这张一百的换开吗？"]]]]},{"t":"At the checkout","zh":"超市结账","k":"life","s":[["Is this line open?","这个收银台开着吗？"],["Do you have a rewards card?","你有会员卡吗？"],["No, I don't. Thanks.","没有，谢谢。"],["Could I get a bag, please?","能给我一个袋子吗？"],["I think I was charged twice for this.","这个好像扣了我两次钱。"],["Can I use the self-checkout?","我可以用自助结账吗？"],["The machine says I need help.","机器显示需要人工帮助。"]],"d":{"intro":"你在超市排队结账。","turns":[{"o":"Hi there. Did you find everything OK?","h":"说找到了，谢谢","a":"Yes, I did. Thanks."},{"o":"Do you have a rewards card with us?","h":"说没有","a":"No, I don't."},{"o":"Would you like to sign up? It's free.","h":"婉拒，下次再说","a":"Maybe next time, thanks."},{"o":"OK. Do you need a bag?","h":"说要一个","a":"Yes, one bag, please."},{"o":"Your total is thirty-four twenty.","h":"问能不能刷卡","a":"Can I pay by card?"}]},"c":"美国超市收银员常寒暄一句 Did you find everything OK?，回 Yes, thanks 就行。很多店有自助收银（self-checkout）。","n":[[1,"几乎每家超市收银都会问有没有会员卡。没有就说 No, I don't。",[["Do you have a membership card?","你有会员卡吗？"],["No, I'm good, thanks.","不用了，谢谢。"]]],[4,"charge 是收费、扣款。发现价格不对要当场说。",[["I think this rang up wrong.","这个好像扫错价了。"],["The price on the shelf was different.","货架上的价格不一样。"]]]]},{"t":"At the bakery","zh":"面包店","k":"life","s":[["What's freshly baked today?","今天有什么是刚烤好的？"],["I'll take two of these croissants.","我要两个这种牛角包。"],["Is this one sweet or savory?","这个是甜的还是咸的？"],["Does this have nuts in it?","这个里面有坚果吗？"],["Could you slice the bread for me?","能帮我把面包切片吗？"],["That's all for today.","今天就这些。"],["They smell amazing.","闻起来太香了。"]],"d":{"intro":"你走进一家面包店。","turns":[{"o":"Good morning! What can I get you?","h":"问今天什么是刚烤好的","a":"Good morning. What's freshly baked today?"},{"o":"The croissants and the sourdough just came out.","h":"要两个牛角包","a":"I'll take two croissants, please."},{"o":"Anything else?","h":"问那个是甜的还是咸的","a":"Is that one sweet or savory?"},{"o":"It's savory, with cheese and ham.","h":"说要一个，就这些","a":"I'll take one of those too. That's all."}]},"c":"美国面包店可以问 What's fresh today?。对坚果过敏在美国很常见，店里一般会标注 contains nuts。","n":[[2,"sweet 甜的，savory 咸的、不甜的，问食物口味时很常用。",[["Is this one sweet?","这个是甜的吗？"],["What's in this one?","这个里面是什么？"]]],[3,"问成分，过敏或忌口时一定要会。",[["Is this nut-free?","这个不含坚果吗？"],["Does this contain eggs?","这个含鸡蛋吗？"]]]]},{"t":"Ordering pizza for delivery","zh":"打电话订披萨外送","k":"life","s":[["I'd like to order a pizza for delivery.","我想订一份外送披萨。"],["Can I get a large pepperoni?","我要一个大号意式辣香肠披萨。"],["Half cheese, half veggie, please.","一半芝士、一半蔬菜。"],["How long will the delivery take?","外送要多久？"],["Is there a delivery fee?","有外送费吗？"],["My address is 12 Pine Street, Apartment 3.","我的地址是松树街 12 号 3 号公寓。"],["I'll pay in cash when it arrives.","到了我付现金。"]],"d":{"intro":"你打电话订披萨。","turns":[{"o":"Tony's Pizza, pickup or delivery?","h":"说外送","a":"Delivery, please."},{"o":"What can I get for you?","h":"点一个大号意式辣香肠披萨","a":"Can I get a large pepperoni pizza?"},{"o":"Sure. What's the address?","h":"说松树街 12 号 3 号公寓","a":"12 Pine Street, Apartment 3."},{"o":"That'll be about forty minutes.","h":"问有没有外送费","a":"OK. Is there a delivery fee?"},{"o":"It's three dollars. Cash or card?","h":"说到了付现金","a":"I'll pay in cash when it arrives."}]},"c":"美国叫披萨外送要给送餐员小费，一般 15%–20% 或几美元。一张披萨可以一半一个口味（half and half）。","n":[[2,"half A, half B 是一半这个一半那个，点披萨专用。",[["Can I get half and half?","能一半一个口味吗？"],["Can I add mushrooms?","能加蘑菇吗？"]]],[5,"美国地址顺序：门牌号、街道，再说公寓号。数字要说清楚。",[["It's 12 Pine Street, Unit 3.","地址是 Pine Street 12 号，3 号单元。"],["The buzzer is number 3.","门铃按 3 号。"]]]]},{"t":"At a fast-food counter","zh":"快餐店点餐","k":"life","s":[["Can I get a cheeseburger meal?","我要一个芝士汉堡套餐。"],["Can I get that without o
