<html lang="zh-CN">
<head>

<title>英语打卡</title>
<style>
/* Layout: an iPad study app — one column, bottom tab bar, large touch targets. Ink-blue for actions, highlighter yellow for "done"; English headwords set like a dictionary entry. */
:root{
  --paper:#F5F6F9; --card:#FFFFFF; --ink:#1B2333; --muted:#5C6578; --line:#E0E4EC;
  --accent:#2445B5; --accent-soft:#E2E8FB; --mark:#F3CD52; --mark-soft:#FBF0C6; --on-mark:#1B2333;
  --ok:#1E7F4F; --ok-soft:#DDF1E6; --danger:#B4372B;
  --c-words:#2F5BD3; --c-words-soft:#E3EAFC; --c-listen:#0B7A8C; --c-listen-soft:#DDF1F3;
  --c-scene:#D9480F; --c-scene-soft:#FDE8DE; --c-extra:#7E4BD6; --c-extra-soft:#EEE6FB;
  --f-display:"Songti SC","STSong","Noto Serif SC",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-word:"New York","Iowan Old Style",Georgia,serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#11151D; --card:#1A1F2A; --ink:#E6E9F0; --muted:#9AA2B4; --line:#2B3241;
  --accent:#8EA5FF; --accent-soft:#25305A; --mark:#D9B23C; --mark-soft:#4A3E1A; --ok:#5CC98E; --ok-soft:#1D3A2B; --danger:#F08A7E;
  --c-words:#8EA5FF; --c-words-soft:#232E52; --c-listen:#4FC3D1; --c-listen-soft:#173539; --c-scene:#FF9A66; --c-scene-soft:#42251A; --c-extra:#B79BFF; --c-extra-soft:#2E2448; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:860px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(var(--nav-h) + 28px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font-family:var(--f-display);font-size:28px}
h2{font-family:var(--f-display);font-size:20px}
h3{font-size:17px}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13.5px} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12.5px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:8px 16px;cursor:pointer;font-size:15.5px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--card);font-weight:600}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px;border-radius:9px}
.btn.big{min-height:56px;font-size:17px;padding:10px 22px;flex:1}
.btn:disabled{opacity:.4}
.btn.rec{border-color:var(--danger);color:var(--danger)}
.btn.rec.on{background:var(--danger);color:var(--card)}
.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;border-radius:20px;padding:1px 10px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.chip.full{background:var(--ok);color:var(--card)} .chip.floor{background:var(--mark);color:var(--on-mark)} .chip.mark{background:var(--mark-soft)}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;font-size:16px;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:0 max(8px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px,env(safe-area-inset-left))}
nav.tabs .in{display:flex;max-width:640px;width:100%}
.tab{flex:1;height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent)}
.tab .dot{position:absolute;top:10px;left:calc(50% + 8px);background:var(--mark);color:var(--on-mark);font-size:11px;font-family:var(--f-mono);border-radius:9px;padding:0 5px;line-height:17px}

/* timer bar */
.timerbar{position:sticky;top:max(8px,env(safe-area-inset-top));z-index:10;background:var(--accent);color:var(--card);border-radius:12px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between;box-shadow:0 4px 16px rgba(20,30,60,.18)}
.timerbar .btn{background:#fff;color:var(--accent);border:0;min-height:38px}

/* today */
.hero{display:flex;flex-direction:column;gap:12px}
.meter{position:relative;height:14px;background:var(--line);border-radius:7px;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--accent);transition:width .3s}
.meter .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--mark)}
.meter .tick span{position:absolute;top:18px;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.bignum{font-family:var(--f-mono);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.task{display:flex;flex-direction:column;gap:10px;position:relative}
.m-words{--mc:var(--c-words);--mc-soft:var(--c-words-soft)} .m-listen{--mc:var(--c-listen);--mc-soft:var(--c-listen-soft)}
.m-scene{--mc:var(--c-scene);--mc-soft:var(--c-scene-soft)} .m-extra{--mc:var(--c-extra);--mc-soft:var(--c-extra-soft)}
.task .head{display:flex;gap:12px;align-items:center}
.micon{flex:none;width:42px;height:42px;border-radius:12px;background:var(--mc-soft);color:var(--mc);display:grid;place-items:center}
.micon svg{width:24px;height:24px}
.task .eyebrow{color:var(--mc)}
[class*="m-"] .btn.pri{background:var(--mc);border-color:var(--mc)}
[class*="m-"] .lesson{color:var(--mc)}
main[class*="m-"] h1{color:var(--mc)}
main[class*="m-"] .ph-step.cur{background:var(--mc-soft)}
main[class*="m-"] .ear{background:var(--mc-soft);color:var(--mc)}
main.m-scene .bubble.me{background:var(--mc-soft)}
.timerbar[class*="m-"]{background:var(--mc)} .timerbar[class*="m-"] .btn{color:var(--mc)}
.pt-bands{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;width:100%;max-width:520px}
.pt-bands i{display:block;height:8px;border-radius:4px;background:var(--line)}
.pt-bands i.on{background:var(--mc)}
.task.done{border-color:var(--ok)}
.task .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.task h3{font-size:18px}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--card);cursor:pointer;padding:0}
.check svg{width:18px;height:18px;opacity:0}
.task.done .check{background:var(--ok);border-color:var(--ok)}
.task.done .check svg{opacity:1}
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:14.5px}
.steps li{margin:2px 0}
.lesson{font-family:var(--f-word);font-size:20px;font-style:italic}
.kw{font-family:var(--f-mono);font-size:13px;background:var(--paper);border-radius:8px;padding:4px 8px;user-select:all;-webkit-user-select:all}
.spent{font-size:13px;color:var(--muted)}
.road{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.road{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stage{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.stage.now{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.stage b{font-size:14px}
.pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}

/* flashcards */
.flash{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:30px 16px;min-height:330px;justify-content:center}
.hw{font-family:var(--f-word);font-size:46px;line-height:1.15;word-break:break-word}
.ph{font-family:var(--f-mono);color:var(--muted);font-size:15px}
.zh{font-size:18px;max-width:34em}
.ex{font-family:var(--f-word);font-style:italic;font-size:19px;color:var(--ink);max-width:34em}
.ear{width:120px;height:120px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.ear svg{width:54px;height:54px}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;max-width:520px}
.phases{display:flex;gap:8px;flex-wrap:wrap}
.ph-step{flex:1;min-width:120px;background:var(--paper);border-radius:10px;padding:8px 12px;font-size:13.5px}
.ph-step.cur{background:var(--accent-soft)}
.ph-step b{font-family:var(--f-mono);font-size:16px;display:block}

/* scenes */
.sent{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.sent:first-child{border-top:0}
.sent .en{font-family:var(--f-word);font-size:20px;line-height:1.4}
.sent .en.hide{color:transparent;background:var(--paper);border-radius:6px;user-select:none}
.sent .cn{color:var(--muted);font-size:14.5px}
.bubble{border-radius:14px;padding:14px 16px;max-width:92%}
.bubble.o{background:var(--paper);align-self:flex-start}
.bubble.me{background:var(--accent-soft);align-self:flex-end}
.bubble .who{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.bubble .en{font-family:var(--f-word);font-size:20px}
.talk{display:flex;flex-direction:column;gap:12px}
.slist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:560px){.slist{grid-template-columns:minmax(0,1fr)}}
.slist button{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px;display:flex;gap:8px;align-items:center}
.slist button.cur{border-color:var(--accent)}
.slist .n{font-family:var(--f-mono);color:var(--muted);font-size:12px;min-width:2em}

/* records */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .n{font-family:var(--f-mono);font-size:24px;line-height:1.2}
.kpi .n small{font-size:13px;color:var(--muted)}
.kpi .l{font-size:12.5px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center}
.cal .d{aspect-ratio:1;border-radius:8px;background:var(--paper);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px}
.cal .d.full{background:var(--ok);color:var(--card)}
.cal .d.floor{background:var(--mark);color:var(--on-mark)}
.cal .d.some{background:var(--accent-soft)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d.out{visibility:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{display:flex;align-items:flex-end;gap:3px;height:130px;border-bottom:1px solid var(--line);position:relative;min-width:420px}
.chart .c{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:0}
.chart .c.full{background:var(--ok)}
.chart .goal{position:absolute;left:0;right:0;border-top:1px dashed var(--mark)}
.chart .goal span{position:absolute;right:0;top:-16px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.xl{display:flex;gap:3px;min-width:420px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.xl span{flex:1;text-align:center}
.scroll-x{overflow-x:auto}
.wl{list-style:none;margin:0;padding:0}
.wl li{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.wl li:first-child{border-top:0}
.wl .w{font-family:var(--f-word);font-size:18px;font-weight:700}
.addw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;gap:8px}
@media (max-width:560px){.addw{grid-template-columns:minmax(0,1fr)}}
.advice{margin:0;padding-left:20px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field label{flex:1}
.field .hint{display:block;font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:50;max-width:90vw;text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

],["account for","解释；占（比例）","This effect accounts for about ten percent."],["base on","以……为基础","The model is based on real data."],["compare with","与……比较","Compared with last year, prices are higher."],["look into","调查，研究","We'll look into the problem."],["build on","在……基础上发展","Our work builds on earlier studies."],["back up","支持；备份","Can you back up your claim with data?"],["narrow down","缩小（范围）","We narrowed down the list to three options."],["rule out","排除","We can't rule out other explanations."],["come up","被提出；出现","A problem came up during the test."],["follow up","跟进","I'll follow up with an email."],["fall behind","落后","I fell behind in my studies last month."],["try on","试穿","Can I try on this jacket?"],["try out","试用","I want to try out the new app."],["eat out","在外面吃饭","We eat out on Fridays."],["clean up","打扫干净","Let's clean up the kitchen."],["throw away","扔掉","Don't throw away the receipt."],["run into","偶然碰到","I ran into my professor at the supermarket."],["stand out","突出，显眼","Your presentation really stood out."],["speak up","大声说；说出看法","Could you speak up a little?"],["grow up","长大","I grew up in a small town."],["settle in","安顿下来","It took me a few weeks to settle in."],["cut down on","减少","I'm trying to cut down on sugar."],["put up with","忍受","I can't put up with the noise anymore."],["get rid of","摆脱，扔掉","I need to get rid of some old clothes."],["make up","编造；弥补；化妆","I'll make up the lost time this weekend."],["make sure","确保","Make sure you lock the door."],["used to","过去常常","I used to play basketball every day."]],"scenes":[{"t":"Introducing yourself","zh":"自我介绍","k":"life","s":[["Hi, I'm Yang Chao. Nice to meet you.","你好，我是杨超，很高兴认识你。"],["You can call me Yang.","你可以叫我 Yang。"],["I'm from Fuzhou, in the south-east of China.","我来自福州，在中国东南部。"],["I'm a graduate student in physics.","我是物理专业的研究生。"],["I also help run a small factory.","我也在帮忙经营一家小工厂。"],["In my free time, I like watching videos and walking.","空闲时我喜欢看视频和散步。"],["Nice to meet you, too.","我也很高兴认识你。"]],"d":{"intro":"在一个聚会上，你第一次见到 Emma。","turns":[{"o":"Hi there! I'm Emma. What's your name?","h":"介绍你的名字","a":"Hi Emma, I'm Yang Chao. You can call me Yang."},{"o":"Nice to meet you, Yang. Where are you from?","h":"说你来自中国福州","a":"Nice to meet you too. I'm from Fuzhou, in China."},{"o":"Oh, cool. What do you do?","h":"说你是物理研究生","a":"I'm a graduate student. I study physics."},{"o":"Physics! That sounds hard. Do you like it?","h":"说你喜欢，但有时很难","a":"Yes, I like it, but sometimes it's really hard."},{"o":"What do you do for fun?","h":"说你喜欢看视频和散步","a":"I like watching videos and going for walks."}]}},{"t":"Small talk","zh":"问候与闲聊","k":"life","s":[["How's it going?","最近怎么样？"],["Not bad, thanks. How about you?","还不错，谢谢。你呢？"],["Pretty good. Just a little tired.","挺好的，就是有点累。"],["It's really nice weather today, isn't it?","今天天气真好，是吧？"],["What are you up to this weekend?","这周末你打算做什么？"],["Nothing special. Maybe I'll just relax.","没什么特别的，可能就休息一下。"],["Have a good one!","祝你愉快！（告别）"]],"d":{"intro":"早上在楼道里碰到同事 Mike。","turns":[{"o":"Morning, Yang! How's it going?","h":"说还不错，并反问他","a":"Morning! Not bad, thanks. How about you?"},{"o":"Pretty good. Nice weather today, isn't it?","h":"同意，说天气真好","a":"Yeah, it's really nice today."},{"o":"Any plans for the weekend?","h":"说没什么特别的，可能休息","a":"Nothing special. Maybe I'll just relax at home."},{"o":"Sounds good. I'm going hiking with some friends.","h":"说听起来很有意思","a":"That sounds like fun. Have a great time!"},{"o":"Thanks! See you later.","h":"道别","a":"See you. Have a good one!"}]}},{"t":"When you don't understand","zh":"听不懂时怎么办","k":"life","s":[["Sorry, could you say that again?","不好意思，你能再说一遍吗？"],["Could you speak a little more slowly, please?","你能说得慢一点吗？"],["Sorry, I didn't catch that.","抱歉，我没听清。"],["What does that word mean?","那个词是什么意思？"],["How do you spell that?","那个怎么拼？"],["Do you mean ...?","你的意思是……吗？"],["My English isn't perfect, so please bear with me.","我英语不太好，请多包涵。"]],"d":{"intro":"一位工作人员语速很快地跟你说话，你没听懂。","turns":[{"o":"You'll need to go to the second floor and get a form from the front desk before you see the advisor.","h":"说没听清，请他再说一遍","a":"Sorry, I didn't catch that. Could you say that again?"},{"o":"Sure. Second floor. Get a form. Then see the advisor.","h":"确认：你是说去二楼拿表？","a":"Do you mean I should go to the second floor and get a form?"},{"o":"Exactly. The form is called an I-twenty.","h":"问那个词怎么拼","a":"Sorry, how do you spell that?"},{"o":"I, then the number twenty. I-two-zero.","h":"说明白了，谢谢他","a":"Got it. Thank you for your patience."}]}},{"t":"Ordering coffee","zh":"咖啡店点单","k":"life","s":[["Can I get a medium latte, please?","请给我一杯中杯拿铁。"],["For here or to go?","在这儿喝还是带走？"],["To go, please.","带走，谢谢。"],["Could I have oat milk instead?","能换成燕麦奶吗？"],["Can I pay by card?","可以刷卡吗？"],["That's all, thanks.","就这些，谢谢。"],["Could I get a receipt, please?","能给我一张小票吗？"]],"d":{"intro":"你在一家咖啡店排到了柜台前。","turns":[{"o":"Hi! What can I get for you?","h":"点一杯中杯拿铁","a":"Hi, can I get a medium latte, please?"},{"o":"Sure. Any milk preference?","h":"说要燕麦奶","a":"Could I have oat milk, please?"},{"o":"Of course. For here or to go?","h":"说带走","a":"To go, please."},{"o":"Anything else?","h":"说就这些","a":"No, that's all, thanks."},{"o":"That'll be five fifty.","h":"问能不能刷卡","a":"Can I pay by card?"}]}},{"t":"At the supermarket","zh":"超市购物","k":"life","s":[["Excuse me, where can I find the rice?","请问米在哪儿？"],["It's in aisle five, next to the pasta.","在五号货架，意面旁边。"],["Do you have any fresh fish?","有新鲜的鱼吗？"],["How much is this?","这个多少钱？"],["Is this on sale?","这个在打折吗？"],["I don't need a bag, thanks.","我不需要袋子，谢谢。"],["Do you take cash?","收现金吗？"]],"d":{"intro":"你在超市找不到米，问一位店员。","turns":[{"o":"Hi, can I help you find something?","h":"问米在哪儿","a":"Yes, please. Where can I find the rice?"},{"o":"It's in aisle five, next to the pasta.","h":"谢谢，再问有没有新鲜的鱼","a":"Thanks. Do you have any fresh fish?"},{"o":"Yes, the seafood counter is at the back of the store.","h":"道谢","a":"Great, thank you."},{"o":"(At the checkout) Would you like a bag?","h":"说不需要袋子","a":"No, I don't need a bag, thanks."},{"o":"Your total is twenty-three forty.","h":"问能不能刷卡","a":"Can I pay by card?"}]}},{"t":"Asking for directions","zh":"问路","k":"life","s":[["Excuse me, how do I get to the train station?","请问去火车站怎么走？"],["Go straight and turn left at the second light.","直走，在第二个红绿灯左转。"],["Is it far from here?","离这儿远吗？"],["It's about a ten-minute walk.","走路大约十分钟。"],["Is there a bus that goes there?","有公交车到那儿吗？"],["So I go straight, then turn left?","所以我直走，然后左转？"],["Thanks for your help.","谢谢你的帮助。"]],"d":{"intro":"你在街上迷路了，问一位路人。","turns":[{"o":"You look lost. Can I help?","h":"问去火车站怎么走","a":"Yes, thanks. How do I get to the train station?"},{"o":"Go straight down this street and turn left at the second light.","h":"复述确认路线","a":"So I go straight, then turn left at the second light?"},{"o":"That's right.","h":"问远不远","a":"Is it far from here?"},{"o":"About ten minutes on foot.","h":"问有没有公交","a":"Is there a bus that goes there?"},{"o":"The number twelve, but walking is faster.","h":"道谢说你走过去","a":"OK, I'll walk then. Thanks for your help!"}]}},{"t":"Taking public transport","zh":"乘坐公共交通","k":"life","s":[["Does this bus go downtown?","这辆车去市中心吗？"],["How much is a ticket?","票多少钱？"],["Where do I buy a ticket?","在哪儿买票？"],["Which stop should I get off at?","我应该在哪站下车？"],["How many stops is it?","要坐几站？"],["Could you tell me when we get there?","到了能告诉我一声吗？"],["I think I missed my stop.","我好像坐过站了。"]],"d":{"intro":"你上公交车前问司机。","turns":[{"o":"Good morning.","h":"问这辆车去不去市立医院","a":"Morning. Does this bus go to City Hospital?"},{"o":"Yes, it does.","h":"问票价","a":"How much is a ticket?"},{"o":"Two seventy-five. You can tap your card here.","h":"问要坐几站","a":"OK. How many stops is it?"},{"o":"About eight stops.","h":"请他到站时提醒你","a":"Could you tell me when we get there, please?"},{"o":"Sure, no problem.","h":"道谢","a":"Thank you so much."}]}},{"t":"At a restaurant","zh":"餐厅点餐","k":"life","s":[["A table for two, please.","两位，谢谢。"],["Could we see the menu, please?","能看一下菜单吗？"],["What do you recommend?","你推荐什么？"],["I'll have the chicken salad.","我要鸡肉沙拉。"],["Could I get some water, please?","能给我点水吗？"],["Could we get the check, please?","请结账。"],["Can we split the bill?","我们可以分开付吗？"]],"d":{"intro":"你和朋友去一家餐厅吃饭。","turns":[{"o":"Hi, welcome! How many?","h":"说两位","a":"Hi, a table for two, please."},{"o":"Right this way. Here are your menus. Can I get you something to drink?","h":"要水","a":"Could we get some water, please?"},{"o":"Sure. Are you ready to order?","h":"问服务员推荐什么","a":"Not yet. What do you recommend?"},{"o":"The grilled salmon is really popular.","h":"说你要三文鱼","a":"OK, I'll have the grilled salmon."},{"o":"(Later) How was everything?","h":"说很好吃，请结账","a":"It was great, thanks. Could we get the check, please?"}]}},{"t":"Your research, simply","zh":"简单介绍你的研究","k":"academic","s":[["I study physics, mainly heat transfer.","我学物理，主要研究传热。"],["My research is about how heat moves in gases.","我的研究是关于热在气体中如何传递。"],["We use computer simulations.","我们用计算机模拟。"],["It's a bit like a one-way valve for heat.","它有点像热的单向阀。"],["The idea is simple, but the details are tricky.","想法很简单，但细节很复杂。"],["It could be useful for managing heat in devices.","它可能对设备里的热管理有用。"],["I'm still working on it.","我还在做。"]],"d":{"intro":"一位不是物理专业的朋友问你在研究什么。","turns":[{"o":"So what do you actually research?","h":"说你研究热在气体中如何传递","a":"I study how heat moves in gases."},{"o":"Interesting. How do you study that?","h":"说主要用计算机模拟","a":"Mostly with computer simulations."},{"o":"What's the main idea?","h":"用'热的单向阀'来比喻","a":"It's a bit like a one-way valve for heat. Heat flows more easily in one direction."},{"o":"Wow. Is it useful for anything?","h":"说可能用于设备散热","a":"It could be useful for managing heat in devices."},{"o":"Cool. Are you finished?","h":"说还在做","a":"Not yet. I'm still working on it."}]}},{"t":"Passing immigration","zh":"机场入境","k":"life","s":[["I'm here to study.","我来这里读书。"],["I'm going to be a visiting student.","我是来做访问学生的。"],["I'll be staying for one year.","我会待一年。"],["I'll be staying in student housing.","我住学生宿舍。"],["Here is my passport and my visa.","这是我的护照和签证。"],["This is my letter from the university.","这是学校的录取信。"],["This is my first time here.","这是我第一次来。"]],"d":{"intro":"你在机场入境柜台。","turns":[{"o":"Passport, please.","h":"递上护照和签证","a":"Here is my passport and my visa."},{"o":"What's the purpose of your visit?","h":"说来读书","a":"I'm here to study."},{"o":"How long will you be staying?","h":"说待一年","a":"I'll be staying for one year."},{"o":"Where will you be staying?","h":"说住学生宿舍","a":"In student housing at the university."},{"o":"Do you have any documents from the school?","h":"说这是学校的信","a":"Yes, this is my letter from the university."}]}},{"t":"Checking into a hotel","zh":"酒店入住","k":"life","s":[["I have a reservation under Yang.","我用 Yang 这个名字订了房。"],["I'd like to check in, please.","我想办理入住。"],["What time is check-out?","几点退房？"],["Is breakfast included?","含早餐吗？"],["What's the Wi-Fi password?","Wi-Fi 密码是多少？"],["Could I have a late check-out?","可以晚点退房吗？"],["The air conditioning isn't working.","空调坏了。"]],"d":{"intro":"你到了酒店前台。","turns":[{"o":"Good evening. How can I help you?","h":"说你要入住，用 Yang 订的","a":"Hi, I'd like to check in. I have a reservation under Yang."},{"o":"Let me see... Yes, three nights. Can I see your passport?","h":"递上护照","a":"Sure, here you go."},{"o":"Your room is 405.","h":"问含不含早餐","a":"Thank you. Is breakfast included?"},{"o":"Yes, from seven to ten in the restaurant.","h":"问 Wi-Fi 密码","a":"Great. What's the Wi-Fi password?"},{"o":"It's on the card with your key.","h":"问几点退房","a":"Thanks. And what time is check-out?"}]}},{"t":"Opening a bank account","zh":"银行开户","k":"life","s":[["I'd like to open a bank account.","我想开一个银行账户。"],["I'm an international student.","我是国际学生。"],["What documents do I need?","需要什么材料？"],["Is there a monthly fee?","有月费吗？"],["Can I get a debit card?","能办一张借记卡吗？"],["How long does it take to get the card?","卡多久能拿到？"],["Can I set up online banking?","可以开通网上银行吗？"]],"d":{"intro":"你去银行开户。","turns":[{"o":"Hello, what can I do for you today?","h":"说想开户，你是国际学生","a":"Hi, I'd like to open a bank account. I'm an international student."},{"o":"Sure. Do you have your passport and proof of address?","h":"问还需要什么材料","a":"Yes, I have my passport. What other documents do I need?"},{"o":"A letter from your school would help.","h":"说你带了，问有没有月费","a":"I have that here. Is there a monthly fee?"},{"o":"No fee for students.","h":"问能不能办借记卡","a":"Great. Can I get a debit card too?"},{"o":"Yes, it'll arrive by mail in about a week.","h":"道谢","a":"Perfect. Thank you for your help."}]}},{"t":"Getting a phone plan","zh":"办手机卡","k":"life","s":[["I need a SIM card for my phone.","我需要一张手机卡。"],["Do you have any prepaid plans?","有预付费套餐吗？"],["How much data does it include?","包含多少流量？"],["Can I make international calls?","能打国际电话吗？"],["Is there a contract?","需要签合约吗？"],["Can I keep my phone?","可以用我自己的手机吗？"],["I'll take this one.","我要这个。"]],"d":{"intro":"你在手机店办卡。","turns":[{"o":"Hi, how can I help?","h":"说需要一张手机卡","a":"Hi, I need a SIM card for my phone."},{"o":"Are you looking for a monthly plan or prepaid?","h":"问预付费套餐","a":"Do you have any prepaid plans?"},{"o":"Yes, this one is thirty dollars a month.","h":"问包含多少流量","a":"How much data does it include?"},{"o":"Fifteen gigs, and unlimited calls.","h":"问能否打国际电话","a":"Can I call China with it?"},{"o":"You can add international calls for five dollars.","h":"说就要这个","a":"OK, I'll take this one."}]}},{"t":"Meeting your supervisor","zh":"和导师见面","k":"academic","s":[["Thank you for taking the time to meet me.","谢谢您抽时间见我。"],["Could I ask you about my project?","我能问一下我的课题吗？"],["I've been working on the simulations.","我一直在做模拟。"],["I'm stuck on one problem.","我卡在一个问题上。"],["What do you suggest I try next?","您建议我接下来试什么？"],["Could you recommend some papers?","您能推荐一些论文吗？"],["I'll send you an update next week.","我下周给您发进展。"]],"d":{"intro":"你第一次和国外的导师 Dr. Brown 单独见面。","turns":[{"o":"Come in, Yang. Have a seat.","h":"谢谢他抽时间","a":"Thank you for taking the time to meet me."},{"o":"Of course. How's everything going?","h":"说一直在做模拟，但卡在一个问题上","a":"I've been working on the simulations, but I'm stuck on one problem."},{"o":"What kind of problem?","h":"说结果在高温时不稳定","a":"The results aren't stable at high temperatures."},{"o":"Maybe try a smaller time step first.","h":"说好的，并请他推荐论文","a":"OK, I'll try that. Could you also recommend some papers?"},{"o":"Sure, I'll email you a few.","h":"说下周给他发进展","a":"Thank you. I'll send you an update next week."}]}},{"t":"Viewing an apartment","zh":"租房看房","k":"life","s":[["I'm calling about the apartment for rent.","我打电话是想问出租的公寓。"],["Is it still available?","还在出租吗？"],["How much is the rent?","房租多少？"],["Are utilities included?","包含水电费吗？"],["How long is the lease?","租期多长？"],["Is there a washing machine?","有洗衣机吗？"],["When can I move in?","我什么时候能搬进来？"]],"d":{"intro":"你去看一间出租公寓，房东带你参观。","turns":[{"o":"Hi, you must be Yang. Come on in.","h":"打招呼，问房租多少","a":"Hi, nice to meet you. How much is the rent?"},{"o":"It's twelve hundred a month.","h":"问包不包水电","a":"Are utilities included?"},{"o":"Water is included, but not electricity.","h":"问租期多长","a":"I see. How long is the lease?"},{"o":"Twelve months, but six is possible.","h":"问有没有洗衣机","a":"Is there a washing machine?"},{"o":"Yes, in the basement.","h":"问什么时候能搬进来","a":"Great. When can I move in?"}]}},{"t":"Living with a roommate","zh":"和室友沟通","k":"life","s":[["Do you mind if I use the kitchen now?","我现在用厨房你介意吗？"],["Could you keep it down a bit? I have an exam tomorrow.","能小声一点吗？我明天有考试。"],["Let's split the bills evenly.","我们平摊账单吧。"],["Whose turn is it to take out the trash?","这次轮到谁倒垃圾？"],["I'll clean the bathroom this week.","这周我来打扫卫生间。"],["Is it OK if a friend stays over?","朋友来住一晚可以吗？"],["Thanks for understanding.","谢谢理解。"]],"d":{"intro":"晚上 11 点，室友在客厅放音乐，你明天有考试。","turns":[{"o":"Hey Yang! Want to watch a movie with us?","h":"谢谢但说明天有考试","a":"Thanks, but I have an exam tomorrow."},{"o":"Oh, good luck!","h":"礼貌请他们小声一点","a":"Thanks. Could you keep it down a bit, please?"},{"o":"Sure, sorry about that.","h":"说没关系，谢谢理解","a":"No problem. Thanks for understanding."},{"o":"By the way, the electricity bill came today.","h":"提议平摊","a":"Let's split it evenly, OK?"},{"o":"Sounds fair.","h":"说这周你来打扫卫生间","a":"And I'll clean the bathroom this week."}]}},{"t":"Reporting a problem","zh":"报修","k":"life","s":[["The heater in my room isn't working.","我房间的暖气坏了。"],["The sink is leaking.","水槽漏水。"],["There's no hot water.","没有热水。"],["It started yesterday evening.","从昨天晚上开始的。"],["Could someone come and take a look?","能派人来看看吗？"],["When would be a good time?","什么时间方便？"],["I'll be home after six.","我六点以后在家。"]],"d":{"intro":"你打电话给公寓管理处报修。","turns":[{"o":"Maintenance office, how can I help?","h":"说你房间暖气坏了","a":"Hi, the heater in my room isn't working."},{"o":"I'm sorry to hear that. Which apartment?","h":"说 3B 号","a":"Apartment 3B."},{"o":"When did it stop working?","h":"说从昨晚开始","a":"It started yesterday evening."},{"o":"We can send someone tomorrow.","h":"问什么时间","a":"Thank you. What time would that be?"},{"o":"Between ten and two. Is that OK?","h":"说你两点后才在家，问能否晚点","a":"I'm not home until two. Could they come after that?"}]}},{"t":"In the lab","zh":"实验室日常","k":"academic","s":[["Is anyone using this computer?","有人在用这台电脑吗？"],["How long will your job take on the server?","你在服务器上的任务要跑多久？"],["Could you show me how this works?","你能教我这个怎么用吗？"],["I think there's a bug in my code.","我觉得我的代码有 bug。"],["Do you have a minute?","你有空吗？"],["Let me double-check the results.","让我再检查一下结果。"],["That makes sense.","明白了，有道理。"]],"d":{"intro":"你想用实验室的服务器，问同组的 Alex。","turns":[{"o":"Hey Yang, what's up?","h":"问他有没有空","a":"Hi Alex, do you have a minute?"},{"o":"Sure, what do you need?","h":"问他服务器上的任务要跑多久","a":"How long will your job take on the server?"},{"o":"Probably until tonight. Why?","h":"说你也想跑一个模拟","a":"I'd like to run a simulation too."},{"o":"You can use nodes one to four. I'm only on five to eight.","h":"说明白了，并请他教你提交任务","a":"That makes sense. Could you show me how to submit a job?"},{"o":"Sure, it's easy. Come here.","h":"道谢","a":"Thanks a lot."}]}},{"t":"Making a doctor's appointment","zh":"电话预约看病","k":"life","s":[["I'd like to make an appointment.","我想预约。"],["I've had a sore throat for three days.","我嗓子疼三天了。"],["Is there anything available this week?","这周有空位吗？"],["Do you take student insurance?","你们接受学生保险吗？"],["Could you spell the doctor's name?","能拼一下医生的名字吗？"],["What should I bring?","我要带什么？"],["See you on Thursday.","周四见。"]],"d":{"intro":"你打电话给诊所预约。","turns":[{"o":"Good morning, Green Street Clinic.","h":"说想预约","a":"Hi, I'd like to make an appointment, please."},{"o":"What's the problem?","h":"说嗓子疼了三天","a":"I've had a sore throat for three days."},{"o":"We have an opening on Thursday at ten.","h":"说可以，问是否接受学生保险","a":"That works. Do you take student insurance?"},{"o":"Yes, we do. Can I have your name?","h":"说名字并拼出来","a":"Yang Chao. Y-A-N-G, C-H-A-O."},{"o":"Great. Please bring your insurance card.","h":"道谢，周四见","a":"OK, thank you. See you on Thursday."}]}},{"t":"At the doctor's","zh":"看医生","k":"life","s":[["I don't feel well.","我感觉不舒服。"],["I have a headache and a fever.","我头疼还发烧。"],["It hurts when I swallow.","咽东西的时候疼。"],["I'm not allergic to anything.","我没有过敏。"],["How often should I take this?","这个多久吃一次？"],["Do I need to come back?","我需要复诊吗？"],["Could you write that down for me?","您能帮我写下来吗？"]],"d":{"intro":"你在诊室里，医生问你情况。","turns":[{"o":"So, what brings you in today?","h":"说嗓子疼，还有点发烧","a":"I have a sore throat and a slight fever."},{"o":"How long have you had it?","h":"说三天","a":"About three days."},{"o":"Any allergies to medication?","h":"说没有过敏","a":"No, I'm not allergic to anything."},{"o":"I'll prescribe some antibiotics.","h":"问多久吃一次","a":"How often should I take them?"},{"o":"Twice a day for seven days.","h":"请医生写下来","a":"Could you write that down for me, please?"}]}},{"t":"At the pharmacy","zh":"药店","k":"life","s":[["I'm here to pick up a prescription.","我来取处方药。"],["Do you have something for a cold?","有治感冒的药吗？"],["Does this make you sleepy?","这个吃了会犯困吗？"],["Should I take it with food?","要饭后吃吗？"],["How many should I take?","要吃几片？"],["Are there any side effects?","有副作用吗？"],["Do you have a smaller size?","有小包装吗？"]],"d":{"intro":"你去药店买感冒药。","turns":[{"o":"Hi, what can I help you with?","h":"问有没有治感冒的药","a":"Hi, do you have something for a cold?"},{"o":"This one works well for a runny nose and cough.","h":"问会不会犯困","a":"Does it make you sleepy?"},{"o":"The night version does, the day version doesn't.","h":"说要白天那种，问要不要饭后吃","a":"I'll take the day version. Should I take it with food?"},{"o":"It's better with food.","h":"问一次吃几片","a":"How many should I take?"},{"o":"Two tablets every six hours.","h":"道谢","a":"Got it. Thank you."}]}},{"t":"Networking at a conference","zh":"会议茶歇社交","k":"academic","s":[["Hi, I really enjoyed your talk.","你好，我很喜欢你的报告。"],["I'm a graduate student at Fuzhou University.","我是福州大学的研究生。"],["I work on thermal rectification.","我做热整流方向。"],["How did you get the idea for that?","你是怎么想到这个的？"],["Could I email you some questions later?","我之后可以给你发邮件问问题吗？"],["Here's my card.","这是我的名片。"],["It was great talking to you.","和你聊天很愉快。"]],"d":{"intro":"茶歇时，你走向刚做完报告的 Dr. Lee。","turns":[{"o":"Hi there.","h":"说很喜欢她的报告","a":"Hi, I really enjoyed your talk."},{"o":"Thank you! Which part were you interested in?","h":"说对模拟方法感兴趣","a":"The simulation method. I work on something similar."},{"o":"Oh, what do you work on?","h":"说你是福州大学的学生，做热整流","a":"I'm a student at Fuzhou University. I work on thermal rectification in gases."},{"o":"That's interesting! We should keep in touch.","h":"问能不能之后给她发邮件","a":"I'd love that. Could I email you some questions later?"},{"o":"Of course. Here's my card.","h":"道谢，说聊天很愉快","a":"Thank you. It was great talking to you."}]}},{"t":"Making and declining plans","zh":"邀请与拒绝","k":"life","s":[["Are you free on Saturday?","你周六有空吗？"],["Do you want to grab dinner sometime?","要不要找时间一起吃饭？"],["That sounds great. What time?","听起来不错，几点？"],["I'd love to, but I'm busy that day.","我很想去，但那天有事。"],["How about next week instead?","改成下周怎么样？"],["Let me check my schedule.","我看一下安排。"],["Let me know if anything changes.","有变化告诉我。"]],"d":{"intro":"同学 Sarah 约你出去。","turns":[{"o":"Hey Yang, are you free on Saturday? A few of us are going for dinner.","h":"说很想去但那天有事","a":"I'd love to, but I'm busy on Saturday."},{"o":"Oh, that's too bad.","h":"提议改到下周","a":"How about next week instead?"},{"o":"Sure! How about next Friday?","h":"说让我看一下安排","a":"Let me check my schedule... Friday works."},{"o":"Great. Seven o'clock at the Thai place?","h":"说没问题，有变化告诉你","a":"Sounds good. Let me know if anything changes."}]}},{"t":"Returning an item","zh":"退换货","k":"life","s":[["I'd like to return this.","我想退这个。"],["It doesn't fit.","尺寸不合适。"],["It was broken when I opened it.","打开时就是坏的。"],["Here's my receipt.","这是我的小票。"],["Can I exchange it for a bigger size?","能换大一号吗？"],["Can I get a refund instead?","能退款吗？"],["How long does the refund take?","退款要多久？"]],"d":{"intro":"你买的电水壶是坏的，拿回店里。","turns":[{"o":"Hi, how can I help you?","h":"说想退货","a":"Hi, I'd like to return this kettle."},{"o":"What's wrong with it?","h":"说打开时就是坏的","a":"It was broken when I opened it."},{"o":"I'm sorry. Do you have the receipt?","h":"递上小票","a":"Yes, here's my receipt."},{"o":"Would you like an exchange or a refund?","h":"说要退款","a":"I'd like a refund, please."},{"o":"No problem. It goes back to your card.","h":"问要多久","a":"How long does that take?"}]}},{"t":"Giving a talk: opening","zh":"学术报告：开场与过渡","k":"academic","s":[["Good morning, everyone. Thank you for coming.","大家早上好，谢谢各位到场。"],["Today I'm going to talk about heat transport in gases.","今天我要讲气体中的热输运。"],["First, I'll give some background.","首先我介绍一些背景。"],["Next, I'll show our simulation results.","接下来我展示我们的模拟结果。"],["As you can see in this figure, ...","如图所示，……"],["Let me move on to the next part.","我们进入下一部分。"],["To sum up, ...","总结一下，……"]],"d":{"intro":"你在组会上做报告，按提示说出每一段的开头。","turns":[{"o":"(Chair) Our next speaker is Yang Chao.","h":"问好并感谢大家","a":"Good morning, everyone. Thank you for coming."},{"o":"(The audience waits for you to begin.)","h":"说今天讲什么","a":"Today I'm going to talk about heat transport in gases."},{"o":"(You show your outline slide.)","h":"说先讲背景，再讲结果","a":"First, I'll give some background. Then I'll show our results."},{"o":"(You show a figure.)","h":"用'如图所示'引出结果","a":"As you can see in this figure, the heat flow depends on the direction."},{"o":"(Last slide.)","h":"总结并感谢","a":"To sum up, gravity can create thermal rectification. Thank you for listening."}]}},{"t":"Asking questions after a talk","zh":"报告后提问","k":"academic","s":[["Thank you for the great talk.","感谢精彩的报告。"],["I have a question about your method.","我对你的方法有个问题。"],["Could you go back to slide five?","能回到第五页吗？"],["Have you tried a different boundary condition?","你试过别的边界条件吗？"],["How does this compare with experiments?","这和实验比怎么样？"],["Just to make sure I understand, ...","确认一下我的理解，……"],["That's very helpful, thank you.","这很有帮助，谢谢。"]],"d":{"intro":"报告结束，主持人请大家提问，你举手。","turns":[{"o":"(Chair) Any questions? Yes, please.","h":"感谢报告，说对方法有问题","a":"Thank you for the great talk. I have a question about your method."},{"o":"Sure, go ahead.","h":"请他回到第五页","a":"Could you go back to slide five, please?"},{"o":"Here it is.","h":"问是否试过别的边界条件","a":"Have you tried a different boundary condition?"},{"o":"Not yet, but that's a good idea.","h":"再问和实验比怎么样","a":"And how does this compare with experiments?"},{"o":"It agrees within about five percent.","h":"道谢","a":"That's very helpful, thank you."}]}},{"t":"Answering questions","zh":"回答提问","k":"academic","s":[["That's a great question.","这个问题很好。"],["If I understand correctly, you're asking about ...","如果我理解对了，你是在问……"],["We haven't tested that yet.","这个我们还没测试过。"],["That's something we plan to do next.","这是我们下一步打算做的。"],["I'm not sure, but my guess is ...","我不太确定，但我推测……"],["Could you repeat the question?","能再说一下问题吗？"],["Maybe we can talk more after the session.","我们会后可以再聊。"]],"d":{"intro":"你做完报告，有人提问。","turns":[{"o":"How sensitive are your results to the gas density?","h":"先说问题很好，确认理解","a":"That's a great question. If I understand correctly, you're asking about the effect of density?"},{"o":"Yes, exactly.","h":"说还没测试，是下一步计划","a":"We haven't tested that yet. That's something we plan to do next."},{"o":"Do you expect the effect to get stronger?","h":"说不确定，但推测会变强","a":"I'm not sure, but my guess is that it will get stronger."},{"o":"(Another person asks very quickly, you miss it.)","h":"请对方重复问题","a":"Sorry, could you repeat the question?"},{"o":"(Chair) We're out of time.","h":"说会后可以再聊","a":"Maybe we can talk more after the session. Thank you."}]}},{"t":"Talking with neighbors","zh":"和邻居相处","k":"life","s":[["Hi, I just moved in next door.","你好，我刚搬到隔壁。"],["How long have you lived here?","你在这里住多久了？"],["Is there a good place to eat nearby?","附近有好吃的地方吗？"],["Do you know when the trash is collected?","你知道什么时候收垃圾吗？"],["A package for you came to my door.","你的包裹送到我门口了。"],["Let me know if you need anything.","需要什么跟我说。"],["It's nice to have you as a neighbor.","很高兴有你这样的邻居。"]],"d":{"intro":"你刚搬家，在门口遇到邻居 Linda。","turns":[{"o":"Hi! Are you new here?","h":"说刚搬到隔壁","a":"Hi, yes, I just moved in next door. I'm Yang."},{"o":"Welcome! I'm Linda.","h":"问她在这里住多久了","a":"Nice to meet you, Linda. How long have you lived here?"},{"o":"Almost five years. It's a quiet street.","h":"问附近有没有好吃的","a":"That's great. Is there a good place to eat nearby?"},{"o":"The noodle place on the corner is great.","h":"再问什么时候收垃圾","a":"Thanks! Do you know when the trash is collected?"},{"o":"Tuesday mornings. Let me know if you need anything.","h":"道谢","a":"Thank you. It's nice to have you as a neighbor."}]}},{"t":"Emergencies","zh":"求助与紧急情况","k":"life","s":[["Help! Please call an ambulance.","救命！请叫救护车。"],["Someone fell down and isn't moving.","有人摔倒了，一动不动。"],["I lost my wallet.","我的钱包丢了。"],["I want to report a theft.","我要报案，东西被偷了。"],["I'm at the corner of Main Street and Fifth.","我在主街和第五街的路口。"],["Is there anyone here who speak function vq(v){ var s=(v.voiceURI||'')+' '+v.name; return /premium|高级/i.test(s)?3:/enhanced|增强/i.test(s)?2:0; }

function bestUS(exclude){
  var c=VOICES.filter(function(v){ return /en[-_]US/i.test(v.lang) && (!exclude || v.voiceURI!==exclude.voiceURI); });
  var sc=function(v){ return vq(v)*10+(/Samantha|Ava|Zoe|Evan|Nathan|Tom/i.test(v.name)?1:0); };
  c.sort(function(a,b){ return sc(b)-sc(a); });

}
function v1(){
  if(!VOICES.length) loadVoices();
  var pick=VOICES.filter(function(v){ return v.voiceURI===S().voice || v.name===S().voice; })[0];

  return pick || VOICES.filter(function(v){ return /en[-_]US/i.test(v.lang) && /Samantha/i.test(v.name); })[0] || VOICES.filter(function(v){ return /en[-_]US/i.test(v.lang); })[0] || VOICES[0] || null;
}
function v2(){
  var a=v1(); var b=bestUS(a);
  if(b && vq(b)===0){ var m=VOICES.filter(function(v){ return /en[-_]US/i.test(v.lang) && (!a || v.voiceURI!==a.voiceURI) && /Aaron|Fred|Alex|Nicky|Evan|Nathan|Tom/i.test(v.name); })[0]; if(m) b=m; }

  for(i=1;i<=nd;i++){ var ds3=RM+'-'+pad(i), mm=dayMin(ds3); var col=el('div','c'+(status(ds3)==='full'?' full':'')); col.style.height=(mm/max*100)+'%'; col.title=cn(ds3)+'：'+Math.round(mm)+' 分钟'; chart.append(col); xl.append(el('span',null,(i===1||i%5===0)?String(i):'')); }
  sx.append(chart, xl); ch.append(sx); m.append(ch);
  // advice
  var adv=[];
  if(dates.length){
    var base=dates.filter(function(x){ return x<TODAY || status(x); }).length||1;
    var rate=studied/base;
    if(rate<0.7) adv.push('学习的天数不到七成。下个月先保证每天至少做到保底的 '+S().floor+' 分钟，不断比做得多更重要。');
    if(studied && mins/studied < S().goal*0.8) adv.push('学习日平均不到目标的八成。可以把复听放到通勤、吃饭等零碎时间，开着计时器。');
    if(scenes < lessons*0.7) adv.push('场景口语做得比精听少。开口是你的主要目标，晚上这 15 分钟尽量不要跳过。');
    if(dueList().length>40) adv.push('有 '+dueList().length+' 个单词积压待复习。先清复习，可以在设置里把每天新词数调低一点。');
    if(!adv.length && studied) adv.push('节奏很好，保持现在的安排。');
  }
  if(adv.length){ var ac=el('section','card stack'); ac.append(el('h3',null,'下个月的建议')); var ul=el('ul','advice'); adv.forEach(function(t){ ul.append(el('li',null,t)); }); ac.append(ul);
    var txt=RM+' 学习小结：达标 '+full+' 天，保底 '+floor+' 天，总共 '+fmtMin(mins)+'；精听 '+lessons+' 次，场景 '+scenes+' 次；新学单词 '+newW+' 个，掌握 '+mastered+' 个。当前进度：'+lessonTitle(D.listen[Math.min(state.prog.listen,D.listen.length-1)])+'。';
    ac.append(btn('复制小结（发给 Claude 调整计划）','sm',function(){ copy(txt); })); m.append(ac); }
  // my words
  var mw=el('section','card stack'); mw.append(el('h3',null,'我的生词本'), addWordForm('生词'));
  var ul2=el('ul','wl');
  if(!state.my.length) ul2.append(el('li','muted','听力和对话里遇到的生词记在这里，会自动加入每天的复习。'));
  state.my.slice(0,200).forEach(function(x){ var li=el('li'); var l=el('div'); l.append(el('span','w',x.w), el('span','muted',' '+(x.m||''))); var s=ws('my:'+x.id);
    var rr=el('div','row'); rr.append(el('span','small muted', s&&s.s==='m'?'已掌握':'加入 '+cn(x.date)), btn('🔊','sm',function(){ speak(x.w); }), delBtn(x)); li.append(l, rr); ul2.append(li); });
  mw.append(ul2); m.append(mw);
  if(notes.length){ var nc=el('section','card stack'); nc.append(el('h3',null,'本月备注')); notes.forEach(function(z){ var p=el('div'); p.append(el('span','mono small muted',cn(z[0])+'  '), document.createTextNode(z[1])); nc.append(p); }); m.append(nc); }
}
function delBtn(x){
  var b=btn('删除','sm',function(){ if(b.dataset.armed){ state.my=state.my.filter(function(y){ return y.id!==x.id; }); delete state.words['my:'+x.id]; save(); render(); return; } b.dataset.armed='1'; b.textContent='确认删除'; b.classList.add('warn'); setTimeout(function(){ if(b.isConnected){ delete b.dataset.armed; b.textContent='删除'; b.classList.remove('warn'); } },3000); });
  return b;
}

// ================= SETTINGS =================
function renderSettings(m){
  m.append(el('h1',null,'设置'));
  var c=el('section','card');
  function num(label, hint, key, min, max, step){
    var f=el('div','field'); var l=el('label'); l.htmlFor='set-'+key; l.append(document.createTextNode(label), el('span','hint',hint));
    var i=el('input'); i.type='number'; i.id='set-'+key; i.min=min; i.max=max; i.step=step; i.value=S()[key]; i.style.width='90px';
    i.addEventListener('change',function(){ var v=Math.max(min,Math.min(max,Number(i.value)||S()[key])); S()[key]=v; i.value=v; if(key==='newPerDay' && remainingScreen()===0){ var r=ensureToday(); r.nt=v; } save(); toast('已保存'); });
    f.append(l,i); return f;
  }
  function tog(label, hint, key){
    var f=el('div','field'); var l=el('label'); l.htmlFor='set-'+key; l.append(document.createTextNode(label), el('span','hint',hint));
    var i=el('input'); i.type='checkbox'; i.id='set-'+key; i.checked=!!S()[key]; i.style.width='24px'; i.style.height='24px';
    i.addEventListener('change',function(){ S()[key]=i.checked; save(); });
    f.append(l,i); return f;
  }
  c.append(num('每天目标（分钟）','学满这个时间并完成 4 项任务才算达标','goal',20,180,5));
  c.append(num('保底（分钟）','很忙的日子至少学这么久，每周最多 2 次','floor',5,60,5));
  c.append(num('每天新词数','筛词结束后每天学多少个新词','newPerDay',5,50,5));
  c.append(num('每天筛词数','筛词阶段每天过多少个词','batch',50,800,50));
  var kf=el('div','field'); var kl=el('label'); kl.htmlFor='set-skip'; kl.append(document.createTextNode('跳过前 N 个高频词'), el('span','hint','水平测试自动设定，也可以手动调整（0–'+N_NGSL+'）'));
  var ki=el('input'); ki.type='number'; ki.id='set-skip'; ki.min=0; ki.max=N_NGSL; ki.step=100; ki.value=state.skip||0; ki.style.width='90px';
  ki.addEventListener('change',function(){ var v=Math.max(0,Math.min(N_NGSL,Math.round(Number(ki.value)||0))); state.skip=v; state.placed=1; state.screenPos=0; ki.value=v; save(); toast('已保存'); });
  kf.append(kl,ki); c.append(kf);
  var rt=el('div','field'); var rl0=el('label'); rl0.append(document.createTextNode('重新做单词水平测试'), el('span','hint','已经学过的词不受影响')); rt.append(rl0, btn('重新测试','sm',function(){ state.placed=0; PT=null; save(); go('words'); })); c.append(rt);
  c.append(tog('复习时先只听发音','先听再看单词，训练耳朵','ear'));
  c.append(tog('自动朗读','出现新卡片和对话时自动读出来','auto'));
  // voice
  var vf=el('div','field'); var vl=el('label'); vl.htmlFor='set-voice'; vl.append(document.createTextNode('朗读声音'), el('span','hint','推荐带“高级”的美音，如 Ava、Zoe'));
  var sel=el('select'); sel.id='set-voice'; var o0=el('option',null,'自动选择'); o0.value=''; sel.append(o0);
  loadVoices(); VOICES.slice().sort(function(a,b){ return vq(b)-vq(a); }).forEach(function(v){ var o=el('option',null,vlabel(v)); o.value=v.voiceURI||v.name; sel.append(o); }); sel.value=S().voice||'';
  sel.addEventListener('change',function(){ S().voice=sel.value; save(); speak('Hello! This is how I sound.'); });
  vf.append(vl, sel); c.append(vf);
  var nprem=VOICES.filter(function(v){ return vq(v)>0; }).length;
  var vh=el('div','small muted'); vh.style.padding='0 0 12px';
  vh.textContent = nprem ? '找到 '+nprem+' 个高级/增强语音，程序会自动优先使用。' : '没有找到高级语音。想要更自然的朗读：iPad 设置 → 辅助功能 → 朗读内容 → 声音 → 英语 → 英语（美国），下载 Ava、Zoe 或 Evan 的“高级”版本，然后彻底关掉本程序再打开。';
  c.append(vh);
  var rf=el('div','field'); var rl=el('label'); rl.htmlFor='set-rate'; rl.append(document.createTextNode('朗读语速'), el('span','hint','0.9 比正常稍慢'));
  var rs=el('select'); rs.id='set-rate'; [0.7,0.8,0.9,1,1.1].forEach(function(v){ var o=el('option',null,String(v)); o.value=v; rs.append(o); }); rs.value=String(S().rate);
  rs.addEventListener('change',function(){ S().rate=Number(rs.value); save(); speak('This is the new speed.'); });
  rf.append(rl, rs); c.append(rf);
  m.append(c);
  // backup
  var b=el('section','card stack');
  b.append(el('h3',null,'备份'), el('div','small muted','所有进度都存在这台 iPad 上。删除主屏幕图标或清除 Safari 数据会丢失进度，所以每周导出一次备份，存到“文件”里。'));
  var row=el('div','row');
  row.append(btn('导出备份','pri',exportBackup));
  var fi=el('input'); fi.type='file'; fi.accept='.json,application/json'; fi.hidden=true; fi.id='importFile';
  fi.addEventListener('change',function(){ var f=fi.files[0]; if(!f) return; var rd=new FileReader(); rd.onload=function(){ try{ var s=JSON.parse(rd.result); if(!s||s.v!==3||!s.days) throw 0; state=s; state.settings=Object.assign({},DEF,s.settings||{}); save(); toast('已导入备份'); render(); }catch(e){ toast('这个文件不是本程序的备份'); } fi.value=''; }; rd.readAsText(f); });
  row.append(btn('导入备份','',function(){ fi.click(); }), fi);
  b.append(row); m.append(b);
  var info=el('section','card stack');
  info.append(el('h3',null,'关于词库'));
  info.append(el('div','small muted','单词来自 NGSL（新通用词表，约 2800 个日常高频词）和 NAWL（新学术词表，约 960 个），加上 108 个常用短语动词。音标和释义来自开源词典 ECDICT。听力课程：VOA Let\'s Learn English 1–2、BBC 6 Minute English、Crash Course Physics。'));
  m.append(info);
  var danger=el('section','card stack');
  danger.append(el('h3',null,'重新开始'), el('div','small muted','清空所有进度。建议先导出备份。'));
  var rb=btn('清空所有进度','warn',function(){ if(rb.dataset.armed){ localStorage.removeItem(LS); state=load(); TAB='today'; render(); toast('已清空'); return; } rb.dataset.armed='1'; rb.textContent='再点一次确认清空'; setTimeout(function(){ if(rb.isConnected){ delete rb.dataset.armed; rb.textContent='清空所有进度'; } },4000); });
  danger.append(rb); m.append(danger);
}
function exportBackup(){
  if(state.timer) stopTimer(true);
  var name='英语打卡备份-'+TODAY+'.json', txt=JSON.stringify(state);
  try {
    var file=new File([txt], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file], title:name}).catch(function(){}); return; }
  } catch(e){}
  try { var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'})); a.download=name; document.body.append(a); a.click(); a.remove(); toast('已导出到下载文件夹'); }
  catch(e){ toast('导出失败'); }
}

// ---------- render ----------
function render(){
  var m=$('main');
  var ae=document.activeElement;
  if(ae && ae.id==='note'){ day(TODAY).note=ae.value; save(); ae.blur(); }
  var y=window.scrollY;
  m.replaceChildren();
  m.className = TAB==='words'?'m-words':TAB==='scene'?'m-scene':'';
  var tb=timerBar(); if(tb) m.append(tb);
  if(TAB==='today') renderToday(m);
  else if(TAB==='words') renderWords(m);
  else if(TAB==='scene') renderScene(m);
  else if(TAB==='records') renderRecords(m);
  else renderSettings(m);
  renderNav();
  window.scrollTo(0,y);
}
function tick(){
  checkStale();
  if(state.timer){
    var c=$('timerClock'); if(c) c.textContent=clock(Date.now()-state.timer.start);
    var tm=$('todayMin'); if(tm) tm.textContent=String(Math.floor(dayMin(TODAY)));
    var f=$('todayFill'); if(f) f.style.width=Math.min(100,dayMin(TODAY)/S().goal*100)+'%';
    var sp=document.querySelector('[data-spent="'+state.timer.task+'"]'); if(sp) sp.textContent='今天已学 '+Math.round(taskMin(state.timer.task))+' 分钟';
  }
  var t=ymd(new Date());
  if(t!==TODAY){ TODAY=t; WS={phase:null,stage:0,key:null,spoken:null,undo:null}; SV=null; render(); }
}
setInterval(tick, 1000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ tick(); render(); } });
checkStale();
render();
})();
</script>
